<!doctype html><html><head><meta charset="utf-8"><title>Letterpress</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#efe6d2;font-family:Georgia,serif;color:#2b2622;overflow:hidden;position:relative}
nav{position:absolute;left:0;top:0;width:1280px;height:84px;display:flex;align-items:center;padding:0 70px;font-size:16px;border-bottom:2px solid #2b2622}nav b{font-size:24px}nav span{margin-left:34px}nav .f{margin-left:auto}
.big{position:absolute;left:640px;top:110px;font-size:620px;line-height:1;color:#d1422f;font-weight:700}
h1{position:absolute;left:70px;top:200px;font-size:64px;font-weight:400;font-style:italic;line-height:1.08;width:520px}
.sub{position:absolute;left:70px;top:420px;width:440px;font-size:19px;line-height:1.6}

<h1 data-r="headline" data-must>Printed by hand, one sheet at a time</h1>
