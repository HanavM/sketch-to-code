<!doctype html><html><head><meta charset="utf-8"><title>RSVP</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#eef0f6;font-family:Helvetica,Arial,sans-serif;color:#222639;overflow:hidden;position:relative}
.card{position:absolute;left:340px;top:70px;width:600px;height:760px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(30,40,80,.08);overflow:hidden}
.ban{height:170px;background:#5b5bd6;color:#fff;padding:36px 40px}.ban small{font-size:14px;opacity:.85}.ban h1{font-size:32px;margin-top:10px}
.body{padding:30px 40px}.lbl{font-size:14px;font-weight:700;color:#555a70;margin:18px 0 8px}
.in{height:48px;border:1px solid #d6d9e4;border-radius:8px;padding:0 14px;display:flex;align-items:center;color:#9a9fb3;font-size:15px}
.seg{display:flex;gap:12px}.seg div{flex:1;height:48px;border:1px solid #d6d9e4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}.seg .on{background:#5b5bd6;border-color:#5b5bd6;color:#fff}
.go{margin-top:30px;height:54px;border-radius:10px;background:#222639;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="card" data-r="card" data-must>
<div class="ban" data-r="banner" data-must><small>Sat 22 Nov · 7 pm · The Glasshouse</small><h1>Maya &amp; Tom's party</h1></div>
<div class="body"><div class="lbl">Will you come?</div><div class="seg" data-r="choice" data-must><div class="on">Yes</div><div>Maybe</div><div>No</div></div>
<div class="lbl">Your name</div><div class="in" data-r="fields">Full name</div>
<div class="lbl">Email</div><div class="in">you@example.com</div>
<div class="lbl">Guests</div><div class="in">Just me</div>
<div class="go" data-r="send" data-must>Send RSVP</div></div></div>
</body></html>
