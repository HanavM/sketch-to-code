<!doctype html><html><head><meta charset="utf-8"><title>Adopt</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#2a2a2a;overflow:hidden;position:relative}
header{position:absolute;left:0;top:0;width:1280px;height:72px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 48px;font-size:15px}header b{font-size:22px;color:#e07a3f}header span{margin-left:30px}header .f{margin-left:auto}
.filt{position:absolute;left:48px;top:110px;width:240px}.filt h3{font-size:16px;margin:22px 0 12px}.filt h3:first-child{margin-top:0}.ck{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:10px;color:#555}.ck i{width:18px;height:18px;border:2px solid #bbb;border-radius:4px}.ck i.on{background:#e07a3f;border-color:#e07a3f}
h1{position:absolute;left:330px;top:104px;font-size:28px}
.cards{position:absolute;left:330px;top:160px;width:900px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.cd{border:1px solid #eee;border-radius:14px;overflow:hidden}.cd .p{height:180px;background:#f3e3d3}.cd div{padding:14px 16px}.cd b{font-size:18px}.cd small{display:block;color:#888;font-size:14px;margin-top:6px}
</style></head><body>
<header data-r="header"><b data-r="logo">Pawhome</b><span class="f">Dogs</span><span>Cats</span><span>Donate</span></header>
<div class="filt" data-r="filters" data-must><h3>Animal</h3><div class="ck"><i class="on"></i>Dogs</div><div class="ck"><i></i>Cats</div><div class="ck"><i></i>Rabbits</div><h3>Age</h3><div class="ck"><i></i>Puppy</div><div class="ck"><i class="on"></i>Adult</div><div class="ck"><i></i>Senior</div><h3>Size</h3><div class="ck"><i></i>Small</div><div class="ck"><i class="on"></i>Medium</div><div class="ck"><i></i>Large</div></div>
<h1 data-r="title" data-must>18 dogs near you</h1>
<div class="cards" data-r="cards" data-must>
<div class="cd"><i class="p" style="display:block"></i><div><b>Biscuit</b><small>3 yrs · Terrier mix</small></div></div>
<div class="cd"><i class="p" style="display:block;background:#dde6d5"></i><div><b>Juno</b><small>5 yrs · Collie</small></div></div>
<div class="cd"><i class="p" style="display:block;background:#d9dfe8"></i><div><b>Pepper</b><small>2 yrs · Spaniel</small></div></div>
<div class="cd"><i class="p" style="display:block;background:#e8dbe6"></i><div><b>Otis</b><small>4 yrs · Beagle</small></div></div>
<div class="cd"><i class="p" style="display:block"></i><div><b>Maple</b><small>6 yrs · Lab mix</small></div></div>
<div class="cd"><i class="p" style="display:block;background:#dde6d5"></i><div><b>Rio</b><small>3 yrs · Whippet</small></div></div></div>
</body></html>
