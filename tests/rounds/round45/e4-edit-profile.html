<!doctype html><html><head><meta charset="utf-8"><title>Profile</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f8fafc;font-family:Helvetica,Arial,sans-serif;color:#0f172a;overflow:hidden;position:relative}
.top{position:absolute;left:0;top:0;width:1280px;height:68px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 40px;font-size:15px}.top b{font-size:20px}.top i{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#fbbf24}
.card{position:absolute;left:290px;top:110px;width:700px;height:740px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:36px 44px}
h1{font-size:26px}.av{margin-top:28px;display:flex;align-items:center}.av i{width:96px;height:96px;border-radius:50%;background:#fbbf24}.av span{margin-left:22px;padding:10px 18px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-weight:600}
label{display:block;margin-top:24px;font-size:14px;font-weight:600;color:#334155}.f{margin-top:8px;height:46px;border:1px solid #cbd5e1;border-radius:8px;display:flex;align-items:center;padding:0 14px;font-size:15px;color:#475569}
.row{display:flex;gap:20px}.row>div{flex:1}.bio{height:90px;align-items:flex-start;padding-top:12px}
.btns{position:absolute;left:44px;bottom:36px;right:44px;display:flex;justify-content:flex-end;gap:14px}.btns div{width:120px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:1px solid #cbd5e1}.btns .s{background:#0f172a;color:#fff;border-color:#0f172a}
</style></head><body>
<div class="top" data-r="topbar"><b data-r="logo">Ledger</b><i></i></div>
<div class="card" data-r="card" data-must><h1 data-r="title">Edit profile</h1>
<div class="av" data-r="avatar-row" data-must><i></i><span>Change photo</span></div>
<div class="row" data-r="name-row"><div><label>First name</label><div class="f">Maya</div></div><div><label>Last name</label><div class="f">Okafor</div></div></div>
<label>Email</label><div class="f" data-r="email-field">maya@ledger.io</div>
<label>Bio</label><div class="f bio" data-r="bio-field">Designer in Lagos. Likes maps.</div>
<div class="btns" data-r="buttons" data-must><div>Cancel</div><div class="s">Save</div></div></div>
</body></html>
