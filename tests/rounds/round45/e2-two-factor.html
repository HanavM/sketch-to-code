<!doctype html><html><head><meta charset="utf-8"><title>Verify</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#111827;overflow:hidden;position:relative}
.side{position:absolute;left:0;top:0;width:520px;height:900px;background:#4338ca}
.side b{position:absolute;left:60px;top:60px;font-size:26px;color:#fff}.side p{position:absolute;left:60px;top:640px;width:380px;font-size:30px;line-height:1.3;color:#e0e7ff;font-weight:700}
h1{position:absolute;left:640px;top:250px;font-size:34px}
.help{position:absolute;left:640px;top:310px;width:480px;font-size:16px;color:#6b7280;line-height:1.5}
.code{position:absolute;left:640px;top:390px;width:504px;height:72px;display:flex;gap:12px}
.code div{flex:1;border:2px solid #d1d5db;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}.code div.on{border-color:#4338ca}
.btn{position:absolute;left:640px;top:500px;width:504px;height:54px;border-radius:10px;background:#4338ca;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.resend{position:absolute;left:640px;top:580px;font-size:15px;color:#4338ca}
</style></head><body>
<div class="side" data-r="side-panel" data-must><b data-r="logo">Keyway</b><p data-r="side-quote">Your account, locked tight.</p></div>
<h1 data-r="title" data-must>Enter the 6-digit code</h1>
<p class="help" data-r="help">We sent it to the phone ending in 42.</p>
<div class="code" data-r="code-boxes" data-must><div>4</div><div>8</div><div>1</div><div class="on"></div><div></div><div></div></div>
<div class="btn" data-r="button" data-must>Verify</div>
<p class="resend" data-r="resend">Resend code in 0:24</p>
</body></html>
