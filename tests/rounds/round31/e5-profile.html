<!doctype html><html><head><meta charset="utf-8"><title>Profile</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f8fafc;font-family:Helvetica,Arial,sans-serif;color:#0f172a;overflow:hidden}
.cover{height:220px;background:linear-gradient(120deg,#14b8a6,#6366f1)}
.head{display:flex;align-items:flex-end;gap:24px;padding:0 80px;margin-top:-70px}
.av{width:150px;height:150px;border-radius:50%;background:#f59e0b;border:6px solid #f8fafc}
.name{padding-bottom:14px;flex:1}.name h1{font-size:32px}.name span{color:#64748b;font-size:16px}
.follow{margin-bottom:22px;padding:13px 30px;background:#0f172a;color:#fff;border-radius:10px;font-weight:700}
.stats{display:flex;gap:48px;padding:30px 80px;font-size:15px;color:#64748b}.stats b{display:block;font-size:24px;color:#0f172a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:10px 80px}
.g{height:230px;border-radius:14px;background:#cbd5e1}.g:nth-child(2){background:#99f6e4}.g:nth-child(3){background:#c7d2fe}
</style></head><body>
<div class="cover" data-r="cover" data-must></div>
<div class="head" data-r="profile-head" data-must><div class="av" data-r="avatar" data-must></div><div class="name"><h1 data-r="name">Jonah Ferreira</h1><span>Ceramicist · Porto</span></div><div class="follow" data-r="follow" data-must>Follow</div></div>
<div class="stats" data-r="stats"><div><b>128</b>Pieces</div><div><b>4.2k</b>Followers</div><div><b>310</b>Following</div></div>
<div class="grid" data-r="gallery" data-must><div class="g"></div><div class="g"></div><div class="g"></div></div>
</body></html>
