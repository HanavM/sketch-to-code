<!doctype html><html><head><meta charset="utf-8"><title>Stacked cards</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#e8ecff;font-family:Helvetica,Arial,sans-serif;color:#141a3a;overflow:hidden;position:relative}
nav{padding:34px 72px;font-weight:800;font-size:22px}
h1{position:absolute;left:72px;top:170px;width:520px;font-size:76px;line-height:1;font-weight:800;letter-spacing:-2px}
p{position:absolute;left:76px;top:440px;width:440px;font-size:19px;line-height:1.5;color:#4a5280}
.btn{position:absolute;left:76px;top:560px;padding:18px 34px;background:#4f5bff;color:#fff;font-weight:700;border-radius:10px;font-size:17px}
.btn2{position:absolute;left:290px;top:560px;padding:16px 30px;border:2px solid #141a3a;font-weight:700;border-radius:10px;font-size:17px}
.card{position:absolute;width:340px;height:220px;border-radius:20px;padding:28px;color:#fff;font-weight:700;font-size:20px;box-shadow:0 18px 40px rgba(20,26,58,.25)}
.k1{left:720px;top:170px;background:#141a3a;transform:rotate(-8deg)}.k2{left:780px;top:310px;background:#4f5bff;transform:rotate(4deg)}.k3{left:840px;top:460px;background:#ff6b9a;transform:rotate(-3deg)}
.num{font-family:monospace;font-size:18px;margin-top:90px;letter-spacing:3px;font-weight:400}
</style></head><body>
<nav data-r="logo">plastik</nav>
<h1 data-r="headline" data-must>One card for every trip.</h1>
<p data-r="subhead">Spend in 40 currencies with no fees, and split the bill before the dessert arrives.</p>
<div class="btn" data-r="cta" data-must>Get your card</div><div class="btn2" data-r="cta2">See fees</div>
<div class="card k1" data-r="card-back" data-must>plastik<div class="num">•••• 4821</div></div>
<div class="card k2" data-r="card-middle" data-must>plastik<div class="num">•••• 0937</div></div>
<div class="card k3" data-r="card-front" data-must>plastik<div class="num">•••• 6610</div></div>
</body></html>
