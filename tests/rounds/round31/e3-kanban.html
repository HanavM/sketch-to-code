<!doctype html><html><head><meta charset="utf-8"><title>Kanban</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f1f5f9;font-family:Helvetica,Arial,sans-serif;color:#0f172a;overflow:hidden}
header{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;font-weight:700;font-size:18px}
header span{font-size:14px;font-weight:600;background:#22c55e;padding:9px 16px;border-radius:8px}
.cols{display:flex;gap:20px;padding:28px 32px}
.col{width:290px;background:#e2e8f0;border-radius:12px;padding:16px}.col h3{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:#475569;margin-bottom:14px}
.t{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tag{display:inline-block;margin-top:10px;font-size:12px;padding:3px 9px;border-radius:10px;font-weight:700}
.p{background:#fce7f3;color:#be185d}.g{background:#dcfce7;color:#15803d}.o{background:#ffedd5;color:#c2410c}
</style></head><body>
<header data-r="topbar" data-must>Website relaunch<span>+ New task</span></header>
<div class="cols">
<div class="col" data-r="col-todo" data-must><h3>To do · 3</h3><div class="t">Write pricing copy<br><span class="tag p">Copy</span></div><div class="t">Pick hero photo<br><span class="tag o">Design</span></div><div class="t">Set up redirects<br><span class="tag g">Dev</span></div></div>
<div class="col" data-r="col-doing" data-must><h3>In progress · 2</h3><div class="t">New nav component<br><span class="tag g">Dev</span></div><div class="t">Logo refresh<br><span class="tag o">Design</span></div></div>
<div class="col" data-r="col-review" data-must><h3>Review · 1</h3><div class="t">About page draft<br><span class="tag p">Copy</span></div></div>
<div class="col" data-r="col-done" data-must><h3>Done · 4</h3><div class="t">Sitemap</div><div class="t">Analytics</div><div class="t">Font licence</div><div class="t">Domain transfer</div></div>
</div></body></html>
