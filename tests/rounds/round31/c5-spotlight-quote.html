<!doctype html><html><head><meta charset="utf-8"><title>Spotlight quote</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:radial-gradient(circle at 50% 40%,#3a2a6b 0%,#14102a 60%);font-family:Georgia,serif;color:#fff;overflow:hidden;position:relative;text-align:center}
nav{display:flex;justify-content:center;gap:40px;padding:36px;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#b9b0e0;letter-spacing:2px}
.mark{font-size:200px;line-height:1;color:#ffcc4d;height:130px;margin-top:40px}
blockquote{width:900px;margin:30px auto 0;font-size:50px;line-height:1.2;font-style:italic}
.who{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:56px;font-family:Helvetica,Arial,sans-serif;font-size:17px}
.av{width:64px;height:64px;border-radius:50%;background:#ffcc4d}
.who b{display:block;text-align:left}.who small{display:block;text-align:left;color:#b9b0e0;font-size:14px;margin-top:4px}
.dots{display:flex;gap:12px;justify-content:center;margin-top:60px}.dots i{width:12px;height:12px;border-radius:50%;background:#5a4f8c}.dots i:first-child{background:#ffcc4d;width:36px;border-radius:6px}
</style></head><body>
<nav data-r="nav"><span>STORIES</span><span>PRICING</span><span>CUSTOMERS</span><span>LOG IN</span></nav>
<div class="mark" data-r="quote-mark" data-must>“</div>
<blockquote data-r="quote" data-must>We shipped our whole spring catalogue in a weekend, and nobody stayed late.</blockquote>
<div class="who" data-r="person" data-must><div class="av" data-r="avatar"></div><div><b>Mara Ilves</b><small>Head of Design, Northloom</small></div></div>
<div class="dots" data-r="dots"><i></i><i></i><i></i><i></i></div>
</body></html>
