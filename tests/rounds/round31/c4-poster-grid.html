<!doctype html><html><head><meta charset="utf-8"><title>Poster grid</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f2efe8;font-family:Helvetica,Arial,sans-serif;color:#111;overflow:hidden;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:120px 1fr 1fr}
.top{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;padding:0 48px;border-bottom:3px solid #111;font-weight:800;font-size:28px;letter-spacing:-1px}
.top span{font-size:15px;font-weight:600;letter-spacing:0}
.c{border-right:3px solid #111;border-bottom:3px solid #111;padding:32px;position:relative}
.big{grid-row:2/4;background:#e63b2e;color:#f2efe8}.big h1{font-size:110px;line-height:.9;font-weight:900;letter-spacing:-4px;position:absolute;left:32px;bottom:36px}
.y{background:#f5c518}.b{background:#1d4ed8;color:#f2efe8}
.c h2{font-size:44px;font-weight:900;letter-spacing:-1px}.c p{margin-top:12px;font-size:16px;line-height:1.4;width:280px}
.dot{position:absolute;right:32px;bottom:32px;width:90px;height:90px;border-radius:50%;background:#111}
</style></head><body>
<div class="top" data-r="header" data-must>BOLD FEST<span>June 12–14 · Riverside Park</span></div>
<div class="c big" data-r="red-panel" data-must><h1 data-r="big-word">THREE<br>DAYS<br>LOUD</h1></div>
<div class="c y" data-r="yellow-panel" data-must><h2>Lineup</h2><p>Forty bands across four stages, announced in waves.</p><div class="dot"></div></div>
<div class="c" data-r="plain-panel"><h2>Tickets</h2><p>Weekend passes from 89. Day tickets on sale in May.</p></div>
<div class="c b" data-r="blue-panel" data-must><h2>Camping</h2><p>Pitch by the river, showers included.</p></div>
<div class="c" data-r="plain-panel-2"><h2>Map</h2><p>Getting there by train, bike or shuttle.</p></div>
</body></html>
