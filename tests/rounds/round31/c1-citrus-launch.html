<!doctype html><html><head><meta charset="utf-8"><title>Citrus launch</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff6e0;font-family:Helvetica,Arial,sans-serif;color:#1f2a1a;overflow:hidden;position:relative}
nav{display:flex;justify-content:space-between;align-items:center;padding:34px 80px;font-size:15px}
.logo{font-weight:800;font-size:24px;letter-spacing:-1px}.links{display:flex;gap:34px}
.sun{position:absolute;left:700px;top:150px;width:460px;height:460px;border-radius:50%;background:#ffb100}
.slice{position:absolute;left:790px;top:240px;width:280px;height:280px;border-radius:50%;background:#ffd84d;border:14px solid #fff6e0}
h1{position:absolute;left:80px;top:200px;width:620px;font-size:96px;line-height:.95;font-weight:800;letter-spacing:-3px}
p{position:absolute;left:84px;top:520px;width:460px;font-size:20px;line-height:1.45;color:#4b5a40}
.cta{position:absolute;left:84px;top:650px;width:210px;height:60px;border-radius:30px;background:#1f2a1a;color:#fff6e0;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.leaf{position:absolute;left:1040px;top:120px;width:120px;height:70px;border-radius:0 70px 0 70px;background:#3d8b37;transform:rotate(-20deg)}
.strip{position:absolute;left:0;bottom:0;width:1280px;height:90px;background:#3d8b37;color:#fff6e0;display:flex;align-items:center;justify-content:space-around;font-weight:700;font-size:18px;letter-spacing:2px}
</style></head><body>
<nav data-r="nav"><div class="logo" data-r="logo">zest</div><div class="links"><span>Flavours</span><span>Stockists</span><span>Story</span><span>Shop</span></div></nav>
<div class="sun" data-r="orange" data-must></div><div class="slice" data-r="inner-circle"></div><div class="leaf" data-r="leaf"></div>
<h1 data-r="headline" data-must>Squeezed this morning.</h1>
<p data-r="subhead">Cold-pressed juice from whole fruit, bottled the same day and on your doorstep by noon.</p>
<div class="cta" data-r="cta" data-must>Order a crate</div>
<div class="strip" data-r="strip" data-must><span>NO SUGAR ADDED</span><span>•</span><span>NEVER FROM CONCENTRATE</span><span>•</span><span>GLASS BOTTLES</span></div>
</body></html>
