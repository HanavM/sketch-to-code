<!doctype html><html><head><meta charset="utf-8"><title>Ceramics</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#efe6d8;font-family:Helvetica,Arial,sans-serif;color:#3b2a20;overflow:hidden;position:relative}
.left{position:absolute;left:0;top:0;width:520px;height:900px;background:#b5562f;color:#fbefe3}
