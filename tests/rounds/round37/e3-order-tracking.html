<!doctype html><html><head><meta charset="utf-8"><title>Order tracking</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f3f4f6;font-family:Helvetica,Arial,sans-serif;color:#111827;overflow:hidden;position:relative}
header{position:absolute;left:0;top:0;width:1280px;height:70px;background:#fff;display:flex;align-items:center;padding:0 56px;justify-content:space-between;font-size:15px;border-bottom:1px solid #e5e7eb}

.map{position:absolute;left:56px;top:370px;width:700px;height:470px;border-radius:14px;background:#d1e7dd;overflow:hidden}
.road{position:absolute;background:#fff}
.pin{position:absolute;left:420px;top:200px;width:30px;height:30px;border-radius:50%;background:#059669;border:5px solid #fff}
.items{position:absolute;left:786px;top:370px;width:438px;height:470px;background:#fff;border-radius:14px;padding:28px}
.items b{font-size:18px}.it{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #f0f1f3;font-size:15px}.it i{width:56px;height:56px;border-radius:10px;background:#e5e7eb}.it em{margin-left:auto;font-style:normal;font-weight:700}
.tot{display:flex;justify-content:space-between;margin-top:22px;font-size:17px;font-weight:800}
</style></head><body>
