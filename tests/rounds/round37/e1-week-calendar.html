<!doctype html><html><head><meta charset="utf-8"><title>Week calendar</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#1f2430;overflow:hidden;position:relative}
header{position:absolute;left:0;top:0;width:1280px;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid #e5e7eb}
header b{font-size:22px}.seg{display:flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden;font-size:14px}.seg span{padding:10px 18px}.seg .on{background:#1f2430;color:#fff}
.new{width:130px;height:42px;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.days{position:absolute;left:110px;top:72px;width:1130px;height:60px;display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid #e5e7eb;font-size:14px;color:#6b7280;align-items:center}
.days div{padding-left:14px}.days b{font-size:20px;color:#1f2430;margin-left:6px}
.times{position:absolute;left:40px;top:132px;width:60px;font-size:13px;color:#9ca3af}
.times div{height:96px}
.gridl{position:absolute;left:110px;width:1130px;height:1px;background:#f0f1f3}
.col{position:absolute;top:132px;width:1px;height:768px;background:#f0f1f3}
.ev{position:absolute;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700}.ev span{display:block;font-weight:400;font-size:13px;margin-top:4px}
</style></head><body>
<header data-r="header"><b>October 2026</b><div class="seg" data-r="view-switch"><span>Day</span><span class="on">Week</span><span>Month</span></div><div class="new" data-r="new-event">+ New event</div></header>

<div class="col" style="left:336px"></div><div class="col" style="left:562px"></div><div class="col" style="left:788px"></div><div class="col" style="left:1014px"></div>

</body></html>
