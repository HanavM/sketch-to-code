<!doctype html><html><head><meta charset="utf-8"><title>Bakery</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fbf4e8;font-family:Helvetica,Arial,sans-serif;color:#4a2e1c;overflow:hidden;position:relative}
nav{position:absolute;left:0;top:0;width:1280px;height:80px;display:flex;justify-content:space-between;align-items:center;padding:0 72px;font-size:15px;border-bottom:1px solid #e6d6bf}
.logo{font-family:Georgia,serif;font-size:24px;font-style:italic}.links{display:flex;gap:30px}
h1{position:absolute;left:72px;top:190px;width:560px;font-family:Georgia,serif;font-size:76px;line-height:1.05;font-weight:400}
p{position:absolute;left:76px;top:470px;width:440px;font-size:18px;line-height:1.5;color:#7a5a44}
.pills{position:absolute;left:76px;top:580px;display:flex;gap:14px}.pills div{height:46px;padding:0 24px;border-radius:23px;background:#4a2e1c;color:#fbf4e8;font-weight:700;font-size:15px;display:flex;align-items:center}
.pills div+div{background:none;border:2px solid #4a2e1c;color:#4a2e1c}
.loaf{position:absolute;left:720px;top:150px;width:480px;height:480px;border-radius:50%;background:#e0a96d}
.badge{position:absolute;left:690px;top:520px;width:150px;height:150px;border-radius:50%;background:#4a2e1c;color:#fbf4e8;font-weight:800;font-size:17px;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center}
.hours{position:absolute;left:72px;top:760px;width:1136px;display:flex;justify-content:space-between;font-size:16px;border-top:1px solid #e6d6bf;padding-top:26px}
</style></head><body>
<nav data-r="nav"><div class="logo" data-r="logo">Crumb & Co.</div><div class="links"><span>Bread</span><span>Pastry</span><span>Order</span></div></nav>
<h1 data-r="headline" data-must>Sourdough, baked before sunrise.</h1>
<p data-r="subhead">Two ovens, one starter, and a queue out the door by seven.</p>
<div class="pills" data-r="buttons"><div>Order a loaf</div><div>Our menu</div></div>
<div class="loaf" data-r="picture" data-must></div><div class="badge" data-r="badge" data-must>Since<br>1998</div>
<div class="hours" data-r="hours"><span>Mon – Fri 6am – 2pm</span><span>Sat 7am – 1pm</span><span>12 Mill Lane</span></div>
