<!doctype html><html><head><meta charset="utf-8"><title>Mountain hut</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:linear-gradient(180deg,#ffb38a 0%,#ffe2c4 60%);font-family:Georgia,serif;color:#24323f;overflow:hidden;position:relative}
nav{position:absolute;left:0;top:0;width:1280px;display:flex;justify-content:space-between;align-items:center;padding:30px 72px;font-family:Helvetica,Arial,sans-serif;font-size:15px}
.logo{font-weight:800;font-size:20px;letter-spacing:4px}.links{display:flex;gap:30px}
.sun{position:absolute;left:820px;top:170px;width:200px;height:200px;border-radius:50%;background:#ff7a45}
.back{position:absolute;left:0;top:300px;width:1280px;height:600px;background:#7a8fa6;clip-path:polygon(0 60%,22% 20%,40% 50%,62% 0,85% 45%,100% 25%,100% 100%,0 100%)}
.front{position:absolute;left:0;top:480px;width:1280px;height:420px;background:#3d5468;clip-path:polygon(0 40%,30% 0,55% 55%,78% 15%,100% 50%,100% 100%,0 100%)}
.snow{position:absolute;left:316px;top:480px;width:140px;height:70px;background:#fff;clip-path:polygon(50% 0,100% 100%,70% 80%,50% 100%,30% 80%,0 100%)}
h1{position:absolute;left:72px;top:130px;width:620px;font-size:72px;line-height:1.05;font-style:italic;font-weight:400}
p{position:absolute;left:76px;top:310px;width:420px;font-family:Helvetica,Arial,sans-serif;font-size:18px;line-height:1.5}
.card{position:absolute;left:840px;top:640px;width:360px;height:180px;background:#fffaf3;border-radius:10px;padding:24px 28px;font-family:Helvetica,Arial,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.card b{display:block;font-size:20px;margin-bottom:8px}.card span{font-size:15px;color:#5b6773}
.card div{margin-top:22px;width:150px;height:44px;border-radius:22px;background:#24323f;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<nav data-r="nav"><div class="logo" data-r="logo">HÜTTE</div><div class="links"><span>Routes</span><span>Rooms</span><span>Food</span><span>Book</span></div></nav>
<div class="sun" data-r="sun" data-must></div>
<div class="back" data-r="far-peaks" data-must></div><div class="front" data-r="near-peaks" data-must></div><div class="snow" data-r="snowcap"></div>
<h1 data-r="headline" data-must>A bed above the clouds.</h1>
<p data-r="subhead">Twelve bunks at 2,400 metres, hot soup, and the best sunrise in the valley.</p>
<div class="card" data-r="booking-card"><b>Open June to October</b><span>Beds from 45 a night, dinner included.</span><div>Reserve a bunk</div></div>
</body></html>
