<!doctype html><html><head><meta charset="utf-8"><title>Chess club</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fbfaf6;font-family:Helvetica,Arial,sans-serif;color:#141414;overflow:hidden;position:relative}
nav{position:absolute;left:0;top:0;width:1280px;display:flex;justify-content:space-between;align-items:center;padding:30px 64px;font-size:15px;border-bottom:2px solid #141414}
.logo{font-family:Georgia,serif;font-weight:700;font-size:24px}.links{display:flex;gap:28px}
.board{position:absolute;left:700px;top:150px;width:480px;height:480px;display:grid;grid-template-columns:repeat(6,1fr);border:4px solid #141414}
.board i{display:block}.board i:nth-child(odd){background:#141414}
.board i:nth-child(n+7):nth-child(-n+12):nth-child(odd){background:#fbfaf6}.board i:nth-child(n+7):nth-child(-n+12):nth-child(even){background:#141414}
.board i:nth-child(n+19):nth-child(-n+24):nth-child(odd){background:#fbfaf6}.board i:nth-child(n+19):nth-child(-n+24):nth-child(even){background:#141414}
.board i:nth-child(n+31):nth-child(-n+36):nth-child(odd){background:#fbfaf6}.board i:nth-child(n+31):nth-child(-n+36):nth-child(even){background:#141414}
.piece{position:absolute;left:880px;top:330px;width:120px;height:120px;border-radius:50%;background:#2f6df6;border:6px solid #fbfaf6}
h1{position:absolute;left:64px;top:160px;width:580px;font-family:Georgia,serif;font-size:84px;line-height:1;font-weight:700}
p{position:absolute;left:66px;top:440px;width:460px;font-size:19px;line-height:1.5;color:#444}
.cta{position:absolute;left:66px;top:560px;width:210px;height:56px;background:#2f6df6;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.cta2{position:absolute;left:296px;top:560px;width:180px;height:56px;border:2px solid #141414;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.strip{position:absolute;left:0;top:700px;width:1280px;height:200px;background:#141414;color:#fbfaf6;display:flex;justify-content:space-around;align-items:center;text-align:center}
.strip b{display:block;font-family:Georgia,serif;font-size:52px}.strip span{font-size:15px;color:#b9b9b9}
</style></head><body>
<nav data-r="nav"><div class="logo" data-r="logo">Open File</div><div class="links"><span>Club nights</span><span>Lessons</span><span>Ladder</span><span>Join</span></div></nav>

<div class="piece" data-r="piece"></div>
<h1 data-r="headline" data-must>Every Tuesday, every level.</h1>
<p data-r="subhead">Casual games, a rated ladder and coffee in the back of the old library. First night free.</p>
<div class="cta" data-r="cta">Come play</div><div class="cta2" data-r="cta-2">See lessons</div>
