<!doctype html><html><head><meta charset="utf-8"><title>Bauhaus tiles</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f2ead8;font-family:Helvetica,Arial,sans-serif;color:#1b1b1b}
.g{position:absolute;left:0;top:0;width:1280px;height:900px;display:grid;grid-template-columns:repeat(8,160px);grid-template-rows:repeat(6,150px)}
.g div{position:relative;overflow:hidden}
.qa{background:#e63946;border-radius:0 0 100% 0}.qb{background:#1d3557;border-radius:100% 0 0 0}.qc{background:#f4a261;border-radius:0 100% 0 0}
.hc{background:#1b1b1b;border-radius:80px 80px 0 0;margin-top:70px}.ci{background:#457b9d;border-radius:50%;margin:15px 20px}
.tr{background:#e9c46a;clip-path:polygon(0 100%,50% 0,100% 100%)}.sq{background:#1b1b1b}.st{background:repeating-linear-gradient(90deg,#1b1b1b 0 12px,transparent 12px 24px)}
.panel{position:absolute;left:320px;top:300px;width:640px;height:300px;background:#fff;border:4px solid #1b1b1b;padding:36px 40px}
.panel h1{font-size:72px;font-weight:900;line-height:.95;letter-spacing:-2px}.panel h1 span{color:#e63946}
.panel p{margin-top:18px;font-size:17px;line-height:1.5;width:420px}
.panel a{position:absolute;right:40px;bottom:36px;padding:14px 24px;background:#1b1b1b;color:#fff;font-weight:800}
</style></head><body>
<div class="g" data-r="shape-grid" data-must>
<div class="qa"></div><div class="ci"></div><div class="sq"></div><div class="tr"></div><div class="qb"></div><div class="st"></div><div class="hc"></div><div class="qc"></div>
<div class="hc"></div><div class="qc"></div><div class="st"></div><div class="qa"></div><div class="ci"></div><div class="tr"></div><div class="qb"></div><div class="sq"></div>
<div class="tr"></div><div class="qb"></div><div></div><div></div><div></div><div></div><div class="ci"></div><div class="qa"></div>
<div class="sq"></div><div class="st"></div><div></div><div></div><div></div><div></div><div class="hc"></div><div class="tr"></div>
<div class="ci"></div><div class="qa"></div><div class="qb"></div><div class="hc"></div><div class="qc"></div><div class="sq"></div><div class="st"></div><div class="ci"></div>
<div class="qc"></div><div class="tr"></div><div class="ci"></div><div class="st"></div><div class="sq"></div><div class="qa"></div><div class="qc"></div><div class="qb"></div></div>
<div class="panel" data-r="title-panel" data-must><h1>Form follows<br><span>fun.</span></h1><p>A centenary exhibition of shape, colour and play. Opens 4 March.</p><a>Book a visit</a></div>
</body></html>
