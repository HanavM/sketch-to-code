<!doctype html><html><head><meta charset="utf-8"><title>Arcade Night</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#0f0524;font-family:"Courier New",monospace;color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;left:0;top:560px;width:1280px;height:340px;background:repeating-linear-gradient(90deg,rgba(236,72,153,.55) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(236,72,153,.55) 0 2px,transparent 2px 56px)}
.sun{position:absolute;left:440px;top:170px;width:400px;height:400px;border-radius:50%;background:linear-gradient(#facc15,#ec4899)}
.bars{position:absolute;left:440px;top:420px;width:400px;height:150px;background:repeating-linear-gradient(0deg,#0f0524 0 10px,transparent 10px 30px)}
h1{position:absolute;left:0;top:70px;width:1280px;text-align:center;font-size:96px;font-weight:700;letter-spacing:8px;color:#22d3ee;text-shadow:0 0 18px #22d3ee}
.date{position:absolute;left:0;top:600px;width:1280px;text-align:center;font-size:28px;font-weight:700;color:#fff}
.ticket{position:absolute;left:520px;top:690px;width:240px;height:64px;border:3px solid #facc15;color:#facc15;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#0f0524}
.c{position:absolute;top:30px;font-size:15px;color:#c4b5fd}
</style></head><body>
<div class="c" style="left:40px" data-r="corner-left">PLAYER 1</div><div class="c" style="left:1130px" data-r="corner-right">HI 99999</div>
<h1 data-r="title" data-must>ARCADE NIGHT</h1>
<div class="sun" data-r="sun" data-must></div><div class="bars"></div>
<div class="grid" data-r="grid" data-must></div>
<div class="date" data-r="date">FRI 13 NOV · 8PM</div>
<div class="ticket" data-r="button" data-must>INSERT COIN</div>
</body></html>
