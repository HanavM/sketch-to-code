<!doctype html><html><head><meta charset="utf-8"><title>Paper Boats</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#e0f2fe;font-family:Helvetica,Arial,sans-serif;color:#0c4a6e;overflow:hidden;position:relative}
.w{position:absolute;left:-40px;width:1360px;border-radius:50% 50% 0 0}
h1{position:absolute;left:0;top:90px;width:1280px;text-align:center;font-size:64px;font-weight:800}
.sub{position:absolute;left:0;top:180px;width:1280px;text-align:center;font-size:20px;color:#0369a1}
.boat{position:absolute;width:0;height:0;border-left:70px solid transparent;border-right:70px solid transparent;border-top:60px solid #fff}
.sail{position:absolute;width:0;height:0;border-left:40px solid transparent;border-right:40px solid transparent;border-bottom:80px solid #fff}
.btn{position:absolute;left:530px;top:250px;width:220px;height:56px;border-radius:12px;background:#0c4a6e;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<h1 data-r="headline" data-must>Paper Boat Regatta</h1>
<div class="sub" data-r="subtitle">Fold one, float one. Sunday at the harbour pond.</div>
<div class="btn" data-r="button" data-must>Enter a boat</div>
<div class="sail" style="left:290px;top:400px" data-r="boat-1"></div><div class="boat" style="left:260px;top:480px"></div>
<div class="sail" style="left:880px;top:450px" data-r="boat-2"></div><div class="boat" style="left:850px;top:530px"></div>
<div class="w" style="top:560px;height:400px;background:#7dd3fc" data-r="wave-1" data-must></div>
<div class="w" style="top:660px;height:400px;background:#38bdf8;left:-200px;width:1100px" data-r="wave-2"></div>
<div class="w" style="top:740px;height:400px;background:#0284c7" data-r="wave-3" data-must></div>
</body></html>
