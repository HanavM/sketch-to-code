<!doctype html><html><head><meta charset="utf-8"><title>Home</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#18181b;font-family:Helvetica,Arial,sans-serif;color:#fafafa;overflow:hidden;position:relative}
h1{position:absolute;left:60px;top:50px;font-size:34px}.sub{position:absolute;left:60px;top:100px;font-size:16px;color:#a1a1aa}
.thermo{position:absolute;left:60px;top:170px;width:440px;height:660px;background:#27272a;border-radius:24px}
.ring{position:absolute;left:70px;top:90px;width:300px;height:300px;border-radius:50%;background:conic-gradient(#f97316 0 62%,#3f3f46 62% 100%)}
.ring div{position:absolute;left:24px;top:24px;width:252px;height:252px;border-radius:50%;background:#27272a;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:64px}.ring span{color:#a1a1aa;font-size:15px}
.thermo .lbl{position:absolute;left:36px;top:30px;font-size:20px;font-weight:700}
.pm{position:absolute;top:470px;width:80px;height:80px;border-radius:50%;background:#3f3f46;font-size:36px;display:flex;align-items:center;justify-content:center}
.tile{position:absolute;width:330px;height:200px;background:#27272a;border-radius:20px;padding:26px}
.tile b{display:block;font-size:20px;margin-top:70px}.tile span{font-size:14px;color:#a1a1aa}
.tile.on{background:#fafafa;color:#18181b}.tile.on span{color:#52525b}
.sw{position:absolute;right:26px;top:26px;width:56px;height:32px;border-radius:16px;background:#52525b}.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff}
.on .sw{background:#22c55e}.on .sw::after{left:28px}
.ic{position:absolute;left:26px;top:26px;width:40px;height:40px;border-radius:12px;background:#3f3f46}.on .ic{background:#fde047}
</style></head><body>
<h1 data-r="title">Good evening</h1><div class="sub" data-r="subtitle">4 devices on · 21° outside</div>
<div class="thermo" data-r="thermostat" data-must><div class="lbl">Living room</div><div class="ring"><div><b>22°</b><span>Heating</span></div></div><div class="pm" style="left:110px">−</div><div class="pm" style="left:250px">+</div></div>
<div class="tile on" style="left:540px;top:170px" data-r="tile-1" data-must><i class="ic"></i><i class="sw"></i><b>Ceiling light</b><span>Kitchen · 80%</span></div>
<div class="tile" style="left:890px;top:170px" data-r="tile-2"><i class="ic"></i><i class="sw"></i><b>Fan</b><span>Bedroom · off</span></div>
<div class="tile on" style="left:540px;top:400px" data-r="tile-3"><i class="ic"></i><i class="sw"></i><b>Speaker</b><span>Living room · playing</span></div>
<div class="tile" style="left:890px;top:400px" data-r="tile-4"><i class="ic"></i><i class="sw"></i><b>Front door</b><span>Locked</span></div>
<div class="tile on" style="left:540px;top:630px" data-r="tile-5"><i class="ic"></i><i class="sw"></i><b>Lamp</b><span>Study · 40%</span></div>
<div class="tile" style="left:890px;top:630px" data-r="tile-6"><i class="ic"></i><i class="sw"></i><b>Kettle</b><span>Kitchen · off</span></div>
</body></html>
