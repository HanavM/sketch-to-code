<!doctype html><html><head><meta charset="utf-8"><title>Flights</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f1f5f9;font-family:Helvetica,Arial,sans-serif;color:#0f172a;overflow:hidden;position:relative}
header{position:absolute;left:0;top:0;width:1280px;height:220px;background:#1e3a8a;color:#fff;padding:32px 60px}header b{font-size:24px}

.res{position:absolute;left:350px;width:870px;height:120px;background:#fff;border-radius:14px;display:flex;align-items:center;padding:0 30px;gap:30px}
.t{font-size:26px;font-weight:700}.t small{display:block;font-size:13px;color:#64748b;font-weight:400}
.line{flex:1;height:2px;background:#cbd5e1;position:relative}.line span{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:13px;color:#64748b}
.price{font-size:26px;font-weight:700;color:#1e3a8a;width:110px;text-align:right}
</style></head><body>
