<!doctype html><html><head><meta charset="utf-8"><title>Halftone poster</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#1d3fbb;font-family:Helvetica,Arial,sans-serif;color:#fff}
.dots{position:absolute;left:560px;top:80px;width:640px;height:640px;border-radius:50%;background-image:radial-gradient(#ffd60a 38%,transparent 40%);background-size:22px 22px}
.sun{position:absolute;left:700px;top:220px;width:360px;height:360px;border-radius:50%;background:#ffd60a}
h1{position:absolute;left:70px;top:190px;width:900px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:150px;line-height:.95;letter-spacing:-5px;font-weight:400}
.stamp{position:absolute;left:960px;top:610px;width:200px;height:200px;border-radius:50%;border:3px dashed #fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:18px;letter-spacing:2px;transform:rotate(12deg)}
.top{position:absolute;left:70px;top:50px;width:1140px;display:flex;justify-content:space-between;font-size:14px;letter-spacing:3px;border-bottom:2px solid #fff;padding-bottom:14px}
.info{position:absolute;left:70px;top:620px;display:flex;gap:60px;font-size:15px;line-height:1.6}
.info b{display:block;font-size:30px}
.tix{position:absolute;left:70px;top:790px;padding:16px 34px;background:#ffd60a;color:#1d3fbb;font-weight:800;font-size:17px;border-radius:4px}
</style></head><body>
<div class="top" data-r="top-bar"><b>SOLSTICE FEST</b><span>LINE-UP · TICKETS · MAP</span></div>
<div data-r="halftone-sun" data-must style="position:absolute;left:560px;top:80px;width:640px;height:640px"><div class="dots" style="left:0;top:0"></div><div class="sun" style="left:140px;top:140px"></div></div>
<h1 data-r="headline" data-must>Longest<br>day of<br>the year</h1>
<div class="info" data-r="info-row"><div><b>21.06</b>Saturday</div><div><b>3 stages</b>40 artists</div><div><b>Riverside</b>Gates 14:00</div></div>
<a class="tix" data-r="cta" data-must>Get tickets</a>
<div class="stamp" data-r="stamp">SOLD OUT<br>SOON ★</div>
</body></html>
