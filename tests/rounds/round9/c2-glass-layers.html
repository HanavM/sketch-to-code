<!doctype html><html><head><meta charset="utf-8"><title>Glass layers</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#0b1020;font-family:Helvetica,Arial,sans-serif;color:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
.b1{left:640px;top:120px;width:380px;height:380px;background:#ec4899}.b2{left:880px;top:380px;width:340px;height:340px;background:#06b6d4}.b3{left:620px;top:520px;width:260px;height:260px;background:#a3e635;opacity:.8}
.glass{position:absolute;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(20px);box-shadow:0 30px 60px rgba(0,0,0,.35)}
.g1{left:660px;top:150px;width:420px;height:260px;padding:28px}
.g2{left:780px;top:360px;width:380px;height:220px;padding:28px}
.g3{left:600px;top:540px;width:300px;height:180px;padding:24px}
.bars{display:flex;align-items:flex-end;gap:12px;height:120px;margin-top:24px}.bars i{width:34px;border-radius:8px 8px 0 0;background:rgba(255,255,255,.7)}
h1{position:absolute;left:80px;top:220px;width:520px;font-size:76px;line-height:1;letter-spacing:-2px;font-weight:700}
h1 span{background:linear-gradient(90deg,#f9a8d4,#67e8f9);-webkit-background-clip:text;color:transparent}
.sub{position:absolute;left:80px;top:470px;width:440px;font-size:19px;line-height:1.5;color:#cbd5e1}
.cta{position:absolute;left:80px;top:580px;padding:16px 28px;border-radius:14px;background:#fff;color:#0b1020;font-weight:700}
nav{position:absolute;left:80px;top:40px;width:1120px;display:flex;justify-content:space-between;font-size:14px;color:#cbd5e1}
.av{display:flex;margin-top:16px}.av i{width:40px;height:40px;border-radius:50%;border:2px solid #fff;margin-left:-10px}.av i:first-child{margin-left:0}
</style></head><body>
<nav data-r="nav"><b style="color:#fff">prism</b><span>Features · Pricing · Changelog · Log in</span></nav>
<h1 data-r="headline" data-must>Money, seen <span>clearly.</span></h1>
<p class="sub" data-r="sub">Every account, card and invoice on one calm, translucent dashboard.</p>
<a class="cta" data-r="cta" data-must>Get early access</a>
<div data-r="glass-stack" data-must style="position:absolute;left:600px;top:120px;width:620px;height:660px">
<div class="blob b1" style="left:40px;top:0"></div><div class="blob b2" style="left:280px;top:260px"></div><div class="blob b3" style="left:20px;top:400px"></div>
<div class="glass g1" style="left:60px;top:30px"><div style="font-size:13px;color:#e2e8f0">Balance</div><div style="font-size:44px;font-weight:700;margin-top:6px">$48,210</div><div class="bars"><i style="height:40%"></i><i style="height:65%"></i><i style="height:50%"></i><i style="height:85%"></i><i style="height:70%"></i><i style="height:100%"></i><i style="height:60%"></i></div></div>
<div class="glass g2" style="left:180px;top:240px"><div style="font-size:13px;color:#e2e8f0">Savings goal</div><div style="font-size:30px;font-weight:700;margin-top:6px">72%</div><div style="height:10px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:18px"><div style="width:72%;height:10px;border-radius:5px;background:#a3e635"></div></div><div class="av"><i style="background:#f472b6"></i><i style="background:#38bdf8"></i><i style="background:#facc15"></i></div></div>
<div class="glass g3" style="left:0;top:420px"><div style="font-size:13px;color:#e2e8f0">Next payout</div><div style="font-size:26px;font-weight:700;margin-top:6px">Fri, 12:00</div><div style="margin-top:14px;font-size:13px;color:#a3e635">● On schedule</div></div>
</div>
</body></html>
