<!doctype html><html><head><meta charset="utf-8"><title>Mask bento</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#fafaf9;font-family:Helvetica,Arial,sans-serif;color:#1c1917}
.t{position:absolute;border-radius:28px;overflow:hidden}
.a{left:40px;top:40px;width:640px;height:440px;background:#1c1917}
.a b{position:absolute;left:36px;top:60px;font-size:200px;font-weight:900;letter-spacing:-10px;line-height:.9;background:linear-gradient(120deg,#f97316,#ec4899 40%,#8b5cf6 80%);-webkit-background-clip:text;color:transparent}
.a p{position:absolute;left:40px;bottom:36px;color:#a8a29e;font-size:16px;width:360px}
.b{left:700px;top:40px;width:540px;height:210px;background:#fde68a}
.b .hole{position:absolute;left:380px;top:30px;width:150px;height:150px;border-radius:50%;background:#fafaf9}
.b h3{position:absolute;left:32px;top:32px;font-size:34px;width:320px;line-height:1.1}
.c{left:700px;top:270px;width:260px;height:210px;background:#fff;border:1px solid #e7e5e4}
.ring{position:absolute;left:55px;top:30px;width:150px;height:150px;border-radius:50%;background:conic-gradient(#16a34a 0 78%,#e7e5e4 0)}
.ring i{position:absolute;left:18px;top:18px;width:114px;height:114px;border-radius:50%;background:#fff;font-style:normal;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center}
.d{left:980px;top:270px;width:260px;height:210px;background:repeating-linear-gradient(45deg,#1c1917 0 14px,#fafaf9 14px 28px)}
.d span{position:absolute;left:40px;top:70px;width:180px;height:70px;border-radius:999px;background:#fafaf9;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.e{left:40px;top:500px;width:420px;height:360px;background:#8b5cf6;clip-path:polygon(0 0,100% 0,100% 80%,80% 100%,0 100%)}
.e h3{position:absolute;left:32px;top:36px;color:#fff;font-size:42px;line-height:1.05;width:340px}
.f{left:480px;top:500px;width:760px;height:360px;background:#fff;border:1px solid #e7e5e4}
.f h4{position:absolute;left:36px;top:32px;font-size:22px}
.row{position:absolute;left:36px;width:688px;display:flex;align-items:center;gap:16px;font-size:16px}
.row i{width:56px;height:56px;border-radius:16px}
.row s{margin-left:auto;text-decoration:none;font-weight:700}
</style></head><body>
<div class="t a" data-r="clip-type-tile" data-must><b>FLUX</b><p>Gradient-filled type clipped to the word, on ink.</p></div>
<div class="t b" data-r="hole-tile"><h3>Punch-through layouts</h3><div class="hole"></div></div>
<div class="t c" data-r="ring-tile" data-must><div class="ring"><i>78%</i></div></div>
<div class="t d" data-r="stripe-tile"><span>BETA</span></div>
<div class="t e" data-r="notch-tile" data-must><h3>Cut corners on purpose.</h3></div>
<div class="t f" data-r="list-tile"><h4>This week</h4>
<div class="row" style="top:90px"><i style="background:#f97316"></i>Brand refresh<s>12 tasks</s></div>
<div class="row" style="top:170px"><i style="background:#16a34a"></i>Launch site<s>8 tasks</s></div>
<div class="row" style="top:250px"><i style="background:#06b6d4"></i>Motion kit<s>5 tasks</s></div></div>
</body></html>
