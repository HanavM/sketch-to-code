<!doctype html><html><head><meta charset="utf-8"><title>Stained glass</title><style>

h1{position:absolute;left:66px;top:200px;width:720px;font:italic 400 132px/0.92 Georgia,serif;letter-spacing:-4px;mix-blend-mode:screen;color:#ffe9c2}
