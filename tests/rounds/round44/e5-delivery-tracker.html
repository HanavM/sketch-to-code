<!doctype html><html><head><meta charset="utf-8"><title>Tracking</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f3f4f6;font-family:Helvetica,Arial,sans-serif;color:#18202f;overflow:hidden;position:relative}
.map{position:absolute;left:0;top:0;width:760px;height:900px;background:#dfe9dc}
.road{position:absolute;background:#fff}
.route{position:absolute;left:0;top:0}
.pin{position:absolute;width:26px;height:26px;border-radius:50%;border:5px solid #fff}
.panel{position:absolute;left:760px;top:0;width:520px;height:900px;background:#fff;padding:44px 40px}
.panel small{font-size:14px;color:#6b7280}.panel h1{font-size:34px;margin-top:8px}.eta{margin-top:6px;font-size:16px;color:#ea580c;font-weight:700}
.bar{margin-top:26px;height:8px;border-radius:4px;background:#e5e7eb}.bar i{display:block;width:70%;height:8px;border-radius:4px;background:#ea580c}
.steps{margin-top:36px;position:relative}.steps::before{content:"";position:absolute;left:11px;top:12px;width:2px;height:330px;background:#e5e7eb}
.st{position:relative;display:flex;height:86px}.st i{width:24px;height:24px;border-radius:50%;border:3px solid #d1d5db;background:#fff;flex:none}.st.d i{background:#ea580c;border-color:#ea580c}.st.c i{border-color:#ea580c}
.st div{margin-left:20px;font-size:16px;font-weight:700}.st div span{display:block;font-weight:400;font-size:14px;color:#6b7280;margin-top:4px}
.drv{position:absolute;left:800px;top:770px;width:440px;height:84px;border:1px solid #e5e7eb;border-radius:14px;display:flex;align-items:center;padding:0 20px}.drv .av{width:48px;height:48px;border-radius:50%;background:#fed7aa}.drv b{margin-left:14px;font-size:16px}.drv .call{margin-left:auto;width:96px;height:40px;border-radius:20px;background:#18202f;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="map" data-r="map" data-must>
<div class="road" style="left:0;top:300px;width:760px;height:22px"></div><div class="road" style="left:420px;top:0;width:22px;height:900px"></div><div class="road" style="left:0;top:650px;width:760px;height:18px"></div><div class="road" style="left:150px;top:0;width:18px;height:900px"></div>
<svg class="route" width="760" height="900" data-r="route"><polyline fill="none" stroke="#ea580c" stroke-width="7" points="159,780 159,659 431,659 431,311 620,311 620,180"/></svg>
<div class="pin" style="left:146px;top:767px;background:#18202f"></div><div class="pin" data-r="truck-pin" style="left:418px;top:420px;background:#ea580c"></div><div class="pin" style="left:607px;top:167px;background:#16a34a"></div></div>
<div class="panel" data-r="panel" data-must><small>Order #48213</small><h1 data-r="status">Out for delivery</h1><p class="eta">Arrives today, 2:40 – 3:10 pm</p><div class="bar" data-r="progress"><i></i></div>
<div class="steps" data-r="timeline" data-must>
<div class="st d"><i></i><div>Order placed<span>Oct 30, 9:12 am</span></div></div>
<div class="st d"><i></i><div>Packed<span>Oct 31, 4:05 pm</span></div></div>
<div class="st c"><i></i><div>Out for delivery<span>Today, 8:30 am</span></div></div>
<div class="st"><i></i><div>Delivered<span>Expected 3:00 pm</span></div></div></div></div>
<div class="drv" data-r="driver-card" data-must><i class="av"></i><b>Marco · your driver</b><span class="call">Call</span></div>
</body></html>
