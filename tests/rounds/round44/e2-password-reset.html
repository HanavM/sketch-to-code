<!doctype html><html><head><meta charset="utf-8"><title>Reset</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#eef2f7;font-family:Helvetica,Arial,sans-serif;color:#1b2433;overflow:hidden;position:relative}
.logo{position:absolute;left:0;top:90px;width:1280px;text-align:center;font-size:24px;font-weight:800;color:#2563eb}
.card{position:absolute;left:440px;top:170px;width:400px;height:460px;background:#fff;border-radius:16px;box-shadow:0 8px 30px #1b243318;padding:40px}
.icon{width:64px;height:64px;border-radius:50%;background:#dbeafe;margin:0 auto}
h1{margin-top:22px;text-align:center;font-size:26px}.card p{margin-top:12px;text-align:center;font-size:15px;color:#64748b;line-height:1.5}
.f{margin-top:28px;height:50px;border:1px solid #cbd5e1;border-radius:10px;display:flex;align-items:center;padding:0 16px;color:#94a3b8;font-size:15px}
.btn{margin-top:18px;height:52px;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.back{position:absolute;left:0;top:670px;width:1280px;text-align:center;font-size:15px;color:#2563eb}
</style></head><body>
<div class="logo" data-r="logo">Northwind</div>
<div class="card" data-r="card" data-must><div class="icon" data-r="icon"></div><h1 data-r="title">Forgot your password?</h1><p data-r="help">Enter your email and we will send you a link to reset it.</p><div class="f" data-r="email-field" data-must>you@example.com</div><div class="btn" data-r="button" data-must>Send reset link</div></div>
<div class="back" data-r="back-link">← Back to sign in</div>
</body></html>
