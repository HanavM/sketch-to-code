<!doctype html><html><head><meta charset="utf-8"><title>Difference split</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#fafafa;font-family:Helvetica,Arial,sans-serif}
.half{position:absolute;left:640px;top:0;width:640px;height:900px;background:#0a0a0a}
.portrait{position:absolute;left:470px;top:150px;width:340px;height:560px;border-radius:170px 170px 0 0;background:linear-gradient(180deg,#a78bfa,#db2777)}
.word{position:absolute;left:0;width:1280px;text-align:center;font-size:230px;font-weight:900;letter-spacing:-10px;line-height:1;color:#fff;mix-blend-mode:difference;white-space:nowrap}
.w1{top:120px}.w2{top:520px}
.logo{position:absolute;left:48px;top:40px;font-size:18px;font-weight:700;color:#0a0a0a}
.links{position:absolute;right:48px;top:40px;font-size:15px;color:#fafafa}
.cap-l{position:absolute;left:48px;bottom:48px;width:300px;font-size:15px;line-height:1.5;color:#404040}
.cap-r{position:absolute;right:48px;bottom:48px;font-size:15px;color:#fafafa;border-bottom:1px solid #fafafa;padding-bottom:4px}
</style></head><body>
<div class="half" data-r="dark-half" data-must></div>
<div class="portrait" data-r="portrait" data-must></div>
<div class="word w1" data-r="word-top" data-must>LIGHT</div>
<div class="word w2" data-r="word-bottom" data-must>SHADE</div>
<div class="logo" data-r="logo">Duality®</div>
<div class="links" data-r="links">Collection · Archive · Cart (0)</div>
<p class="cap-l" data-r="caption">Outerwear cut in two colours only. Pick a side, or wear both.</p>
<a class="cap-r" data-r="cta">Shop the drop →</a>
</body></html>
