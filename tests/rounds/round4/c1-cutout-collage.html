<!doctype html><html><head><meta charset="utf-8"><title>Cut-out collage</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f3ead8;font-family:Georgia,serif;color:#1c1917}
