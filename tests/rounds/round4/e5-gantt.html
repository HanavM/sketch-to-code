<!doctype html><html><head><meta charset="utf-8"><title>Project timeline</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;overflow:hidden;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#18181b;padding:28px 36px}
.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}.seg{display:flex;border:1px solid #d4d4d8;border-radius:8px;font-size:13px}.seg span{padding:8px 14px}.seg .on{background:#18181b;color:#fff;border-radius:7px}
.g{position:relative;margin-top:24px;border:1px solid #e4e4e7;border-radius:12px;height:760px;overflow:hidden}
.weeks{position:absolute;left:260px;right:0;top:0;height:44px;display:flex;border-bottom:1px solid #e4e4e7;font-size:12px;color:#71717a}.weeks span{flex:1;padding:14px 10px;border-left:1px solid #f4f4f5}
.names{position:absolute;left:0;top:44px;width:260px;border-right:1px solid #e4e4e7}.names div{height:64px;padding:0 18px;display:flex;align-items:center;gap:10px;font-size:14px;border-bottom:1px solid #f4f4f5}.names i{width:26px;height:26px;border-radius:50%}
.bar{position:absolute;height:30px;border-radius:8px;color:#fff;font-size:12px;padding:8px 10px;white-space:nowrap}
.today{position:absolute;left:640px;top:0;bottom:0;width:2px;background:#ef4444}.today b{position:absolute;top:44px;left:-24px;background:#ef4444;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
</style></head><body>

</body></html>
