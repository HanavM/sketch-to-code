<!doctype html><html><head><meta charset="utf-8"><title>Shape museum</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#efe9dc;font-family:Helvetica,Arial,sans-serif;color:#111;overflow:hidden;position:relative}
.top{position:absolute;left:60px;top:40px;font-size:14px;font-weight:700;letter-spacing:3px}
.circle{position:absolute;left:640px;top:90px;width:420px;height:420px;border-radius:50%;background:#d93a2b}
.square{position:absolute;left:880px;top:380px;width:300px;height:300px;background:#1f4fb4;mix-blend-mode:multiply}
.tri{position:absolute;left:560px;top:520px;width:0;height:0;border-left:160px solid transparent;border-right:160px solid transparent;border-bottom:280px solid #f2c230}
h1{position:absolute;left:60px;top:140px;font-size:150px;font-weight:900;line-height:.85;letter-spacing:-5px}
.when{position:absolute;left:64px;top:560px;font-size:22px;font-weight:700}
.sub{position:absolute;left:64px;top:605px;width:420px;font-size:17px;line-height:1.5;color:#444}
.cta{position:absolute;left:64px;top:730px;width:200px;height:56px;border:3px solid #111;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="top" data-r="logo">MUSEUM OF FORM</div>
<div class="circle" data-r="circle" data-must></div>
<div class="square" data-r="square" data-must></div>
<div class="tri" data-r="triangle"></div>
<h1 data-r="headline" data-must>BAU<br>HAUS<br>100</h1>
<div class="when" data-r="date">12 May – 30 Sept</div>
<p class="sub" data-r="subhead">A century of circles, squares and triangles, from the workshop to your kitchen.</p>
<div class="cta" data-r="cta" data-must>Book tickets</div>
</body></html>
