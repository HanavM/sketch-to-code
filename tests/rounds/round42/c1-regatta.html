<!doctype html><html><head><meta charset="utf-8"><title>Regatta</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f3ede0;font-family:Helvetica,Arial,sans-serif;color:#0f2a4a;overflow:hidden;position:relative}
nav{position:absolute;left:0;top:0;width:1280px;height:80px;display:flex;align-items:center;padding:0 72px;font-size:15px;font-weight:600}
nav b{font-size:20px;letter-spacing:2px}nav span{margin-left:36px}nav .first{margin-left:auto}
h1{position:absolute;left:72px;top:170px;font-size:110px;font-weight:900;line-height:.92;letter-spacing:-3px}
.sub{position:absolute;left:76px;top:400px;width:430px;font-size:19px;line-height:1.5;color:#3b5068}
.cta{position:absolute;left:76px;top:520px;width:210px;height:56px;border-radius:28px;background:#e8553d;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.sail{position:absolute;width:0;height:0}
.s1{left:720px;top:140px;border-left:150px solid transparent;border-bottom:380px solid #e8553d}
.s2{left:900px;top:220px;border-left:120px solid transparent;border-bottom:300px solid #0f2a4a}
.s3{left:1060px;top:300px;border-left:90px solid transparent;border-bottom:220px solid #f2b632}
.hull{position:absolute;height:26px;background:#0f2a4a;border-radius:0 0 30px 30px}
.sea{position:absolute;left:0;top:640px;width:1280px;height:260px;background:#1f5f8b}
.wave{position:absolute;left:0;width:1280px;height:10px;background:#f3ede0;opacity:.5}
</style></head><body>
<nav data-r="nav"><b data-r="logo">SAILWEEK</b><span class="first">Races</span><span>Crews</span><span>Harbour</span></nav>
<h1 data-r="headline" data-must>Harbour<br>Regatta</h1>
<p class="sub" data-r="subhead">Three days of racing, sundowners on the pier and a prize for the slowest boat.</p>
<div class="cta" data-r="cta" data-must>Enter a boat</div>
<div class="sail s1" data-r="sail-red" data-must></div><div class="hull" style="left:700px;top:520px;width:200px"></div>
<div class="sail s2" data-r="sail-navy"></div><div class="hull" style="left:885px;top:520px;width:160px"></div>
<div class="sail s3" data-r="sail-yellow"></div><div class="hull" style="left:1045px;top:520px;width:130px"></div>
<div class="sea" data-r="sea" data-must></div>
<div class="wave" style="top:700px"></div><div class="wave" style="top:770px"></div><div class="wave" style="top:840px"></div>
</body></html>
