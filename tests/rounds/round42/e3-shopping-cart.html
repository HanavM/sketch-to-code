<!doctype html><html><head><meta charset="utf-8"><title>Cart</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#222;overflow:hidden;position:relative}
header{height:72px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 60px;font-size:15px}header b{font-size:22px}header span{margin-left:auto}
h1{position:absolute;left:60px;top:110px;font-size:34px}
.items{position:absolute;left:60px;top:180px;width:700px}
.it{display:flex;align-items:center;gap:22px;padding:22px 0;border-bottom:1px solid #eee}
.ph{width:96px;height:96px;border-radius:10px;background:#e9e4dc}.nm{font-size:17px;font-weight:700}.nm small{display:block;font-weight:400;color:#888;font-size:14px;margin-top:6px}
.qty{margin-left:auto;display:flex;align-items:center;border:1px solid #ddd;border-radius:8px;height:40px}.qty i{width:36px;text-align:center;font-style:normal;color:#666}.qty b{width:30px;text-align:center}
.pr{width:90px;text-align:right;font-weight:700;font-size:17px}
.sum{position:absolute;left:820px;top:180px;width:400px;background:#f6f5f2;border-radius:14px;padding:30px}
.sum h2{font-size:20px;margin-bottom:20px}.ln{display:flex;font-size:16px;color:#555;margin-bottom:14px}.ln span{margin-left:auto}
.tot{display:flex;font-size:20px;font-weight:800;border-top:1px solid #ddd;padding-top:18px;margin-top:6px}.tot span{margin-left:auto}
.pay{margin-top:26px;height:56px;border-radius:10px;background:#111;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body>
<header data-r="header"><b data-r="logo">Loom</b><span>Cart (3)</span></header>
<h1 data-r="title" data-must>Your cart</h1>
<div class="items" data-r="items" data-must>
<div class="it"><i class="ph"></i><div class="nm">Linen throw<small>Sand · 130 × 170</small></div><div class="qty"><i>–</i><b>1</b><i>+</i></div><div class="pr">$89</div></div>
<div class="it"><i class="ph" style="background:#c9d6cf"></i><div class="nm">Stoneware mug<small>Sage · set of 2</small></div><div class="qty"><i>–</i><b>2</b><i>+</i></div><div class="pr">$48</div></div>
<div class="it"><i class="ph" style="background:#d8c8b8"></i><div class="nm">Oak tray<small>Natural</small></div><div class="qty"><i>–</i><b>1</b><i>+</i></div><div class="pr">$62</div></div></div>
<div class="sum" data-r="summary" data-must><h2>Summary</h2><div class="ln">Subtotal<span>$199</span></div><div class="ln">Shipping<span>Free</span></div><div class="tot">Total<span>$199</span></div><div class="pay" data-r="checkout" data-must>Checkout</div></div>
</body></html>
