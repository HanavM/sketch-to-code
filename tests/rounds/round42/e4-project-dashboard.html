<!doctype html><html><head><meta charset="utf-8"><title>Projects</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f5f6f8;font-family:Helvetica,Arial,sans-serif;color:#1e2430;overflow:hidden;position:relative}
.top{position:absolute;left:0;top:0;width:1280px;height:64px;background:#1e2430;color:#fff;display:flex;align-items:center;padding:0 40px;font-size:15px}.top b{font-size:19px}.top .av{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#4fb3a9}
h1{position:absolute;left:40px;top:96px;font-size:28px}
.tiles{position:absolute;left:40px;top:150px;display:flex;gap:24px}
.tile{width:282px;height:120px;background:#fff;border-radius:12px;padding:22px}.tile span{color:#7b8494;font-size:14px}.tile b{display:block;font-size:36px;margin-top:12px}
.chart{position:absolute;left:40px;top:300px;width:400px;height:420px;background:#fff;border-radius:12px;padding:24px}
.chart h2,.tasks h2{font-size:18px}
.donut{width:240px;height:240px;border-radius:50%;margin:40px auto 0;background:conic-gradient(#4fb3a9 0 55%,#f2a541 55% 80%,#e45b5b 80% 100%);display:flex;align-items:center;justify-content:center}
.donut i{width:140px;height:140px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px;font-weight:800}
.tasks{position:absolute;left:464px;top:300px;width:776px;height:420px;background:#fff;border-radius:12px;padding:24px}
.tr{display:flex;align-items:center;padding:16px 0;border-bottom:1px solid #eef0f3;font-size:15px}.tr .who{width:30px;height:30px;border-radius:50%;background:#c7cdd8;margin-right:16px}
.tr .pill{margin-left:auto;padding:6px 14px;border-radius:14px;font-size:13px;font-weight:700}
</style></head><body>
<div class="top" data-r="topbar" data-must><b data-r="logo">Trackwise</b><i class="av"></i></div>
<h1 data-r="title">Website relaunch</h1>
<div class="tiles" data-r="stats" data-must><div class="tile"><span>Open tasks</span><b>24</b></div><div class="tile"><span>Done this week</span><b>17</b></div><div class="tile"><span>Overdue</span><b style="color:#e45b5b">3</b></div><div class="tile"><span>Days left</span><b>12</b></div></div>
<div class="chart" data-r="donut-card" data-must><h2>Status</h2><div class="donut"><i>55%</i></div></div>
<div class="tasks" data-r="tasks" data-must><h2>Due soon</h2>
<div class="tr"><i class="who"></i>Write homepage copy<span class="pill" style="background:#fde8e8;color:#c43c3c">Overdue</span></div>
<div class="tr"><i class="who"></i>Pick hero photo<span class="pill" style="background:#fdf1e0;color:#b9741a">Today</span></div>
<div class="tr"><i class="who"></i>Set up redirects<span class="pill" style="background:#e3f4f2;color:#2f8077">Thu</span></div>
<div class="tr"><i class="who"></i>Review pricing page<span class="pill" style="background:#e3f4f2;color:#2f8077">Fri</span></div>
<div class="tr"><i class="who"></i>Launch checklist<span class="pill" style="background:#e3f4f2;color:#2f8077">Mon</span></div></div>
</body></html>
