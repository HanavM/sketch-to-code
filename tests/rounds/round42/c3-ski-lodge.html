<!doctype html><html><head><meta charset="utf-8"><title>Ski lodge</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:linear-gradient(#9cc9e8,#e6f2fa);font-family:Helvetica,Arial,sans-serif;color:#13324d;overflow:hidden;position:relative}
nav{position:absolute;left:0;top:0;width:1280px;height:80px;display:flex;align-items:center;padding:0 64px;font-weight:600;font-size:15px}
nav b{font-size:22px}nav span{margin-left:34px}nav .f{margin-left:auto}
.slope{position:absolute;left:0;top:0;width:1280px;height:900px;background:#fff;clip-path:polygon(0 52%,100% 82%,100% 100%,0 100%)}
.tree{position:absolute;width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:110px solid #1f5a3a}
h1{position:absolute;left:640px;top:150px;font-size:96px;font-weight:900;letter-spacing:-2px;line-height:.95;text-align:right;width:570px}
.sub{position:absolute;left:760px;top:360px;width:450px;text-align:right;font-size:19px;line-height:1.5;color:#2d4e6a}
.cta{position:absolute;left:990px;top:470px;width:220px;height:56px;background:#13324d;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:6px}
.snow{position:absolute;left:96px;top:120px;width:150px;height:150px;border-radius:50%;background:#fff6c9}
.info{position:absolute;left:120px;top:690px;display:flex;gap:70px}
.info div{font-size:15px;color:#4a6276}.info b{display:block;font-size:34px;color:#13324d}
</style></head><body>
<div class="snow" data-r="sun"></div>
<div class="slope" data-r="slope" data-must></div>
<div class="tree" style="left:180px;top:370px" data-r="trees"></div><div class="tree" style="left:290px;top:410px"></div><div class="tree" style="left:400px;top:450px"></div>
<nav data-r="nav"><b data-r="logo">Pinehut</b><span class="f">Rooms</span><span>Lifts</span><span>Ski school</span></nav>
<h1 data-r="headline" data-must>First tracks, warm fire</h1>
<p class="sub" data-r="subhead">A twelve-room lodge at the foot of the north run.</p>
<div class="cta" data-r="cta" data-must>Check dates</div>
<div class="info" data-r="stats"><div><b>42</b>runs open</div><div><b>-6°</b>at the top</div><div><b>18 cm</b>fresh snow</div></div>
</body></html>
