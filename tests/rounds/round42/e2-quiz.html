<!doctype html><html><head><meta charset="utf-8"><title>Quiz</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#eef3f8;font-family:Helvetica,Arial,sans-serif;color:#1c2b3a;overflow:hidden}
.card{width:700px;margin:80px auto 0;background:#fff;border-radius:16px;padding:40px 48px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.top{display:flex;font-size:14px;color:#7a8a99}.top b{margin-left:auto;color:#1c2b3a}
.prog{height:8px;border-radius:4px;background:#e1e8ef;margin-top:14px}.prog i{display:block;width:60%;height:8px;border-radius:4px;background:#2bb673}
h1{font-size:28px;margin-top:36px;line-height:1.3}
.opt{display:flex;align-items:center;gap:16px;height:60px;border:2px solid #e1e8ef;border-radius:12px;margin-top:14px;padding:0 20px;font-size:17px}
.opt i{width:22px;height:22px;border-radius:50%;border:2px solid #b8c4cf}.opt.on{border-color:#2bb673;background:#eefaf3}.opt.on i{border:7px solid #2bb673}
.btns{display:flex;margin-top:34px}.back{color:#7a8a99;font-size:16px;display:flex;align-items:center}
.next{margin-left:auto;width:150px;height:50px;border-radius:10px;background:#2bb673;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head><body><div class="card" data-r="card" data-must>
<div class="top" data-r="counter"><span>Question 6 of 10</span><b>Score 4</b></div>
<div class="prog" data-r="progress" data-must><i></i></div>
<h1 data-r="question" data-must>Which planet has the shortest day?</h1>
<div data-r="options" data-must>
<div class="opt"><i></i>Mercury</div><div class="opt on"><i></i>Jupiter</div><div class="opt"><i></i>Earth</div><div class="opt"><i></i>Venus</div></div>
<div class="btns"><span class="back" data-r="back">← Back</span><div class="next" data-r="next" data-must>Next</div></div>
</div></body></html>
