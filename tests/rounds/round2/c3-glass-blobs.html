<!doctype html><html><head><meta charset="utf-8"><title>Glass blobs</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;background:#1e1b4b;font-family:Helvetica,Arial,sans-serif;color:#fff;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(40px)}
.b1{left:120px;top:80px;width:420px;height:420px;background:#ec4899}.b2{left:760px;top:380px;width:480px;height:480px;background:#06b6d4}
.card{position:absolute;left:290px;top:180px;width:700px;height:520px;border-radius:28px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(20px);padding:56px}
.tag{display:inline-block;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.18);font-size:14px}
h1{font-size:60px;line-height:1.05;font-weight:700;margin-top:28px}
p{font-size:18px;line-height:1.5;margin-top:20px;opacity:.8;width:520px}
.row{display:flex;gap:16px;margin-top:40px}.row a{padding:16px 28px;border-radius:14px;font-size:16px}.row .a{background:#fff;color:#1e1b4b}.row .b{border:1px solid rgba(255,255,255,.5)}
</style></head><body>
<div class="blob b1" data-r="blob-pink"></div><div class="blob b2" data-r="blob-cyan"></div>
<div class="card" data-r="card" data-must><span class="tag" data-r="tag">Beta · v2.0</span>
<h1 data-r="headline" data-must>Your notes, finally calm</h1>
<p data-r="body">Write, link and find anything in a quiet space that syncs everywhere.</p>
<div class="row" data-r="ctas"><a class="a">Get started</a><a class="b">Watch demo</a></div></div>
</body></html>
