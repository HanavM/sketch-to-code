<!doctype html><html><head><meta charset="utf-8"><title>Outline bleed</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;background:#0a0a0a;color:#fafafa;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
nav{position:absolute;right:56px;top:40px;display:flex;gap:36px;font-size:14px;letter-spacing:3px;text-transform:uppercase}
.big{position:absolute;left:-40px;top:120px;font-size:300px;font-weight:900;line-height:.85;letter-spacing:-10px;color:transparent;-webkit-text-stroke:2px #fafafa;white-space:nowrap}
.solid{position:absolute;left:-30px;top:400px;font-size:300px;font-weight:900;line-height:.85;letter-spacing:-10px;color:#84cc16;white-space:nowrap}
.side{position:absolute;right:56px;bottom:64px;width:300px;font-size:16px;line-height:1.6;color:#a3a3a3}
.year{position:absolute;left:56px;bottom:56px;font-family:"Courier New",monospace;font-size:14px;color:#84cc16}
</style></head><body>
<nav data-r="nav"><span>Index</span><span>Shows</span><span>Shop</span></nav>
<div class="big" data-r="outline-word" data-must>NOISE</div>
<div class="solid" data-r="solid-word" data-must>FEST</div>
<p class="side" data-r="body">Three nights of loud guitars in a disused tram depot. Bring earplugs.</p>
<div class="year" data-r="date">// 14—16 AUG 2027</div>
</body></html>
