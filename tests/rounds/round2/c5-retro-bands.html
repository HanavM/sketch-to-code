<!doctype html><html><head><meta charset="utf-8"><title>Retro bands</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;background:#fff7e6;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
.bands{position:absolute;right:-200px;top:-100px;width:900px;height:1200px;transform:rotate(25deg);background:linear-gradient(90deg,#f97316 0 20%,#fbbf24 20% 40%,#14b8a6 40% 60%,#0e7490 60% 80%,#7c2d12 80% 100%)}
h1{position:absolute;left:64px;top:200px;width:560px;font-size:96px;line-height:.95;font-weight:900;font-style:italic;color:#7c2d12;text-transform:uppercase}
p{position:absolute;left:68px;top:540px;width:420px;font-size:19px;line-height:1.5;color:#44403c}
.cta{position:absolute;left:68px;top:650px;padding:20px 36px;background:#14b8a6;color:#fff;font-weight:800;font-size:18px;text-transform:uppercase;border:3px solid #7c2d12;box-shadow:6px 6px 0 #7c2d12}
.logo{position:absolute;left:64px;top:48px;font-size:26px;font-weight:900;color:#7c2d12;letter-spacing:1px}
</style></head><body>
<div class="bands" data-r="bands" data-must></div>
<div class="logo" data-r="logo">SUNDAE</div>
<h1 data-r="headline" data-must>Soft serve, hard rules</h1>
<p data-r="body">Seventies flavours, real cream, and one strict rule: no spoons left behind.</p>
<a class="cta" data-r="cta" data-must>Find a truck</a>
</body></html>
