<!doctype html><html><head><meta charset="utf-8"><title>Layered collage</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;background:#f3ead8;font-family:Helvetica,Arial,sans-serif;color:#1c1917;overflow:hidden}
.logo{position:absolute;left:56px;top:40px;font-family:Georgia,serif;font-style:italic;font-size:30px}
.photo{position:absolute;background:linear-gradient(160deg,#94a3b8,#334155);box-shadow:0 18px 40px rgba(0,0,0,.25)}
.p1{left:620px;top:120px;width:380px;height:480px;transform:rotate(-4deg)}
.p2{left:880px;top:300px;width:300px;height:360px;background:linear-gradient(160deg,#fda4af,#be123c);transform:rotate(6deg)}
.sticker{position:absolute;left:560px;top:520px;width:170px;height:170px;border-radius:50%;background:#facc15;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:20px;transform:rotate(-12deg)}
h1{position:absolute;left:56px;top:210px;width:720px;font-family:Georgia,serif;font-size:118px;line-height:.92;font-weight:400;letter-spacing:-3px;z-index:2}
p{position:absolute;left:60px;top:560px;width:380px;font-size:18px;line-height:1.55}
.cta{position:absolute;left:60px;top:690px;padding:18px 30px;background:#1c1917;color:#f3ead8;font-size:16px;border-radius:999px}
</style></head><body>
<div class="logo" data-r="logo">Field Notes</div>
<div class="photo p1" data-r="photo-1" data-must></div><div class="photo p2" data-r="photo-2"></div>
<div class="sticker" data-r="sticker">NEW<br>ISSUE 07</div>
<h1 data-r="headline" data-must>Slow travel, fast friends</h1>
<p data-r="body">A quarterly zine of walks, night trains and the people you meet on the way.</p>
<a class="cta" data-r="cta" data-must>Read issue 07</a>
</body></html>
