<!doctype html><html><head><meta charset="utf-8"><title>Split studio</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;display:flex;font-family:Helvetica,Arial,sans-serif;overflow:hidden}
.left{width:640px;background:#14532d;color:#f5f0e6;padding:56px 64px}.right{width:640px;background:#f5f0e6;display:flex;align-items:center;justify-content:center}
.logo{font-size:22px;letter-spacing:4px;text-transform:uppercase}
h1{font-family:Georgia,serif;font-size:84px;line-height:1.02;font-weight:400;margin-top:180px}
p{font-size:19px;line-height:1.5;margin-top:28px;width:440px;opacity:.85}
.cta{display:inline-block;margin-top:40px;padding:18px 34px;border:2px solid #f5f0e6;font-size:16px;letter-spacing:2px;text-transform:uppercase}
.orb{width:440px;height:440px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbbf24,#ea580c 70%)}
</style></head><body>
<div class="left" data-r="left-panel" data-must><div class="logo" data-r="logo">Verde</div><h1 data-r="headline" data-must>Plants that grow with you</h1><p data-r="body">Hand-picked houseplants, potted in recycled clay and delivered by bike across the city.</p><a class="cta" data-r="cta">Browse plants</a></div>
<div class="right" data-r="right-panel"><div class="orb" data-r="orb" data-must></div></div>
</body></html>
