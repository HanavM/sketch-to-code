<!doctype html><html><head><meta charset="utf-8"><title>Dashboard</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;display:flex;background:#f8fafc;font-family:Helvetica,Arial,sans-serif;color:#0f172a;overflow:hidden}
.side{width:240px;height:900px;background:#0f172a;color:#cbd5e1;padding:28px 20px}.side b{color:#fff;font-size:20px;display:block;margin-bottom:32px}.side div{padding:10px 12px;border-radius:8px;font-size:15px}.side .on{background:#1e293b;color:#fff}
main{flex:1;padding:32px 40px}h1{font-size:28px}
.stats{display:flex;gap:20px;margin-top:28px}.s{flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;height:112px}.s span{color:#64748b;font-size:14px}.s div{font-size:30px;font-weight:800;margin-top:10px}
table{width:100%;margin-top:28px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;border-collapse:separate;border-spacing:0;font-size:15px}th,td{text-align:left;padding:14px 20px;border-bottom:1px solid #f1f5f9}th{color:#64748b;font-weight:600}
</style></head><body>
<aside class="side" data-r="sidebar" data-must><b>Acme</b><div class="on">Overview</div><div>Customers</div><div>Invoices</div><div>Settings</div></aside>
<main><h1 data-r="title" data-must>Overview</h1>
<div class="stats" data-r="stats" data-must><div class="s" data-r="stat-1"><span>Revenue</span><div>$48.2k</div></div><div class="s" data-r="stat-2"><span>Customers</span><div>1,204</div></div><div class="s" data-r="stat-3"><span>Churn</span><div>2.1%</div></div><div class="s" data-r="stat-4"><span>MRR</span><div>$12.9k</div></div></div>
<table data-r="table" data-must><tr><th>Customer</th><th>Plan</th><th>Amount</th><th>Status</th></tr><tr><td>Northwind</td><td>Pro</td><td>$240</td><td>Paid</td></tr><tr><td>Globex</td><td>Team</td><td>$790</td><td>Paid</td></tr><tr><td>Initech</td><td>Starter</td><td>$0</td><td>Trial</td></tr><tr><td>Umbrella</td><td>Pro</td><td>$240</td><td>Overdue</td></tr></table></main>
</body></html>
