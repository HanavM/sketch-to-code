<!doctype html><html><head><meta charset="utf-8"><title>Login</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f3f4f6;font-family:Helvetica,Arial,sans-serif;color:#111827;overflow:hidden}
.card{width:420px;margin:150px auto 0;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px}
h1{font-size:26px;font-weight:700}.sub{color:#6b7280;margin-top:6px;font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin-top:22px}
.in{height:44px;border:1px solid #d1d5db;border-radius:8px;margin-top:6px;padding:12px;font-size:14px;color:#9ca3af}
.btn{margin-top:28px;height:46px;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.foot{text-align:center;margin-top:20px;font-size:14px;color:#2563eb}
</style></head><body>
<div class="card" data-r="card" data-must><h1 data-r="title" data-must>Sign in</h1><p class="sub">Welcome back. Enter your details.</p>
<label>Email</label><div class="in" data-r="email" data-must>you@example.com</div>
<label>Password</label><div class="in" data-r="password" data-must>••••••••</div>
<div class="btn" data-r="submit" data-must>Sign in</div><div class="foot" data-r="forgot">Forgot your password?</div></div>
</body></html>
