<!doctype html><html><head><meta charset="utf-8"><title>Contact</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#111827;overflow:hidden;padding:80px 140px}
.wrap{display:flex;gap:80px}.form{width:560px}.info{width:360px;background:#f9fafb;border-radius:12px;padding:32px}
h1{font-size:40px}.sub{color:#6b7280;margin-top:10px;font-size:17px}
.f{margin-top:22px}.f span{display:block;font-size:14px;font-weight:600}.f div{margin-top:6px;height:46px;border:1px solid #d1d5db;border-radius:8px}.f .ta{height:140px}
.btn{margin-top:26px;width:180px;height:48px;border-radius:8px;background:#059669;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.info h3{font-size:18px}.info p{color:#4b5563;line-height:1.7;margin-top:12px;font-size:15px}
</style></head><body>
<div class="wrap"><div class="form" data-r="form" data-must><h1 data-r="title" data-must>Get in touch</h1><p class="sub">We usually reply within a day.</p>
<div class="f" data-r="name"><span>Name</span><div></div></div><div class="f" data-r="email"><span>Email</span><div></div></div><div class="f" data-r="message" data-must><span>Message</span><div class="ta"></div></div>
<div class="btn" data-r="submit" data-must>Send message</div></div>
<div class="info" data-r="info" data-must><h3>Our office</h3><p>12 Harbour Street<br>Lisbon, Portugal</p><h3 style="margin-top:24px">Email</h3><p>hello@example.com</p></div></div>
</body></html>
