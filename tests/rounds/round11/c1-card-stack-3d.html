<!doctype html><html><head><meta charset="utf-8"><title>3D card stack</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 40%,#2b1d5c,#0d0a1f 70%);font-family:Helvetica,Arial,sans-serif;color:#fff}
nav{position:absolute;left:64px;top:36px;width:1152px;display:flex;justify-content:space-between;font-size:14px;font-weight:700;letter-spacing:2px}
.k{position:absolute;left:64px;top:170px;font-family:"Courier New",monospace;font-size:14px;letter-spacing:3px;color:#b8a6ff}
h1{position:absolute;left:64px;top:200px;width:520px;font-size:92px;font-weight:900;line-height:.95;letter-spacing:-3px}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px #fff}
.sub{position:absolute;left:64px;top:520px;width:430px;font-size:18px;line-height:1.55;color:#cfc8ee}
.cta{position:absolute;left:64px;top:640px;padding:18px 34px;border-radius:999px;background:#c6ff3d;color:#0d0a1f;font-weight:800;font-size:16px}
.stage{position:absolute;left:640px;top:110px;width:560px;height:660px;perspective:1200px}
.card{position:absolute;left:90px;width:380px;height:240px;border-radius:22px;transform-style:preserve-3d;box-shadow:0 30px 60px rgba(0,0,0,.45);padding:28px}
.card b{display:block;font-size:13px;letter-spacing:3px;opacity:.8}.card p{position:absolute;left:28px;bottom:26px;font-family:"Courier New",monospace;font-size:20px;letter-spacing:3px}
.c1{top:40px;background:linear-gradient(135deg,#ff5f6d,#ffc371);transform:rotateX(52deg) rotateZ(-28deg)}
.c2{top:190px;background:linear-gradient(135deg,#7f5af0,#2cb67d);transform:rotateX(52deg) rotateZ(-28deg) translateZ(40px)}
.c3{top:340px;background:linear-gradient(135deg,#00c6ff,#0072ff);transform:rotateX(52deg) rotateZ(-28deg) translateZ(80px);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:rotateX(52deg) rotateZ(-28deg) translateZ(120px)}}
.chip{position:absolute;left:1000px;top:690px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);font-size:14px}
</style></head><body>
<nav data-r="nav"><span>STACKD</span><span>CARDS · RATES · SIGN IN</span></nav>
<div class="k">NEW · METAL EDITION</div>
<h1 data-r="headline" data-must>Three cards. <em>One</em> stack.</h1>
<p class="sub" data-r="subcopy">Spend from any of them, earn on all of them. Tilt your phone to switch cards.</p>
<a class="cta" data-r="cta" data-must>Get your stack →</a>
<div class="stage" data-r="card-stack" data-must><div class="card c1"><b>SUNSET</b><p>•••• 4821</p></div><div class="card c2"><b>FOREST</b><p>•••• 0937</p></div><div class="card c3"><b>OCEAN</b><p>•••• 1144</p></div></div>
<div class="chip" data-r="glass-chip">✦ 3% back on travel</div>
</body></html>
