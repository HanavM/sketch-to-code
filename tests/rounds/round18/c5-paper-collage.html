<!doctype html><html><head><meta charset="utf-8"><title>Paper collage</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#e8ddc8;font-family:Georgia,serif;color:#2b2118}
body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(80,120,180,.18) 31px 32px)}
@keyframes bob{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-8px)}}
.torn{position:absolute;left:60px;top:120px;width:640px;height:420px;background:#c8553d;clip-path:polygon(0 4%,8% 0,17% 3%,26% 0,38% 4%,49% 1%,61% 4%,72% 0,84% 3%,93% 0,100% 5%,98% 30%,100% 55%,97% 78%,100% 100%,88% 97%,76% 100%,63% 96%,50% 100%,37% 97%,24% 100%,12% 96%,0 100%,3% 72%,0 48%,2% 24%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
h1{position:absolute;left:110px;top:180px;width:560px;font-size:92px;line-height:.95;color:#f6efe0;letter-spacing:-2px}
h1 span{font-family:"Brush Script MT","Comic Sans MS",cursive;font-weight:400;color:#2b2118;font-size:110px;display:inline-block;transform:rotate(-5deg)}
.pol{position:absolute;left:780px;top:90px;width:300px;height:360px;background:#fff;padding:16px 16px 60px;box-shadow:0 14px 30px rgba(0,0,0,.25);transform:rotate(6deg)}
.pol div{width:100%;height:100%;background:linear-gradient(180deg,#87b6d8 0 55%,#d8b27a 55% 70%,#5f7f4f 70%)}
.pol p{position:absolute;left:0;bottom:18px;width:100%;text-align:center;font-family:"Comic Sans MS",cursive;font-size:20px}
.tape{position:absolute;width:140px;height:36px;background:rgba(255,235,140,.75);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.note{position:absolute;left:860px;top:520px;width:280px;height:250px;background:#fff59a;padding:26px;font-family:"Comic Sans MS",cursive;font-size:21px;line-height:1.4;box-shadow:0 10px 20px rgba(0,0,0,.2);animation:bob 4s ease-in-out infinite}
.lede{position:absolute;left:110px;top:590px;width:500px;font-size:20px;line-height:1.55;background:#f6efe0;padding:22px 26px;transform:rotate(-1.5deg);box-shadow:0 6px 14px rgba(0,0,0,.15)}
.arrow{position:absolute;left:600px;top:470px;width:250px;height:150px}
.btn{position:absolute;left:120px;top:780px;padding:16px 30px;background:#2b2118;color:#f6efe0;font-size:18px;border-radius:4px;transform:rotate(1deg);box-shadow:4px 4px 0 #c8553d}
nav{position:absolute;left:60px;top:40px;width:1160px;display:flex;justify-content:space-between;font-size:17px;font-style:italic}
.stamp{position:absolute;left:1120px;top:40px;width:110px;height:130px;background:#4f7cac;border:6px dotted #e8ddc8;outline:3px solid #4f7cac;transform:rotate(8deg);color:#fff;text-align:center;padding-top:30px;font:700 30px Helvetica,Arial,sans-serif}
</style></head><body>
<nav data-r="nav"><b>Field Notes Co.</b><span>Journals · Kits · Workshops · Stockists</span><span></span></nav>
<div class="stamp" data-r="postage-stamp">26¢</div>
<div class="torn" data-r="torn-paper" data-must></div>
<h1 data-r="headline" data-must>Make a mess <span>on purpose</span></h1>
<div class="pol" data-r="polaroid" data-must><div></div><p>Skye, June</p></div>
<span class="tape" style="left:880px;top:72px;transform:rotate(-8deg)"></span>
<span class="tape" style="left:40px;top:110px;transform:rotate(-30deg)"></span>
<p class="lede" data-r="lede">Hand-bound journals, paper kits and Sunday workshops for people who think better with scissors.</p>
<svg class="arrow" data-r="hand-arrow" viewBox="0 0 250 150"><path d="M10 30 C 90 140, 170 140, 236 70" fill="none" stroke="#2b2118" stroke-width="4" stroke-linecap="round"/><path d="M214 66 L238 68 L232 92" fill="none" stroke="#2b2118" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="note" data-r="sticky-note">Workshop this Sunday!<br>Bring old maps + one photo you love. ♡</div>
<a class="btn" data-r="cta">Shop the kits</a>
</body></html>
