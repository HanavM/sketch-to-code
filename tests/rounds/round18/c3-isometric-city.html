<!doctype html><html><head><meta charset="utf-8"><title>Isometric city</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#bfe6ff 0%,#fde2f3 100%);font-family:Helvetica,Arial,sans-serif;color:#1b1840}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.iso{position:absolute;left:700px;top:330px;width:480px;height:480px;transform:rotateX(60deg) rotateZ(-45deg);transform-style:preserve-3d}
.base{position:absolute;inset:0;background:#8fd19e;box-shadow:0 0 0 14px #6cb47c;background-image:linear-gradient(#7cc48c 2px,transparent 2px),linear-gradient(90deg,#7cc48c 2px,transparent 2px);background-size:60px 60px}
.road{position:absolute;left:210px;top:0;width:60px;height:480px;background:#4a4e69}.road.h{left:0;top:210px;width:480px;height:60px}
.b{position:absolute;transform-style:preserve-3d}
.b i{position:absolute;display:block}
.b .t{inset:0;transform:translateZ(var(--h))}.b .f{left:0;bottom:0;width:100%;height:var(--h);transform-origin:bottom;transform:rotateX(-90deg)}.b .s{right:0;top:0;width:var(--h);height:100%;transform-origin:right;transform:rotateY(90deg)}
.cloud{position:absolute;width:160px;height:50px;border-radius:50px;background:#fff;opacity:.9;animation:drift 40s linear infinite}
.cloud::before{content:"";position:absolute;left:30px;top:-28px;width:80px;height:80px;border-radius:50%;background:#fff}
h1{position:absolute;left:70px;top:190px;width:560px;font-size:84px;line-height:.95;letter-spacing:-3px;font-weight:800}
h1 em{font-style:normal;color:#ff5fa2}
p.l{position:absolute;left:74px;top:470px;width:470px;font-size:18px;line-height:1.55;color:#4b4878}
.cta{position:absolute;left:74px;top:580px;padding:18px 30px;border-radius:14px;background:#1b1840;color:#fff;font-weight:700;box-shadow:0 8px 0 #ff5fa2}
nav{position:absolute;left:70px;top:44px;width:1140px;display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.pin{position:absolute;left:930px;top:200px;padding:10px 16px;border-radius:12px;background:#fff;box-shadow:0 10px 30px rgba(27,24,64,.2);font-size:14px;animation:bob 3s ease-in-out infinite}
.pin::after{content:"";position:absolute;left:30px;bottom:-10px;border:10px solid transparent;border-bottom:0;border-top-color:#fff}
.stats{position:absolute;left:74px;top:720px;display:flex;gap:50px}.stats b{display:block;font-size:40px}.stats span{font-size:13px;color:#4b4878}
</style></head><body>
<div class="cloud" data-r="cloud" style="top:110px;animation-delay:-8s"></div><div class="cloud" data-r="cloud-small" style="top:60px;animation-delay:-26s;transform:scale(.7)"></div>
<nav data-r="nav"><span>◆ Blocktown</span><span>Features · Cities · Pricing</span><span>Sign in</span></nav>
<h1 data-r="headline" data-must>Plan a whole <em>city</em> in an afternoon.</h1>
<p class="l" data-r="lede">Zone streets, drop buildings and simulate traffic on a living isometric map your whole council can edit.</p>
<a class="cta" data-r="cta">Start a free city</a>
<div class="stats" data-r="stats"><div><b>2,400</b><span>cities planned</span></div><div><b>18m</b><span>buildings placed</span></div><div><b>4.9★</b><span>planner rating</span></div></div>
<div class="iso" data-r="iso-city" data-must><div class="base"></div><div class="road"></div><div class="road h"></div>
<div class="b" style="left:40px;top:40px;width:120px;height:120px;--h:180px"><i class="t" style="background:#ffd36e"></i><i class="f" style="background:#f2a541"></i><i class="s" style="background:#d98a2b"></i></div>
<div class="b" style="left:300px;top:40px;width:130px;height:100px;--h:260px"><i class="t" style="background:#a3a6ff"></i><i class="f" style="background:#7b7ff0"></i><i class="s" style="background:#5c60d6"></i></div>
<div class="b" style="left:40px;top:300px;width:110px;height:130px;--h:90px"><i class="t" style="background:#ff9ec7"></i><i class="f" style="background:#ff6fa9"></i><i class="s" style="background:#e04d8a"></i></div>
<div class="b" style="left:310px;top:310px;width:110px;height:110px;--h:140px"><i class="t" style="background:#7ee0d0"></i><i class="f" style="background:#47c4b0"></i><i class="s" style="background:#2ea492"></i></div>
</div>
<div class="pin" data-r="map-pin">🏗 Town hall · 3 edits</div>
</body></html>
