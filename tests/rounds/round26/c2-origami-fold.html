<!doctype html><html><head><meta charset="utf-8"><title>Origami fold</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#e9e4da;font-family:Helvetica,Arial,sans-serif;color:#1d1d1b}
.p1{position:absolute;left:560px;top:120px;width:560px;height:620px;background:#d94f30;clip-path:polygon(0 30%,55% 0,100% 40%,45% 100%)}
.p2{position:absolute;left:560px;top:120px;width:560px;height:620px;background:#b83c22;clip-path:polygon(0 30%,45% 100%,40% 55%)}
.p3{position:absolute;left:560px;top:120px;width:560px;height:620px;background:#f08a5d;clip-path:polygon(55% 0,100% 40%,62% 38%)}
.p4{position:absolute;left:560px;top:120px;width:560px;height:620px;background:linear-gradient(160deg,#fff6 0,#fff0 60%);clip-path:polygon(40% 55%,62% 38%,100% 40%,45% 100%)}
.shadow{position:absolute;left:600px;top:700px;width:460px;height:40px;border-radius:50%;background:radial-gradient(ellipse,#0004,#0000 70%)}
.skew{position:absolute;left:80px;top:220px;width:460px;height:140px;background:#1d1d1b;transform:skewY(-6deg);color:#e9e4da;padding:24px 30px;font:900 76px/1 Helvetica;letter-spacing:-3px}
.h2{position:absolute;left:80px;top:380px;width:430px;font:400 italic 44px/1.05 Georgia,serif}
.p{position:absolute;left:80px;top:520px;width:400px;font:400 16px/1.6 Helvetica;color:#4a463f}
.steps{position:absolute;left:80px;top:650px;display:flex;gap:14px}.steps div{width:120px;height:120px;background:#fff;box-shadow:6px 6px 0 #1d1d1b;padding:14px;font:700 13px/1.3 Helvetica}.steps b{display:block;font:900 34px Helvetica;color:#d94f30}
.nav{position:absolute;left:80px;top:46px;width:1120px;display:flex;gap:26px;font:600 15px Helvetica}.nav b{margin-right:auto;font:900 20px Helvetica;letter-spacing:-1px}
.fold-line{position:absolute;left:520px;top:80px;width:2px;height:760px;background:repeating-linear-gradient(#1d1d1b 0 10px,#0000 10px 20px)}
.badge{position:absolute;left:1060px;top:90px;width:110px;height:110px;background:#1d1d1b;color:#e9e4da;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:flex;align-items:center;justify-content:center;font:800 14px Helvetica}
</style></head><body>
<div class="nav" data-r="nav"><b>fold.</b><span>Kits</span><span>Patterns</span><span>Workshops</span><span>Cart</span></div>
<div class="fold-line" data-r="dashed-fold-line"></div>
<div class="shadow" data-r="ground-shadow"></div>
<div class="p1" data-r="crane-facet-main" data-must></div><div class="p2" data-r="crane-facet-dark" data-must></div><div class="p3" data-r="crane-facet-light" data-must></div><div class="p4" data-r="crane-sheen"></div>
<div class="skew" data-r="skewed-title-band" data-must>PAPER<br>ENGINE</div>
<div class="h2" data-r="serif-subhead" data-must>One sheet, forty folds, no glue.</div>
<p class="p" data-r="copy">Monthly kits of hand-dyed washi with step cards and a video for every crease. Beginners welcome.</p>
<div class="steps" data-r="step-cards" data-must><div><b>01</b>Valley fold</div><div><b>02</b>Squash fold</div><div><b>03</b>Petal fold</div></div>
<div class="badge" data-r="diamond-badge">NEW</div>
</body></html>
