<!doctype html><html><head><meta charset="utf-8"><title>Blend mesh poster</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f2efe8;font-family:Helvetica,Arial,sans-serif;color:#111}
.mesh{position:absolute;left:0;top:0;width:1280px;height:900px;background:radial-gradient(circle at 18% 22%,#ff5f6d 0,#ff5f6d00 38%),radial-gradient(circle at 78% 30%,#ffc371 0,#ffc37100 34%),radial-gradient(circle at 60% 85%,#4facfe 0,#4facfe00 40%),radial-gradient(circle at 10% 90%,#7b2ff7 0,#7b2ff700 36%)}
.c1{position:absolute;left:640px;top:120px;width:420px;height:420px;border-radius:50%;background:#00e0b0;mix-blend-mode:multiply}
.c2{position:absolute;left:820px;top:260px;width:360px;height:360px;border-radius:50%;background:#ff2d95;mix-blend-mode:multiply}
.c3{position:absolute;left:700px;top:380px;width:300px;height:300px;border-radius:50%;background:#ffe600;mix-blend-mode:multiply}
.big{position:absolute;left:56px;top:130px;font:900 260px/0.8 Helvetica;letter-spacing:-14px;color:#111;mix-blend-mode:difference;color:#fff}
.out{position:absolute;left:70px;top:470px;font:900 200px/0.8 Helvetica;letter-spacing:-10px;color:transparent;-webkit-text-stroke:3px #111}
.vert{position:absolute;left:1210px;top:90px;writing-mode:vertical-rl;font:700 13px/1 Helvetica;letter-spacing:6px;text-transform:uppercase}
.nav{position:absolute;left:56px;top:40px;width:1120px;display:flex;gap:30px;font:700 14px Helvetica;letter-spacing:1px;text-transform:uppercase}.nav b{margin-right:auto;font-size:18px;letter-spacing:4px}
.info{position:absolute;left:640px;top:720px;width:300px;font:400 15px/1.5 Georgia,serif}
.cta{position:absolute;left:980px;top:740px;width:200px;height:56px;border-radius:28px;background:#111;color:#fff;font:700 15px/56px Helvetica;text-align:center}
.tag{position:absolute;left:620px;top:90px;padding:8px 14px;border:2px solid #111;border-radius:20px;font:700 12px Helvetica;letter-spacing:2px;background:#f2efe8;transform:rotate(-8deg)}
.num{position:absolute;left:56px;top:800px;font:400 12px/1.4 "Courier New",monospace;letter-spacing:1px}
</style></head><body>
<div class="mesh" data-r="gradient-mesh"></div>
<div class="nav" data-r="nav"><b>CHROMA</b><span>Program</span><span>Artists</span><span>Visit</span></div>
<div class="c1" data-r="blend-circle-teal" data-must></div><div class="c2" data-r="blend-circle-pink" data-must></div><div class="c3" data-r="blend-circle-yellow" data-must></div>
<h1 class="big" data-r="difference-headline" data-must>COLOR</h1>
<div class="out" data-r="outlined-headline" data-must>THEORY</div>
<div class="tag" data-r="tilted-tag">OPENS 14.11</div>
<div class="vert" data-r="vertical-label">Kunsthal · Hall 3 · 2026</div>
<p class="info" data-r="info-copy">An exhibition on overlap: what happens where pigments meet, light adds up and inks subtract.</p>
<div class="cta" data-r="cta" data-must>Book a slot</div>
<div class="num" data-r="meta-mono">N 52.37 / E 4.89<br>FREE ENTRY FRIDAYS</div>
</body></html>
