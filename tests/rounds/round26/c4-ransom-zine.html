<!doctype html><html><head><meta charset="utf-8"><title>Ransom zine</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#fbf7ee;font-family:Helvetica,Arial,sans-serif;color:#141414}

.sub{position:absolute;left:80px;top:620px;width:560px;font:900 40px/1.05 Helvetica;color:#fbf7ee;text-transform:uppercase}
.p{position:absolute;left:80px;top:740px;width:520px;font:400 16px/1.55 "Courier New",monospace;color:#dfe4ff}
