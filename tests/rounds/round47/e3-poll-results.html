<!doctype html><html><head><meta charset="utf-8"><title>T</title><style>*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;overflow:hidden;position:relative;font-family:Helvetica,Arial,sans-serif}.a{position:absolute}
