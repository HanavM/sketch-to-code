<!doctype html><html><head><meta charset="utf-8"><title>Liquid chrome</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#07070b;font-family:Helvetica,Arial,sans-serif;color:#e9e9f2}
.mesh{position:absolute;inset:0;background:radial-gradient(600px 400px at 20% 30%,rgba(120,70,255,.55),transparent 70%),radial-gradient(500px 500px at 85% 70%,rgba(0,220,200,.4),transparent 70%),radial-gradient(400px 300px at 60% 10%,rgba(255,60,140,.35),transparent 70%)}
.blob{position:absolute;left:690px;top:170px;width:470px;height:470px;border-radius:42% 58% 63% 37%/45% 38% 62% 55%;background:linear-gradient(140deg,#fdfdff 0%,#8d8fa6 30%,#24242e 50%,#c9cbe0 70%,#ffffff 100%);box-shadow:inset -30px -40px 80px rgba(0,0,0,.6),0 40px 120px rgba(120,70,255,.5);animation:mo 9s ease-in-out infinite alternate}@keyframes mo{to{border-radius:58% 42% 37% 63%/55% 62% 38% 45%}}
h1{position:absolute;left:70px;top:150px;width:900px;font-size:190px;line-height:.86;font-weight:900;letter-spacing:-9px;background:linear-gradient(180deg,#ffffff 0%,#b8bad0 45%,#3a3b4a 52%,#d7d9ee 75%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.out{position:absolute;left:74px;top:500px;font-size:120px;font-weight:900;letter-spacing:-5px;color:transparent;-webkit-text-stroke:1.5px rgba(233,233,242,.6)}
.copy{position:absolute;left:76px;top:680px;width:420px;font-size:17px;line-height:1.55;color:#a7a8bd}
.btn{position:absolute;left:76px;top:790px;padding:14px 26px;border-radius:999px;background:#e9e9f2;color:#07070b;font-weight:800}
.btn2{position:absolute;left:250px;top:790px;padding:13px 24px;border-radius:999px;border:1px solid rgba(233,233,242,.4);color:#e9e9f2}
.tag{position:absolute;left:1000px;top:690px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);font-size:13px}
nav{position:absolute;left:70px;top:40px;width:1140px;display:flex;justify-content:space-between;font-size:14px;color:#a7a8bd}
</style></head><body>
<div class="mesh"></div>
<nav data-r="nav"><b style="color:#fff">MERCURY®</b><span>Sound · Objects · Lab · Cart (0)</span></nav>
<div class="blob" data-r="chrome-blob" data-must></div>
<h1 data-r="headline" data-must>Liquid<br>metal</h1>
<div class="out" data-r="outline-word">SOUND</div>
<p class="copy" data-r="copy">Speakers poured from a single piece of aluminium, polished until the room reflects in them.</p>
<a class="btn" data-r="cta">Pre-order</a><a class="btn2" data-r="cta2">Listen ▶</a>
<div class="tag" data-r="glass-tag">● 38 Hz – 24 kHz</div>
</body></html>
