<!doctype html><html><head><meta charset="utf-8"><title>Plant shop</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#eef2e6;font-family:Helvetica,Arial,sans-serif;color:#24361f;overflow:hidden}
nav{display:flex;justify-content:space-between;padding:32px 80px;font-size:15px}.logo{font-weight:800;font-size:22px}

<nav data-r="nav"><div class="logo" data-r="logo">greenroom</div><div>Plants · Pots · Care · Cart (0)</div></nav>
<h1 data-r="headline" data-must>Easy plants for busy people</h1>
<p class="sub" data-r="subhead">Hard to kill, delivered in a pot.</p>
<div class="row" data-r="products" data-must>
<div class="card" data-r="card-1"><div class="arch" style="background:#d6e3c3"><div class="leaves"></div><div class="pot"></div></div><h3>Snake plant</h3><span>$32</span></div>
<div class="card" data-r="card-2"><div class="arch" style="background:#f2d9c4"><div class="leaves"></div><div class="pot"></div></div><h3>Pothos</h3><span>$24</span></div>
<div class="card" data-r="card-3"><div class="arch" style="background:#d4dfe9"><div class="leaves"></div><div class="pot"></div></div><h3>ZZ plant</h3><span>$38</span></div>
</div></body></html>
