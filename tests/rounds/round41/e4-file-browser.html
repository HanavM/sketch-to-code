<!doctype html><html><head><meta charset="utf-8"><title>Files</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#1d2433;overflow:hidden;display:flex}
.side{width:240px;background:#f3f5f8;border-right:1px solid #e2e6ec;padding:28px 20px;font-size:15px}.side .i{padding:10px 12px;border-radius:8px;margin-bottom:4px}.side .on{background:#dbe7ff;color:#1d4ed8;font-weight:700}
.side .up{margin-top:30px;height:44px;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.store{margin-top:300px;font-size:13px;color:#6b7280}.store i{display:block;height:8px;border-radius:4px;background:#e2e6ec;margin-top:8px;position:relative}.store i:after{content:"";position:absolute;left:0;top:0;height:8px;width:62%;border-radius:4px;background:#2563eb}
.main{flex:1;padding:28px 40px}.top{display:flex;align-items:center;gap:16px}.search{flex:1;height:44px;border:1px solid #d6dbe3;border-radius:22px;padding:0 20px;display:flex;align-items:center;color:#9aa2af}.av{width:40px;height:40px;border-radius:50%;background:#f59e0b}
.crumb{margin-top:30px;font-size:22px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:24px}
.f{height:150px;border:1px solid #e2e6ec;border-radius:12px;padding:18px}.f .ic{width:56px;height:44px;border-radius:6px;background:#fbbf24}.f b{display:block;margin-top:30px;font-size:15px}.f small{color:#8b93a1;font-size:13px}
.f.doc .ic{width:40px;height:52px;background:#93c5fd}.f.pic .ic{width:56px;height:44px;background:#86efac}
</style></head><body>
<div class="side" data-r="sidebar" data-must><div class="i on">My files</div><div class="i">Shared</div><div class="i">Recent</div><div class="i">Starred</div><div class="i">Trash</div><div class="up" data-r="upload">Upload</div><div class="store" data-r="storage">62% of 15 GB used<i></i></div></div>
<div class="main"><div class="top"><div class="search" data-r="search" data-must>Search files</div><div class="av" data-r="avatar"></div></div>
<div class="crumb" data-r="breadcrumb">My files › Projects</div>
<div class="grid" data-r="file-grid" data-must>
<div class="f"><div class="ic"></div><b>Client work</b><small>14 files</small></div><div class="f"><div class="ic"></div><b>Invoices</b><small>32 files</small></div><div class="f"><div class="ic"></div><b>Photos</b><small>208 files</small></div><div class="f"><div class="ic"></div><b>Archive</b><small>9 files</small></div>
<div class="f doc"><div class="ic"></div><b>Brief.docx</b><small>2 MB</small></div><div class="f pic"><div class="ic"></div><b>Cover.png</b><small>4 MB</small></div><div class="f doc"><div class="ic"></div><b>Budget.xlsx</b><small>1 MB</small></div><div class="f pic"><div class="ic"></div><b>Logo.svg</b><small>80 KB</small></div>
</div></div></body></html>
