<!doctype html><html><head><meta charset="utf-8"><title>Hotel search</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#1a1a2e;overflow:hidden}
.hero{height:300px;background:#0b3d5c;padding:40px 80px;color:#fff}.hero .logo{font-weight:800;font-size:22px}.hero h1{font-size:40px;margin-top:50px}
.bar{position:relative;margin:-50px 80px 0;height:100px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;align-items:center;padding:0 24px;gap:16px}
.fld{flex:1;border-right:1px solid #e5e7eb;padding:0 12px;font-size:13px;color:#6b7280}.fld b{display:block;color:#1a1a2e;font-size:16px;margin-top:6px}
.go{width:150px;height:56px;border-radius:10px;background:#f43f5e;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
h2{margin:40px 80px 0;font-size:22px}.cards{display:flex;gap:28px;margin:20px 80px 0}
.c{flex:1}.c .ph{height:200px;border-radius:12px;background:#9fc5d9}.c b{display:block;margin-top:14px;font-size:17px}.c span{display:block;color:#6b7280;font-size:14px;margin-top:4px}.c em{display:block;font-style:normal;font-weight:700;margin-top:8px}
</style></head><body>
<div class="hero" data-r="hero" data-must><div class="logo">staybird</div><h1 data-r="headline">Find a place to stay</h1></div>
<div class="bar" data-r="search-bar" data-must><div class="fld">Where<b>Lisbon</b></div><div class="fld">Check in<b>Apr 4</b></div><div class="fld">Check out<b>Apr 7</b></div><div class="fld" style="border:0">Guests<b>2 adults</b></div><div class="go" data-r="search-button" data-must>Search</div></div>
<h2 data-r="section-title">Popular this week</h2>
<div class="cards" data-r="cards" data-must>
<div class="c"><div class="ph"></div><b>Casa Azul</b><span>Alfama · 4.8 ★</span><em>$120 / night</em></div>
<div class="c"><div class="ph" style="background:#e8c39e"></div><b>Rio Loft</b><span>Cais do Sodré · 4.6 ★</span><em>$95 / night</em></div>
<div class="c"><div class="ph" style="background:#b8d8b0"></div><b>Jardim House</b><span>Príncipe Real · 4.9 ★</span><em>$160 / night</em></div>
</div></body></html>
