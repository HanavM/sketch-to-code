<!doctype html><html><head><meta charset="utf-8"><title>Week calendar</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#1f2430;overflow:hidden;position:relative}
.bar{display:flex;align-items:center;gap:18px;padding:24px 40px;border-bottom:1px solid #e3e6ec}.bar h1{font-size:24px;flex:1}.btn{padding:9px 18px;border:1px solid #cfd4dd;border-radius:8px;font-size:14px}.new{background:#0f766e;color:#fff;border-color:#0f766e;font-weight:700}
.head{position:absolute;left:100px;top:90px;right:40px;display:grid;grid-template-columns:repeat(5,1fr);font-size:14px;color:#6b7280;text-align:center;padding:14px 0;border-bottom:1px solid #e3e6ec}.head b{display:block;font-size:22px;color:#1f2430;margin-top:4px}.head .today b{color:#fff;background:#0f766e;border-radius:50%;width:38px;height:38px;line-height:38px;margin:4px auto 0}
.grid{position:absolute;left:100px;top:170px;right:40px;bottom:0;background-image:linear-gradient(#eef0f4 1px,transparent 1px),linear-gradient(90deg,#eef0f4 1px,transparent 1px);background-size:100% 80px,228px 100%}
.hrs{position:absolute;left:30px;top:162px;font-size:12px;color:#9aa1ad;line-height:80px}
.ev{position:absolute;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700}.ev small{display:block;font-weight:400;margin-top:4px;font-size:12px}
</style></head><body>
