<!doctype html><html><head><meta charset="utf-8"><title>Kite club</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#bfe3f7;font-family:Helvetica,Arial,sans-serif;color:#0d2a4a;overflow:hidden;position:relative}
nav{display:flex;justify-content:space-between;align-items:center;padding:32px 72px;font-size:15px}.logo{font-weight:800;font-size:22px}.links{display:flex;gap:30px}
.k{position:absolute;transform:rotate(45deg)}
.k1{left:780px;top:150px;width:200px;height:200px;background:#ff5a4e}.k2{left:1040px;top:300px;width:120px;height:120px;background:#ffc93c}.k3{left:860px;top:520px;width:90px;height:90px;background:#2f6fd6}
.tail{position:absolute;width:6px;background:#0d2a4a;transform-origin:top}
.t1{left:877px;top:390px;height:220px;transform:rotate(-14deg)}.t2{left:1098px;top:445px;height:150px;transform:rotate(10deg)}
h1{position:absolute;left:72px;top:230px;width:600px;font-size:84px;line-height:1;font-weight:800;letter-spacing:-2px}
p{position:absolute;left:76px;top:440px;width:440px;font-size:19px;line-height:1.5;color:#2c4d6e}
.cta{position:absolute;left:76px;top:570px;width:200px;height:56px;border-radius:28px;background:#ff5a4e;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.hill{position:absolute;left:-100px;top:740px;width:1480px;height:400px;border-radius:50%;background:#5fb86a}
</style></head><body>
<nav data-r="nav"><div class="logo" data-r="logo">updraft</div><div class="links"><span>Classes</span><span>Fly days</span><span>Shop</span></div></nav>
<div class="k k1" data-r="kite-red" data-must></div><div class="k k2" data-r="kite-yellow"></div><div class="k k3" data-r="kite-blue"></div>
<div class="tail t1" data-r="tail"></div><div class="tail t2"></div>
<h1 data-r="headline" data-must>Learn to fly on Sundays.</h1>
<p data-r="subhead">Beginner kite classes on the hill, kites included. Bring a coat and a friend.</p>
<div class="cta" data-r="cta" data-must>Book a class</div>
<div class="hill" data-r="hill" data-must></div>
</body></html>
