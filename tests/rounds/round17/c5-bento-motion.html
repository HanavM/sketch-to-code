<!doctype html><html><head><meta charset="utf-8"><title>Bento motion</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#0b0b0f;font-family:Helvetica,Arial,sans-serif;color:#f4f4f5}
@keyframes up{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.7)}100%{box-shadow:0 0 0 14px rgba(34,211,238,0)}}@keyframes slide{to{transform:translateX(-50%)}}
.grid{position:absolute;left:40px;top:150px;width:1200px;height:700px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:16px}
.t{border-radius:24px;background:#18181b;border:1px solid #27272a;padding:24px;position:relative;overflow:hidden}
.t h4{font-size:13px;color:#a1a1aa;font-weight:500;margin-bottom:8px}
.big{grid-column:1/3;grid-row:1/3;background:radial-gradient(circle at 20% 20%,#7c3aed,transparent 50%),radial-gradient(circle at 80% 70%,#22d3ee,transparent 45%),#18181b}
.big h2{font-size:64px;line-height:1;font-weight:800;margin-top:150px;letter-spacing:-2px}
.ctr{grid-column:3/4;grid-row:1/2}.lat{grid-column:4/5;grid-row:1/2}.ctr b{font-size:72px;font-weight:800;letter-spacing:-3px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}.bars i{flex:1;background:#22d3ee;border-radius:6px 6px 0 0;transform-origin:bottom;animation:up 2s ease-in-out infinite}
.map{grid-column:3/5;grid-row:2/3;background:radial-gradient(#3f3f46 1.5px,transparent 2px) 0 0/16px 16px,#18181b}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#22d3ee;animation:pulse 1.6s infinite}
.vert{grid-column:4/5;grid-row:3/4;background:#facc15;color:#0b0b0f}.vert span{position:absolute;left:24px;bottom:20px;font-size:44px;font-weight:900;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:-2px}
.strip{grid-column:1/4;grid-row:3/4;overflow:hidden;white-space:nowrap;display:flex;align-items:center;font-size:30px;font-weight:800;color:#52525b}.strip span{display:inline-block;animation:slide 18s linear infinite}
nav{position:absolute;left:40px;top:40px;width:1200px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
nav a{padding:10px 18px;border-radius:999px;background:#f4f4f5;color:#0b0b0f;font-weight:700}
.h{position:absolute;left:40px;top:92px;font-size:22px;color:#a1a1aa}
</style></head><body>
<nav data-r="nav"><b>orbit</b><span>Product · Customers · Changelog</span><a>Book a demo</a></nav>
<p class="h" data-r="intro">Everything your edge network is doing, live.</p>
<div class="grid" data-r="bento" data-must>
<div class="t big"><h4>NETWORK</h4><h2>Faster everywhere.</h2></div>
<div class="t ctr"><h4>Requests / sec</h4><b>48.2k</b></div>
<div class="t vert"><span>99.99%</span></div>
<div class="t lat"><h4>Latency (ms)</h4><div class="bars"><i style="height:40%"></i><i style="height:70%;animation-delay:.2s"></i><i style="height:55%;animation-delay:.4s"></i><i style="height:90%;animation-delay:.6s"></i><i style="height:65%;animation-delay:.8s"></i></div></div>
<div class="t map"><h4>Edge regions</h4><i class="dot" style="left:120px;top:90px"></i><i class="dot" style="left:300px;top:130px"></i><i class="dot" style="left:470px;top:70px"></i></div>
<div class="t strip"><span>ACME · GLOBEX · INITECH · UMBRELLA · HOOLI · ACME · GLOBEX · INITECH · UMBRELLA · HOOLI ·</span></div>
</div>
</body></html>
