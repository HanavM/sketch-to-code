<!doctype html><html><head><meta charset="utf-8"><title>Masked collage</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#fbf6ee;font-family:Helvetica,Arial,sans-serif;color:#1f1b16}
.word{position:absolute;left:40px;top:90px;font-size:330px;font-weight:900;letter-spacing:-18px;line-height:1;background:radial-gradient(circle at 25% 40%,#ff7a59 0 18%,transparent 19%),radial-gradient(circle at 70% 60%,#3b7dd8 0 22%,transparent 23%),linear-gradient(115deg,#ffd166 0 35%,#06a77d 35% 60%,#ef476f 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
.p1{position:absolute;left:760px;top:420px;width:330px;height:300px;background:#06a77d;clip-path:polygon(6% 4%,96% 0,100% 88%,10% 100%,0 40%);transform:rotate(-6deg)}
.p2{position:absolute;left:880px;top:470px;width:300px;height:330px;background:linear-gradient(160deg,#ffd166,#ff7a59);clip-path:polygon(0 8%,92% 0,100% 100%,4% 94%);transform:rotate(8deg);box-shadow:0 0 0 #000}
.p3{position:absolute;left:820px;top:540px;width:220px;height:220px;border-radius:50%;background:#3b7dd8;mix-blend-mode:multiply}
.tape{position:absolute;width:140px;height:34px;background:rgba(255,236,170,.75);border-left:2px dashed rgba(0,0,0,.15);border-right:2px dashed rgba(0,0,0,.15)}
.t1{left:780px;top:400px;transform:rotate(-24deg)}.t2{left:1080px;top:470px;transform:rotate(30deg)}
.copy{position:absolute;left:60px;top:500px;width:430px;font-family:Georgia,serif;font-size:24px;line-height:1.4}
.copy b{background:#ffd166;font-weight:400;padding:0 4px}
.stamp{position:absolute;left:560px;top:520px;width:130px;height:130px;border-radius:50%;border:3px solid #ef476f;color:#ef476f;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:800;letter-spacing:2px;transform:rotate(-14deg)}
.btn{position:absolute;left:60px;top:700px;padding:15px 28px;border:2px solid #1f1b16;border-radius:999px;font-weight:700}
.foot{position:absolute;left:60px;top:850px;width:1160px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px}
nav{position:absolute;left:60px;top:36px;width:1160px;display:flex;justify-content:space-between;font-size:14px}
</style></head><body>
<nav data-r="nav"><b>PAPER ROOM</b><span>Issues · Makers · Fair · Join</span></nav>
<div class="word" data-r="masked-word" data-must>CUT</div>
<div class="p1" data-r="cutout-green" data-must></div><div class="p2" data-r="cutout-orange"></div><div class="p3" data-r="blend-disc"></div>
<div class="tape t1" data-r="tape-1"></div><div class="tape t2" data-r="tape-2"></div>
<p class="copy" data-r="copy">A zine fair for <b>scissors people</b>: collage, risograph and glue, three days in an old print hall.</p>
<div class="stamp" data-r="stamp">MAY<br>9–11<br>2027</div>
<a class="btn" data-r="cta">Get a table →</a>
<div class="foot" data-r="footer"><span>HALL 4, DOCK ROAD</span><span>FREE ENTRY</span><span>@PAPERROOM</span></div>
</body></html>
