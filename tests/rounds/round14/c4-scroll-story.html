<!doctype html><html><head><meta charset="utf-8"><title>Scroll story</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#0d1b1e;font-family:Helvetica,Arial,sans-serif;color:#e9f1ee}
.l1{position:absolute;left:-40px;top:520px;width:1400px;height:420px;background:#163a3a;transform:skewY(-6deg)}
.l2{position:absolute;left:-40px;top:620px;width:1400px;height:400px;background:#1f5a50;transform:skewY(4deg)}
.l3{position:absolute;left:-40px;top:720px;width:1400px;height:300px;background:#c9f27a;transform:skewY(-3deg)}
.reveal{position:absolute;left:700px;top:90px;width:460px;height:460px;border-radius:50%;background:linear-gradient(200deg,#f9c46b,#e86a5b 55%,#4a2c5e);-webkit-mask:radial-gradient(circle at 50% 50%,#000 0 60%,transparent 60.5% 66%,#000 66.5%)}
.rail{position:absolute;left:40px;top:120px;width:4px;height:600px;background:#244042}.rail i{position:absolute;left:0;top:0;width:4px;height:230px;background:#c9f27a}
.steps{position:absolute;left:60px;top:116px;font-family:monospace;font-size:12px;line-height:150px;color:#6f8f8a}.steps b{color:#c9f27a;font-weight:400}
.chap{position:absolute;left:120px;top:120px;font-family:monospace;font-size:14px;color:#c9f27a;letter-spacing:3px}
h1{position:absolute;left:120px;top:160px;width:560px;font-family:Georgia,serif;font-weight:400;font-size:76px;line-height:1.02}
h1 i{color:#f9c46b}
.copy{position:absolute;left:124px;top:420px;width:440px;font-size:17px;line-height:1.6;color:#a9c2bc}
.mq{position:absolute;left:0;top:600px;width:1280px;white-space:nowrap;font-size:150px;font-weight:900;color:transparent;-webkit-text-stroke:1.5px rgba(233,241,238,.35);animation:m 18s linear infinite}@keyframes m{to{transform:translateX(-50%)}}
.cue{position:absolute;left:600px;top:820px;width:80px;text-align:center;font-size:12px;letter-spacing:3px;color:#0d1b1e}
.cue::after{content:"";display:block;margin:8px auto 0;width:2px;height:30px;background:#0d1b1e}
nav{position:absolute;left:120px;top:40px;width:1100px;display:flex;justify-content:space-between;font-size:14px;color:#a9c2bc}
</style></head><body>
<nav data-r="nav"><b style="color:#fff">THE LONG WALK</b><span>Chapters · Map · Photos · About</span></nav>

<div class="rail" data-r="progress-rail"><i></i></div>

</body></html>
