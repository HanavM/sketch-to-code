<!doctype html><html><head><meta charset="utf-8"><title>Billing</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fafafa;font-family:Helvetica,Arial,sans-serif;color:#18181b;overflow:hidden}
.top{height:64px;background:#fff;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;padding:0 40px;font-size:18px;font-weight:700}
.wrap{width:880px;margin:48px auto 0}
h1{font-size:30px;font-weight:800}
.plan{margin-top:28px;background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center}
.plan b{font-size:22px}.plan p{margin-top:6px;color:#71717a;font-size:15px}
.btn{background:#2563eb;color:#fff;font-weight:700;padding:12px 24px;border-radius:8px;font-size:15px}
.use{margin-top:24px;background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:28px 32px}
.use h2{font-size:18px}.u{margin-top:22px;font-size:15px}.u div{margin-top:8px;height:10px;background:#e4e4e7;border-radius:5px}.u div i{display:block;height:10px;border-radius:5px;background:#2563eb}
</style></head><body>
<div class="top" data-r="topbar">Acme Cloud</div>
<div class="wrap"><h1 data-r="heading">Billing</h1>
<div class="plan" data-r="plan-card" data-must><div><b>Pro plan</b><p>$29 per month · renews 1 Dec</p></div><span class="btn" data-r="upgrade" data-must>Upgrade</span></div>
<div class="use" data-r="usage-card" data-must><h2>Usage this month</h2>
<div class="u">Storage · 62 of 100 GB<div><i style="width:62%"></i></div></div>
<div class="u">Bandwidth · 410 of 500 GB<div><i style="width:82%"></i></div></div>
<div class="u">Seats · 4 of 10<div><i style="width:40%"></i></div></div></div></div>
</body></html>
