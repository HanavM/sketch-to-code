<!doctype html><html><head><meta charset="utf-8"><title>Surf school</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff7ed;font-family:Helvetica,Arial,sans-serif;color:#0c4a6e;overflow:hidden;position:relative}
.sea{position:absolute;left:0;top:0;width:640px;height:900px;background:linear-gradient(180deg,#38bdf8 0%,#0369a1 100%)}
.sun{position:absolute;left:380px;top:120px;width:150px;height:150px;border-radius:50%;background:#fde047}
.wave{position:absolute;left:0;top:560px;width:640px;height:340px;background:#e0f2fe;border-radius:60% 40% 0 0/40% 60% 0 0}
nav{position:absolute;left:720px;top:48px;right:72px;display:flex;justify-content:space-between;font-size:16px}
nav b{font-size:20px}
h1{position:absolute;left:720px;top:250px;width:500px;font-size:72px;line-height:1;font-weight:800}
p{position:absolute;left:720px;top:430px;width:440px;font-size:20px;line-height:1.5;color:#475569}
.btn{position:absolute;left:720px;top:560px;background:#f97316;color:#fff;font-weight:700;font-size:18px;padding:18px 34px;border-radius:10px}
.note{position:absolute;left:720px;top:680px;font-size:15px;color:#64748b}
</style></head><body>
<div class="sea" data-r="sea-panel" data-must></div>
<div class="sun" data-r="sun" data-must></div>
<div class="wave" data-r="wave"></div>
<nav data-r="nav"><b data-r="logo">Swell</b><span>Lessons · Camps · Rentals</span></nav>
<h1 data-r="headline" data-must>Catch your first wave.</h1>
<p data-r="subhead">Small groups, warm boards and coaches who have done it ten thousand times.</p>
<span class="btn" data-r="cta" data-must>Book a lesson</span>
<div class="note" data-r="note">From $45 · boards and wetsuits included</div>
</body></html>
