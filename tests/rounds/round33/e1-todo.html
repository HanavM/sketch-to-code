<!doctype html><html><head><meta charset="utf-8"><title>To-do</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#eef2ff;font-family:Helvetica,Arial,sans-serif;color:#1e1b4b;overflow:hidden}
.card{margin:110px auto 0;width:560px;background:#fff;border-radius:16px;padding:36px 40px;box-shadow:0 10px 30px rgba(30,27,75,.08)}
h1{font-size:30px;font-weight:800}
.add{margin-top:24px;height:52px;border:2px solid #c7d2fe;border-radius:10px;display:flex;align-items:center;padding:0 16px;color:#94a3b8;font-size:16px}
.it{display:flex;align-items:center;gap:14px;height:58px;border-bottom:1px solid #e2e8f0;font-size:17px}
.it i{width:22px;height:22px;border:2px solid #6366f1;border-radius:6px}.it.d i{background:#6366f1}.it.d span{color:#94a3b8;text-decoration:line-through}
.list{margin-top:14px}
.foot{margin-top:20px;font-size:14px;color:#64748b}
</style></head><body>
<div class="card" data-r="card" data-must><h1 data-r="title">Today</h1><div class="add" data-r="input" data-must>Add a task…</div>
<div class="list" data-r="tasks" data-must><div class="it d"><i></i><span>Water the plants</span></div><div class="it"><i></i><span>Call the dentist</span></div><div class="it"><i></i><span>Buy oat milk</span></div><div class="it d"><i></i><span>Send invoice</span></div><div class="it"><i></i><span>Book train to Leeds</span></div></div>
<div class="foot" data-r="footer">3 left · Clear done</div></div>
</body></html>
