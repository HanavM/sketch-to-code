<!doctype html><html><head><meta charset="utf-8"><title>Glass aurora</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#0b0820;font-family:Helvetica,Arial,sans-serif;color:#fff}
@keyframes hue{to{filter:hue-rotate(60deg) blur(70px)}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);animation:hue 8s linear infinite alternate}
.b1{left:80px;top:120px;width:460px;height:460px;background:#7b2ff7}.b2{left:620px;top:40px;width:520px;height:420px;background:#00d4ff}.b3{left:460px;top:520px;width:480px;height:360px;background:#ff2fb3}
.grain{position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 30%,#fff1 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.nav{position:absolute;left:340px;top:28px;width:600px;height:56px;border-radius:999px;background:#ffffff1a;backdrop-filter:blur(18px);border:1px solid #ffffff33;display:flex;align-items:center;justify-content:space-around;font:600 14px Helvetica}
.card{position:absolute;border-radius:28px;background:#ffffff14;backdrop-filter:blur(24px);border:1px solid #ffffff3a;box-shadow:0 20px 60px #0006}
.main{left:120px;top:180px;width:620px;height:460px;padding:48px}
.main h1{font:700 64px/1.02 Helvetica;letter-spacing:-2px}.main p{margin-top:22px;font-size:18px;line-height:1.55;color:#ffffffcc;width:460px}
.main .btn{display:inline-block;margin-top:30px;padding:16px 30px;border-radius:999px;background:#fff;color:#0b0820;font-weight:700}
.stat{left:800px;top:220px;width:320px;height:200px;padding:30px;transform:rotate(4deg)}.stat b{display:block;font:700 72px/1 Helvetica}.stat span{color:#ffffffaa}
.chip{left:840px;top:480px;width:280px;height:120px;padding:24px;transform:rotate(-3deg);display:flex;gap:14px;align-items:center}.chip i{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#ff2fb3,#7b2ff7)}
.foot{position:absolute;left:120px;top:720px;display:flex;gap:40px;font:600 13px Helvetica;letter-spacing:2px;color:#ffffff99;text-transform:uppercase}
</style></head><body>
<div class="blob b1" data-r="blob-violet"></div><div class="blob b2" data-r="blob-cyan"></div><div class="blob b3" data-r="blob-pink"></div><div class="grain"></div>
<div class="nav" data-r="glass-nav"><span>Aurora</span><span>Features</span><span>Pricing</span><span>Sign in</span></div>
<div class="card main" data-r="glass-hero" data-must><h1>Light you can work inside</h1><p>Aurora is a calm workspace that bends around your focus. No tabs, no noise, just the next thing.</p><div class="btn">Get early access</div></div>
<div class="card stat" data-r="stat-card" data-must><b>3.2×</b><span>longer deep-work blocks</span></div>
<div class="card chip" data-r="app-chip"><i></i><div><b>Focus mode</b><br><span style="color:#ffffffaa">on until 14:30</span></div></div>
<div class="foot" data-r="logos"><span>Linear</span><span>Arc</span><span>Raycast</span><span>Vercel</span></div>
</body></html>
