<!doctype html><html><head><meta charset="utf-8"><title>Isometric town</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#bfe6ff 0%,#fdf3e1 100%);font-family:Helvetica,Arial,sans-serif;color:#22223b}
@keyframes drift{to{transform:translateX(60px)}}
.scene{position:absolute;left:560px;top:180px;width:600px;height:600px;transform:rotateX(55deg) rotateZ(-45deg);transform-style:preserve-3d}
.ground{position:absolute;left:0;top:0;width:600px;height:600px;background:#9ad17a;box-shadow:0 0 0 24px #6fa856}
.b{position:absolute;transform-style:preserve-3d}.b .top{position:absolute;inset:0;transform:translateZ(var(--h))}
.b .f1{position:absolute;left:0;bottom:0;width:100%;height:var(--h);transform-origin:bottom;transform:rotateX(-90deg)}
.b .f2{position:absolute;right:0;top:0;width:var(--h);height:100%;transform-origin:right;transform:rotateY(90deg)}
.t1{left:60px;top:60px;width:160px;height:160px;--h:180px}.t1 .top{background:#ffd166}.t1 .f1{background:#e0a93c}.t1 .f2{background:#c78f22}
.t2{left:300px;top:80px;width:200px;height:120px;--h:90px}.t2 .top{background:#ef476f}.t2 .f1{background:#c9375a}.t2 .f2{background:#a82847}
.t3{left:120px;top:340px;width:120px;height:200px;--h:260px}.t3 .top{background:#118ab2}.t3 .f1{background:#0d6f8f}.t3 .f2{background:#095670}
.road{position:absolute;left:270px;top:0;width:40px;height:600px;background:#555}
.cloud{position:absolute;height:44px;border-radius:999px;background:#fff;opacity:.9;animation:drift 9s ease-in-out infinite alternate}
.c1{left:620px;top:90px;width:180px}.c2{left:980px;top:150px;width:120px}
.h{position:absolute;left:64px;top:170px;width:470px;font:800 76px/0.98 Helvetica;letter-spacing:-3px}
.h em{font-style:normal;color:#ef476f}
.p{position:absolute;left:64px;top:440px;width:400px;font-size:18px;line-height:1.55;color:#4a4e69}
.btn{position:absolute;left:64px;top:560px;padding:16px 28px;background:#22223b;color:#fff;border-radius:10px;font-weight:700;box-shadow:6px 6px 0 #ef476f}
.tag{position:absolute;padding:8px 14px;background:#fff;border-radius:8px;font:700 13px Helvetica;box-shadow:0 6px 18px #0002}.g1{left:720px;top:300px}.g2{left:1010px;top:420px}
.nav{position:absolute;left:64px;top:40px;font:800 20px Helvetica}
</style></head><body>
<div class="nav" data-r="logo">▲ Blocktown</div>
<div class="cloud c1" data-r="cloud-1"></div><div class="cloud c2" data-r="cloud-2"></div>
<div class="scene" data-r="iso-scene" data-must><div class="ground"></div><div class="road"></div>
<div class="b t1"><div class="top"></div><div class="f1"></div><div class="f2"></div></div>
<div class="b t2"><div class="top"></div><div class="f1"></div><div class="f2"></div></div>
<div class="b t3"><div class="top"></div><div class="f1"></div><div class="f2"></div></div></div>
<h1 class="h" data-r="headline" data-must>Plan a city in <em>blocks</em>, not spreadsheets</h1>
<p class="p" data-r="lede">Drag towers, roads and parks onto a live isometric map. Zoning rules check themselves as you build.</p>
<div class="btn" data-r="cta">Start building</div>
<div class="tag g1" data-r="tag-1">Library · 4 floors</div><div class="tag g2" data-r="tag-2">Tower B · 12 floors</div>
</body></html>
