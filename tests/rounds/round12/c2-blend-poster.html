<!doctype html><html><head><meta charset="utf-8"><title>Blend poster</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f0ece2;font-family:Helvetica,Arial,sans-serif;color:#111}
.disc{position:absolute;left:640px;top:90px;width:560px;height:560px;border-radius:50%;background:#ff3b1f}
.bar{position:absolute;left:-40px;top:520px;width:900px;height:150px;background:#1f4bff;transform:rotate(-8deg)}
.big{position:absolute;left:40px;top:120px;font-size:330px;font-weight:900;letter-spacing:-18px;line-height:.8;color:#fff;mix-blend-mode:difference}
.side{position:absolute;left:1210px;top:120px;writing-mode:vertical-rl;font-size:14px;font-weight:700;letter-spacing:6px}
.kick{position:absolute;left:56px;top:40px;font-size:13px;font-weight:700;letter-spacing:4px}
.date{position:absolute;left:880px;top:700px;width:340px;font-size:54px;font-weight:900;line-height:.95;letter-spacing:-2px}
.date small{display:block;font-size:15px;letter-spacing:2px;font-weight:700;margin-top:12px}
.ring{position:absolute;left:520px;top:640px;width:180px;height:180px;border-radius:50%;border:2px dashed #111;animation:spin 20s linear infinite}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:2px}@keyframes spin{to{transform:rotate(360deg)}}
.copy{position:absolute;left:56px;top:740px;width:380px;font-size:16px;line-height:1.5}
</style></head><body>
<div class="kick" data-r="kicker">SOUND / SPACE FESTIVAL — 12TH EDITION</div>
<div class="disc" data-r="red-disc" data-must></div>
<div class="bar" data-r="blue-bar" data-must></div>
<div class="big" data-r="headline" data-must>LOUD<br>ROOM</div>
<div class="side" data-r="side-label">SIDE A · 33 RPM</div>
<div class="ring" data-r="spin-ring"><b>TICKETS</b></div>
<p class="copy" data-r="subcopy">Three nights, nine stages, one warehouse. Bring earplugs and somebody you like.</p>
<div class="date" data-r="date-block" data-must>MAR 14–16<small>PIER 9 · LISBON</small></div>
</body></html>
