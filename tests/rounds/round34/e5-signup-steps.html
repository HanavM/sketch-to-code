<!doctype html><html><head><meta charset="utf-8"><title>Setup</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f0fdfa;font-family:Helvetica,Arial,sans-serif;color:#134e4a;overflow:hidden}
.steps{display:flex;align-items:center;justify-content:center;margin-top:80px}
.c{width:44px;height:44px;border-radius:50%;border:3px solid #99f6e4;background:#fff;text-align:center;line-height:38px;font-weight:700;color:#5eead4}
.c.d{background:#0d9488;border-color:#0d9488;color:#fff}.c.n{border-color:#0d9488;color:#0d9488}
.ln{width:160px;height:4px;background:#99f6e4}.ln.d{background:#0d9488}
.card{width:560px;margin:56px auto 0;background:#fff;border-radius:16px;padding:40px 44px;box-shadow:0 8px 24px rgba(13,148,136,.12)}
h1{font-size:28px;font-weight:800}.card p{margin-top:8px;color:#5f7f7c;font-size:16px}
label{display:block;margin-top:26px;font-size:14px;font-weight:700}
.in{margin-top:8px;height:48px;border:1px solid #cbd5e1;border-radius:8px}
.row{display:flex;justify-content:space-between;margin-top:34px}
.bk{padding:14px 26px;font-weight:700;color:#0d9488;font-size:16px}
.nx{background:#0d9488;color:#fff;padding:14px 32px;border-radius:8px;font-weight:700;font-size:16px}
</style></head><body>
<div class="steps" data-r="stepper" data-must><div class="c d">1</div><div class="ln d"></div><div class="c n">2</div><div class="ln"></div><div class="c">3</div></div>
<div class="card" data-r="form-card" data-must><h1 data-r="title">Your workspace</h1><p>Step 2 of 3 · you can change this later</p>
<label>Workspace name</label><div class="in" data-r="input-1"></div>
<label>Team size</label><div class="in" data-r="input-2"></div>
<div class="row"><span class="bk" data-r="back">Back</span><span class="nx" data-r="next" data-must>Continue</span></div></div>
</body></html>
