<!doctype html><html><head><meta charset="utf-8"><title>Ferry</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:linear-gradient(#7dd3fc,#e0f2fe);font-family:Helvetica,Arial,sans-serif;color:#0c4a6e;overflow:hidden;position:relative}
.sea{position:absolute;left:0;top:520px;width:1280px;height:380px;background:#075985}
.sun{position:absolute;left:880px;top:150px;width:200px;height:200px;border-radius:50%;background:#fde047}
.sail{position:absolute;left:300px;top:200px;width:0;height:0;border-left:170px solid transparent;border-right:0 solid transparent;border-bottom:300px solid #fff}
.hull{position:absolute;left:180px;top:500px;width:340px;height:44px;background:#b91c1c;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
h1{position:absolute;left:640px;top:600px;font-size:96px;line-height:1;font-weight:900;color:#fff;letter-spacing:-1px}
p{position:absolute;left:644px;top:720px;font-size:22px;color:#bae6fd}
.logo{position:absolute;left:60px;top:40px;font-size:20px;font-weight:800;letter-spacing:3px}
.btn{position:absolute;left:644px;top:790px;background:#fde047;color:#0c4a6e;font-weight:800;font-size:18px;padding:14px 30px;border-radius:30px}
</style></head><body>
<div class="logo" data-r="logo">ISLAND LINE</div>
<div class="sun" data-r="sun" data-must></div>
<div class="sea" data-r="sea" data-must></div>
<div class="sail" data-r="sail" data-must></div><div class="hull" data-r="hull"></div>
<h1 data-r="headline" data-must>Sail at six</h1>
<p data-r="details">Daily crossings · 40 minutes · bikes free</p>
<span class="btn" data-r="cta" data-must>Buy a crossing</span>
</body></html>
