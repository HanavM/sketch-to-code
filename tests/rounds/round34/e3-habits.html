<!doctype html><html><head><meta charset="utf-8"><title>Habits</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f5f5f4;font-family:Helvetica,Arial,sans-serif;color:#1c1917;overflow:hidden}
.side{position:absolute;left:0;top:0;width:220px;height:900px;background:#1c1917;color:#e7e5e4;padding:36px 28px;font-size:16px}
.side b{display:block;font-size:22px;color:#fff;margin-bottom:40px}.side div{margin-top:20px}.side .on{color:#a3e635;font-weight:700}
.main{position:absolute;left:280px;top:48px;width:940px}
h1{font-size:34px;font-weight:800}
.days{display:flex;margin:36px 0 0 260px}.days span{width:80px;text-align:center;color:#78716c;font-size:14px;font-weight:700}
.row{display:flex;align-items:center;background:#fff;border-radius:14px;margin-top:16px;height:84px;padding:0 24px}
.row b{width:236px;font-size:18px}
.row i{width:44px;height:44px;border-radius:50%;margin:0 18px;border:3px solid #d6d3d1}
.row i.y{background:#65a30d;border-color:#65a30d}
</style></head><body>
<div class="side" data-r="sidebar" data-must><b>Streaks</b><div class="on">This week</div><div>History</div><div>Settings</div></div>
<div class="main"><h1 data-r="title" data-must>This week</h1>
<div class="days" data-r="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
<div data-r="habits" data-must>
<div class="row"><b>Read 20 pages</b><i class="y"></i><i class="y"></i><i class="y"></i><i></i><i class="y"></i><i></i><i></i></div>
<div class="row"><b>Walk 8k steps</b><i class="y"></i><i></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i></i></div>
<div class="row"><b>No phone in bed</b><i></i><i></i><i class="y"></i><i></i><i></i><i class="y"></i><i></i></div>
<div class="row"><b>Drink water</b><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i class="y"></i><i></i></div>
<div class="row"><b>Stretch</b><i class="y"></i><i></i><i></i><i></i><i class="y"></i><i></i><i></i></div>
</div></div>
</body></html>
