<!doctype html><html><head><meta charset="utf-8"><title>Departures</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#0f172a;font-family:Helvetica,Arial,sans-serif;color:#e2e8f0;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:36px 60px 0}
h1{font-size:44px;font-weight:800;color:#facc15}.clock{font-size:36px;font-weight:700}
table{margin:40px 60px 0;width:1160px;border-collapse:collapse;font-size:22px}

.p{display:inline-block;font-size:15px;font-weight:700;padding:6px 14px;border-radius:20px}
.ok{background:#166534;color:#bbf7d0}.late{background:#92400e;color:#fde68a}.bd{background:#1d4ed8;color:#dbeafe}.cx{background:#991b1b;color:#fecaca}
</style></head><body>

<tr><td>14:55</td><td>Oslo</td><td>SK 806</td><td>A4</td><td><span class="p ok">On time</span></td></tr>

<tr><td>15:25</td><td>Dublin</td><td>EI 155</td><td>B3</td><td><span class="p ok">On time</span></td></tr>
<tr><td>15:40</td><td>Zurich</td><td>LX 345</td><td>A9</td><td><span class="p cx">Cancelled</span></td></tr>
<tr><td>16:05</td><td>Prague</td><td>OK 621</td><td>C2</td><td><span class="p ok">On time</span></td></tr>

</body></html>
