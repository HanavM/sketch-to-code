<!doctype html><html><head><meta charset="utf-8"><title>Planet tour</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#0b1026;font-family:Helvetica,Arial,sans-serif;color:#fff;overflow:hidden;position:relative}
.planet{position:absolute;left:640px;top:360px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fdba74,#ea580c 55%,#7c2d12)}
.ring{position:absolute;left:520px;top:640px;width:1060px;height:220px;border-radius:50%;border:6px solid #fcd34d;transform:rotate(-14deg)}
nav{position:absolute;top:44px;left:80px;font-size:18px;font-weight:700;letter-spacing:4px}
h1{position:absolute;left:80px;top:190px;width:600px;font-size:78px;line-height:1.05;font-weight:800}
p{position:absolute;left:84px;top:470px;width:460px;font-size:20px;color:#a5b4fc;line-height:1.5}
.b1{position:absolute;left:84px;top:600px;background:#fff;color:#0b1026;font-weight:700;font-size:18px;padding:16px 30px;border-radius:10px}
.b2{position:absolute;left:290px;top:600px;border:2px solid #fff;color:#fff;font-weight:700;font-size:18px;padding:14px 28px;border-radius:10px}
.dot{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%}
</style></head><body>
<div class="dot" style="left:300px;top:110px"></div><div class="dot" style="left:900px;top:80px"></div><div class="dot" style="left:1100px;top:220px"></div><div class="dot" style="left:560px;top:760px"></div><div class="dot" style="left:180px;top:820px"></div>
<div class="planet" data-r="planet" data-must></div>
<div class="ring" data-r="ring"></div>
<nav data-r="logo">ORBITAL</nav>
<h1 data-r="headline" data-must>Tour the outer planets</h1>
<p data-r="blurb">Twelve nights past Jupiter and Saturn, window seats for everyone.</p>
<span class="b1" data-r="cta" data-must>Reserve a seat</span><span class="b2" data-r="cta-2">See the route</span>
</body></html>
