<!doctype html><html><head><meta charset="utf-8"><title>Parking</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#eef1f5;font-family:Helvetica,Arial,sans-serif;color:#1c2430;overflow:hidden;position:relative}
header{height:72px;background:#1d4ed8;color:#fff;display:flex;align-items:center;padding:0 40px;font-size:20px;font-weight:800}
.card{position:absolute;left:390px;top:120px;width:500px;height:700px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:36px}
h2{font-size:28px;margin-bottom:8px}.zone{font-size:15px;color:#667085;margin-bottom:30px}
label{display:block;font-size:14px;font-weight:700;color:#475467;margin-bottom:8px}
.input{height:52px;border:1px solid #d0d5dd;border-radius:8px;display:flex;align-items:center;padding:0 16px;font-size:18px;letter-spacing:2px;margin-bottom:28px}
.chips{display:flex;gap:12px;margin-bottom:34px}.chip{flex:1;height:48px;border:1px solid #d0d5dd;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.chip.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.row{display:flex;justify-content:space-between;font-size:16px;color:#475467;padding:12px 0;border-top:1px solid #eaecf0}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:18px 0 28px;border-top:1px solid #eaecf0}
.pay{height:58px;background:#16a34a;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
</style></head><body>
<header data-r="header">ParkEasy</header>
<div class="card" data-r="card" data-must>
<h2 data-r="title">Pay for parking</h2><div class="zone" data-r="zone">Zone 4127 - High Street North</div>
<label>Number plate</label><div class="input" data-r="plate-input" data-must>KD71 RXP</div>
<label>How long?</label><div class="chips" data-r="duration-chips" data-must><div class="chip">30 min</div><div class="chip on">1 hour</div><div class="chip">2 hours</div><div class="chip">4 hours</div></div>
<div class="row" data-r="row-rate"><span>Rate</span><span>2.40 / hour</span></div><div class="row" data-r="row-fee"><span>Service fee</span><span>0.20</span></div>
<div class="total" data-r="total"><span>Total</span><span>2.60</span></div>
<div class="pay" data-r="pay-button" data-must>Pay 2.60</div>
</div>
</body></html>
