<!doctype html><html><head><meta charset="utf-8"><title>Tilted phone</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f1f0ff;font-family:Helvetica,Arial,sans-serif;color:#15123a}
@keyframes float{50%{transform:translateY(-14px)}}
.num{position:absolute;left:560px;top:40px;font:900 640px/0.8 "Arial Black",sans-serif;color:transparent;-webkit-text-stroke:3px #c9c4ff;letter-spacing:-30px}
.wave{position:absolute;left:0;top:700px;width:1280px;height:200px}
.stage{position:absolute;left:660px;top:90px;width:520px;height:720px;perspective:1400px}
.phone{position:absolute;left:110px;top:20px;width:320px;height:660px;border-radius:48px;background:#15123a;padding:14px;transform:rotateY(-24deg) rotateX(8deg) rotateZ(4deg);box-shadow:-40px 50px 80px rgba(21,18,58,.35)}
.scr{width:100%;height:100%;border-radius:36px;background:linear-gradient(180deg,#6c4cff,#2b1a9a);padding:44px 20px;color:#fff}
.scr small{opacity:.7}.scr b{display:block;font-size:40px;margin:6px 0 24px}.row{height:54px;border-radius:14px;background:rgba(255,255,255,.14);margin-bottom:12px}
.chip{position:absolute;padding:14px 20px;border-radius:16px;background:#fff;box-shadow:0 18px 40px rgba(21,18,58,.18);font-weight:700;animation:float 5s ease-in-out infinite}
.k1{left:600px;top:250px}.k2{left:1060px;top:180px;animation-delay:-2s}.k3{left:1020px;top:610px;animation-delay:-1s;background:#15123a;color:#fff}
.chip i{font-style:normal;color:#14b87a}
.h{position:absolute;left:60px;top:170px;width:560px;font:800 76px/1 Helvetica,sans-serif;letter-spacing:-3px}.h u{text-decoration:none;box-shadow:inset 0 -22px 0 #ffd84a}
.sub{position:absolute;left:60px;top:440px;width:470px;font-size:19px;line-height:1.55;color:#4a4675}
.st{position:absolute;left:60px;top:570px;display:flex;gap:14px}.st span{padding:16px 26px;border-radius:14px;background:#15123a;color:#fff;font-weight:700}.st span+span{background:transparent;color:#15123a;border:2px solid #15123a}
.rate{position:absolute;left:60px;top:660px;font-size:15px;color:#4a4675}.rate b{color:#ffb800;letter-spacing:2px}
</style></head><body>
<div class="num" data-r="outline-number">3</div>
<svg class="wave" viewBox="0 0 1280 200" preserveAspectRatio="none" data-r="wave"><path d="M0,80 C220,10 420,150 640,80 C860,10 1060,150 1280,80 L1280,200 L0,200 Z" fill="#6c4cff"/></svg>
<div class="h" data-r="headline" data-must>Split bills in <u>three taps.</u></div>
<div class="sub" data-r="sub">Snap the receipt, tag your friends, done. Tabby settles up while you're still arguing about the tip.</div>
<div class="st" data-r="store-buttons"><span>App Store</span><span>Google Play</span></div><div class="rate" data-r="rating"><b>★★★★★</b> 4.9 from 18k reviews</div>
<div class="stage" data-r="phone" data-must><div class="phone"><div class="scr"><small>Dinner at Lupa</small><b>£24.50 each</b><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div></div></div></div>
<div class="chip k1" data-r="chip-paid"><i>✓</i> Sam paid £24.50</div><div class="chip k2" data-r="chip-split">4 ways</div><div class="chip k3" data-r="chip-settled">All settled 🎉</div>
</body></html>
