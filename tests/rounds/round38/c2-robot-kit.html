<!doctype html><html><head><meta charset="utf-8"><title>Robot kit</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#1d4ed8;font-family:Helvetica,Arial,sans-serif;color:#fff;overflow:hidden;position:relative}
nav{position:absolute;left:0;top:0;width:1280px;display:flex;justify-content:space-between;align-items:center;padding:30px 60px;font-size:15px;font-weight:700}
.logo{font-size:24px;font-weight:900}.buy{background:#facc15;color:#111;padding:12px 24px;border-radius:8px}
.box{position:absolute;left:700px;top:180px;width:420px;height:420px;background:#facc15;border-radius:24px;transform:rotate(8deg);box-shadow:24px 24px 0 #0f2a7a}
.eye{position:absolute;top:120px;width:90px;height:90px;border-radius:50%;background:#111}
.mouth{position:absolute;left:110px;top:270px;width:200px;height:24px;border-radius:12px;background:#111}
h1{position:absolute;left:60px;top:180px;width:600px;font-size:96px;line-height:.92;font-weight:900;text-transform:uppercase;letter-spacing:-3px}
p{position:absolute;left:64px;top:560px;width:440px;font-size:20px;line-height:1.5;color:#c7d6ff}
.cta{position:absolute;left:64px;top:670px;width:240px;height:64px;background:#facc15;color:#111;border-radius:10px;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.price{position:absolute;left:330px;top:686px;font-size:28px;font-weight:900}
.ages{position:absolute;left:1000px;top:690px;width:140px;height:140px;border-radius:50%;background:#ef4444;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;text-align:center;transform:rotate(-10deg)}
</style></head><body>
<nav data-r="nav"><div class="logo" data-r="logo">BOLT</div><div class="buy" data-r="nav-cta">Buy now</div></nav>
<div class="box" data-r="robot" data-must><div class="eye" style="left:90px"></div><div class="eye" style="left:240px"></div><div class="mouth"></div></div>
<h1 data-r="headline" data-must>Build your first robot</h1>
<p data-r="subhead">Snap-together parts, no soldering, ready to roll in one afternoon.</p>
<div class="cta" data-r="cta" data-must>Get the kit</div><div class="price" data-r="price">$89</div>
<div class="ages" data-r="badge" data-must>AGES<br>8+</div>
</body></html>
