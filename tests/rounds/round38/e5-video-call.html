<!doctype html><html><head><meta charset="utf-8"><title>Video call</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#18181b;font-family:Helvetica,Arial,sans-serif;color:#fafafa;overflow:hidden;position:relative}
.top{position:absolute;left:32px;top:24px;font-size:17px;font-weight:700}.top span{color:#a1a1aa;font-weight:400;margin-left:14px}
.rec{position:absolute;left:880px;top:22px;padding:6px 14px;border-radius:14px;background:#7f1d1d;color:#fecaca;font-size:13px;font-weight:700}
.t{position:absolute;width:420px;height:340px;border-radius:16px;background:#3f3f46;display:flex;align-items:center;justify-content:center}
.t .av{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#18181b}
.t span{position:absolute;left:16px;bottom:14px;padding:5px 12px;border-radius:8px;background:rgba(0,0,0,.5);font-size:14px}
.t.talk{outline:4px solid #22c55e}
.chat{position:absolute;left:940px;top:72px;width:316px;height:700px;background:#27272a;border-radius:16px;padding:22px;font-size:14px}
.chat b{font-size:16px}.m{margin-top:18px;line-height:1.4}.m em{font-style:normal;font-weight:700;display:block;color:#a1a1aa;font-size:13px}
.box{position:absolute;left:22px;bottom:22px;width:272px;height:44px;border-radius:10px;background:#3f3f46;color:#a1a1aa;display:flex;align-items:center;padding:0 14px}
.bar{position:absolute;left:0;top:800px;width:1280px;height:100px;display:flex;align-items:center;justify-content:center;gap:18px}
.c{width:56px;height:56px;border-radius:50%;background:#3f3f46}.c.end{width:120px;border-radius:28px;background:#dc2626;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
</style></head><body>
<div class="top" data-r="title">Design review<span>32:14</span></div><div class="rec" data-r="rec">● REC</div>
<div class="t talk" data-r="tile" data-must style="left:32px;top:72px"><div class="av" style="background:#fda4af">MA</div><span>Maya</span></div>
<div class="t" style="left:484px;top:72px"><div class="av" style="background:#93c5fd">JT</div><span>Jonas</span></div>
<div class="t" style="left:32px;top:432px"><div class="av" style="background:#fde047">RK</div><span>Riya</span></div>
<div class="t" style="left:484px;top:432px"><div class="av" style="background:#86efac">You</div><span>You</span></div>
<div class="chat" data-r="chat" data-must><b>Chat</b><div class="m"><em>Jonas</em>Can you share the new flows?</div><div class="m"><em>Riya</em>Love the bigger buttons.</div><div class="m"><em>Maya</em>Sharing in a sec.</div><div class="box">Message everyone</div></div>
<div class="bar" data-r="controls" data-must><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c end">Leave</div></div>
</body></html>
