<!doctype html><html><head><meta charset="utf-8"><title>Bento launch</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#09090b;font-family:Helvetica,Arial,sans-serif;color:#fafafa}
.t{position:absolute;border-radius:28px;padding:28px;overflow:hidden}
.hero{left:40px;top:40px;width:720px;height:440px;background:radial-gradient(circle at 20% 20%,#6366f1,transparent 55%),radial-gradient(circle at 90% 80%,#ec4899,transparent 50%),#18181b}
.hero h1{font-size:76px;line-height:.95;letter-spacing:-3px;margin-top:150px;font-weight:800}.hero p{font-size:18px;color:#d4d4d8;margin-top:16px}
.stat{left:780px;top:40px;width:460px;height:210px;background:#fafafa;color:#09090b}.stat b{font-size:96px;letter-spacing:-4px;line-height:1}.stat span{display:block;font-size:16px;color:#52525b;margin-top:8px}
.ring{left:780px;top:270px;width:220px;height:210px;background:#18181b;display:flex;align-items:center;justify-content:center}
.ring i{width:140px;height:140px;border-radius:50%;background:conic-gradient(#22c55e 0 72%,#27272a 72% 100%);display:flex;align-items:center;justify-content:center}.ring i:after{content:'72%';width:104px;height:104px;border-radius:50%;background:#18181b;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:700}
.quote{left:1020px;top:270px;width:220px;height:210px;background:#facc15;color:#09090b;font-size:20px;font-weight:700;line-height:1.25}
.chart{left:40px;top:500px;width:470px;height:360px;background:#18181b}.chart h3{font-size:18px}.bars{position:absolute;left:28px;right:28px;bottom:28px;height:220px;display:flex;align-items:flex-end;gap:14px}.bars i{flex:1;background:#6366f1;border-radius:8px 8px 0 0}
.code{left:530px;top:500px;width:420px;height:360px;background:#27272a;font-family:Menlo,monospace;font-size:15px;line-height:1.7;color:#a1a1aa}.code b{color:#f472b6;font-weight:400}.code em{color:#4ade80;font-style:normal}
.cta{left:970px;top:500px;width:270px;height:360px;background:linear-gradient(180deg,#6366f1,#4338ca);display:flex;flex-direction:column;justify-content:flex-end}.cta h3{font-size:30px;line-height:1.1}.cta a{display:block;margin-top:18px;padding:14px;border-radius:14px;background:#fafafa;color:#09090b;text-align:center;font-weight:700}
</style></head><body>
<div class="t hero" data-r="hero" data-must><h1>Prism 2</h1><p>Every tool you sketch with, now twice as fast.</p></div>
<div class="t stat" data-r="stat" data-must><b>2.4×</b><span>faster first paint than Prism 1</span></div>
<div class="t ring" data-r="ring"><i></i></div>
<div class="t quote" data-r="quote">“It feels like the page is reading my mind.”</div>
<div class="t chart" data-r="chart" data-must><h3>Weekly builds</h3><div class="bars"><i style="height:30%"></i><i style="height:45%"></i><i style="height:40%"></i><i style="height:62%"></i><i style="height:70%"></i><i style="height:88%"></i><i style="height:100%"></i></div></div>
<div class="t code" data-r="code"><b>import</b> { sketch } <b>from</b> 'prism'<br><br>sketch(<em>'hero'</em>)<br>&nbsp;&nbsp;.fill(<em>'glow'</em>)<br>&nbsp;&nbsp;.ship()</div>
<div class="t cta" data-r="cta" data-must><h3>Ready when you are.</h3><a>Get Prism 2</a></div>
</body></html>
