<!doctype html><html><head><meta charset="utf-8"><title>Data grid</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#202124;font-size:13px}
.menu{position:absolute;left:0;top:0;width:1280px;height:52px;background:#f1f3f4;display:flex;align-items:center;gap:20px;padding:0 20px;font-size:14px}.menu b{font-size:17px;color:#188038}
.fx{position:absolute;left:0;top:52px;width:1280px;height:34px;border-bottom:1px solid #dadce0;display:flex;align-items:center;font-size:13px}.fx span{width:70px;border-right:1px solid #dadce0;padding-left:10px;line-height:34px}.fx em{padding-left:12px;font-style:normal;color:#5f6368}
.sheet{position:absolute;left:0;top:86px;width:1280px;height:770px;display:grid;grid-template-columns:46px repeat(8,154px);grid-auto-rows:30px}
.sheet div{border-right:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0;padding:7px 8px;white-space:nowrap;overflow:hidden}
.sheet .hd{background:#f8f9fa;color:#5f6368;text-align:center}.sheet .b{font-weight:700;background:#e8f0fe}
.sheet .sel{outline:2px solid #1a73e8;outline-offset:-2px;background:#fff}
.tabs{position:absolute;left:0;bottom:0;width:1280px;height:44px;background:#f1f3f4;border-top:1px solid #dadce0;display:flex;gap:4px;padding:6px 50px;font-size:13px}.tabs span{padding:7px 16px;border-radius:4px}.tabs .on{background:#fff;color:#188038;font-weight:700}
</style></head><body>
<div class="menu" data-r="menu"><b>Budget 2027</b><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Data</span></div>
<div class="fx" data-r="formula"><span>D4</span><em>=SUM(B4:C4)</em></div>

<div class="tabs" data-r="sheet-tabs"><span class="on">Q1</span><span>Q2</span><span>Q3</span><span>Q4</span><span>Summary</span></div>
<script>const s=document.getElementById('s');const L=' ABCDEFGH';const rows=[['Team','Jan','Feb','Total','Owner','Status','Notes','Q1 goal'],['Design','4,200','4,350','8,550','Priya','On track','',''],['Engineering','18,900','19,400','38,300','Tom','Over','hiring','40,000'],['Marketing','6,100','5,800','11,900','Ana','On track','',''],['Sales','9,750','10,200','19,950','Raj','Under','','22,000'],['Support','3,300','3,300','6,600','Mei','On track','','']];
for(let r=0;r<25;r++)for(let c=0;c<9;c++){const d=document.createElement('div');if(r===0)d.className='hd',d.textContent=L[c];else if(c===0)d.className='hd',d.textContent=r;else{const v=rows[r-1]?.[c-1]??'';d.textContent=v;if(r===1)d.className='b';if(r===4&&c===4)d.className='sel'}s.appendChild(d)}</script>
</body></html>
