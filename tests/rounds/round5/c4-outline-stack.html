<!doctype html><html><head><meta charset="utf-8"><title>Outline stack</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#fff7ed;font-family:Helvetica,Arial,sans-serif;color:#431407}
.ghost{position:absolute;left:-30px;top:60px;font-size:330px;font-weight:900;line-height:.85;letter-spacing:-14px;color:transparent;-webkit-text-stroke:2px #fdba74;white-space:nowrap}
.ghost2{top:340px}
.img1{position:absolute;left:520px;top:160px;width:380px;height:500px;background:linear-gradient(200deg,#fb923c,#9a3412);filter:contrast(1.1);transform:rotate(3deg);box-shadow:24px 24px 0 #431407}
.img2{position:absolute;left:820px;top:420px;width:300px;height:360px;background:linear-gradient(20deg,#1e3a8a,#60a5fa);mix-blend-mode:multiply;transform:rotate(-4deg)}
.grain{position:absolute;inset:0;background:repeating-radial-gradient(circle at 0 0,rgba(67,20,7,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.pill{position:absolute;padding:12px 22px;border-radius:999px;font-size:16px;font-weight:700;border:2px solid #431407;background:#fff7ed}
.p1{left:430px;top:120px;transform:rotate(-8deg)}.p2{left:1010px;top:300px;transform:rotate(10deg);background:#431407;color:#fff7ed}.p3{left:480px;top:690px;transform:rotate(4deg);background:#facc15}
.copy{position:absolute;left:60px;top:640px;width:340px;font-size:17px;line-height:1.5}
.logo{position:absolute;left:60px;top:40px;font-size:20px;font-weight:900;letter-spacing:2px}
.buy{position:absolute;left:60px;top:790px;font-size:16px;font-weight:700;border-bottom:3px solid #431407;padding-bottom:4px}
</style></head><body>
<div class="ghost" data-r="ghost-top" data-must>SUMMER</div>
<div class="ghost ghost2" data-r="ghost-bottom">SUMMER</div>
<div class="img1" data-r="photo-main" data-must></div>
<div class="img2" data-r="photo-blue" data-must></div>
<div class="grain"></div>
<span class="pill p1" data-r="pill-new">New season</span>
<span class="pill p2" data-r="pill-dark">Linen only</span>
<span class="pill p3" data-r="pill-yellow">Ships in 24h</span>
<div class="logo" data-r="logo">ORRA</div>
<p class="copy" data-r="copy">Loose shirts, wide trousers and nothing you need to iron. Made in Porto in small runs.</p>
<a class="buy" data-r="buy">Shop summer →</a>
</body></html>
