<!doctype html><html><head><meta charset="utf-8"><title>Home</title><style>*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;overflow:hidden;position:relative;font-family:Helvetica,Arial,sans-serif}.a{position:absolute}
body{background:#111827;color:#f9fafb}
.top{left:40px;top:34px;font-size:26px;font-weight:700}.tsub{left:40px;top:74px;font-size:15px;color:#9ca3af}
.dial{left:150px;top:180px;width:520px;height:520px;border-radius:50%;border:34px solid #374151;border-top-color:#f97316;border-right-color:#f97316}
.temp{left:150px;top:360px;width:520px;text-align:center;font-size:120px;font-weight:200}
.tl{left:150px;top:510px;width:520px;text-align:center;font-size:18px;color:#9ca3af}
.minus{left:250px;top:760px;width:80px;height:80px;border-radius:50%;background:#1f2937;font-size:40px;display:flex;align-items:center;justify-content:center}
.plus{left:490px;top:760px;width:80px;height:80px;border-radius:50%;background:#f97316;font-size:40px;display:flex;align-items:center;justify-content:center}
.rooms{left:800px;top:180px;width:420px;height:520px;background:#1f2937;border-radius:20px;padding:30px}
.rooms h2{font-size:20px;margin-bottom:10px}
.rm{display:flex;align-items:center;height:84px;border-bottom:1px solid #374151;font-size:17px}.rm span{margin-left:12px;color:#9ca3af}.tg{margin-left:auto;width:56px;height:30px;border-radius:15px;background:#4b5563;position:relative}.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff}.tg.on{background:#f97316}.tg.on i{left:29px}
</style></head><body>

<div class="rm">Kitchen<span>20°</span><div class="tg on"><i></i></div></div>
<div class="rm">Office<span>19°</span><div class="tg"><i></i></div></div>

</body></html>
