<!doctype html><html><head><meta charset="utf-8"><title>Deco cinema</title><style>

.show b{display:block;font:400 26px Georgia;color:#f2d58a}.show small{display:block;margin-top:8px;font:14px Georgia;letter-spacing:2px}.show span{display:inline-block;margin-top:14px;padding:6px 12px;border:1px solid #c9a24a;font-size:13px;letter-spacing:2px}
