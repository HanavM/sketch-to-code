<!doctype html><html><head><meta charset="utf-8"><title>Bento overlap</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#0b0b0f;font-family:Helvetica,Arial,sans-serif;color:#fff}
.t{position:absolute;border-radius:28px;overflow:hidden;padding:28px}
.a{left:40px;top:40px;width:560px;height:420px;background:linear-gradient(135deg,#7c3aed,#db2777)}
.a h1{font-size:84px;line-height:.95;letter-spacing:-3px;font-weight:900;margin-top:120px}
.b{left:620px;top:40px;width:300px;height:200px;background:#facc15;color:#111}.b b{display:block;font-size:64px;letter-spacing:-2px}
.c{left:940px;top:40px;width:300px;height:420px;background:#18181b;border:1px solid #3f3f46}
.c i{display:block;height:10px;border-radius:5px;background:#3f3f46;margin:14px 0}.c i.on{background:#22d3ee;width:70%}
.d{left:620px;top:260px;width:300px;height:200px;background:#e4e4e7;color:#111}
.e{left:40px;top:480px;width:380px;height:380px;background:#22d3ee;color:#0b0b0f}.e p{font-size:22px;font-weight:700;width:240px}
.f{left:440px;top:480px;width:800px;height:380px;background:#18181b;border:1px solid #3f3f46}
.f .bars{position:absolute;left:28px;right:28px;bottom:28px;height:220px;display:flex;align-items:flex-end;gap:10px}.f .bars span{flex:1;border-radius:6px;background:#3f3f46}.f .bars span.hi{background:#facc15}
.orb{position:absolute;left:470px;top:330px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#f472b6 30%,#7c3aed 75%);box-shadow:0 30px 80px rgba(219,39,119,.6)}
.big{position:absolute;left:1000px;top:600px;font-size:260px;font-weight:900;letter-spacing:-12px;line-height:1;color:transparent;-webkit-text-stroke:3px #facc15}
.lab{font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:.8}
</style></head><body>
<div class="t a" data-r="hero-tile" data-must><div class="lab">Orbit OS · 2027</div><h1>Everything,<br>tiled.</h1></div>
<div class="t b" data-r="stat-tile"><div class="lab">uptime</div><b>99.9</b></div>
<div class="t c" data-r="list-tile"><div class="lab">Sync</div><i class="on"></i><i></i><i style="width:80%"></i><i></i><i style="width:55%"></i><i></i></div>
<div class="t d" data-r="quote-tile"><p style="font-size:20px;line-height:1.3;font-family:Georgia,serif;font-style:italic">“The calmest dashboard I’ve ever used.”</p></div>
<div class="t e" data-r="cyan-tile"><div class="lab">New</div><p style="margin-top:200px">Widgets that rearrange themselves.</p></div>
<div class="t f" data-r="chart-tile"><div class="lab">Weekly focus</div><div class="bars"><span style="height:40%"></span><span style="height:65%"></span><span style="height:50%"></span><span class="hi" style="height:95%"></span><span style="height:70%"></span><span style="height:45%"></span><span style="height:60%"></span><span style="height:80%"></span><span style="height:35%"></span><span style="height:55%"></span></div></div>
<div class="orb" data-r="orb" data-must></div>
<div class="big" data-r="big-number" data-must>07</div>
</body></html>
