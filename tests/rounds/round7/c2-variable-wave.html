<!doctype html><html><head><meta charset="utf-8"><title>Variable wave</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f5f0e6;font-family:Helvetica,Arial,sans-serif;color:#1a1a1a}
.wave{position:absolute;left:60px;top:150px;display:flex;align-items:flex-end;line-height:.8;letter-spacing:-4px}
.wave span{display:inline-block}
.out{position:absolute;left:60px;top:370px;font-size:170px;font-weight:900;letter-spacing:-6px;line-height:1;color:transparent;-webkit-text-stroke:2px #1a1a1a;white-space:nowrap}
.band{position:absolute;left:-100px;top:600px;width:1500px;height:86px;background:#ff4f1f;color:#f5f0e6;transform:rotate(-6deg);font-size:44px;font-weight:900;line-height:86px;white-space:nowrap;letter-spacing:2px}
.nav{position:absolute;left:60px;top:44px;right:60px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:1px}
.nav b{font-size:18px}
.axis{position:absolute;left:60px;top:780px;width:520px;height:2px;background:#1a1a1a}
.knob{position:absolute;left:330px;top:770px;width:22px;height:22px;border-radius:50%;background:#1a1a1a}
.ax{position:absolute;left:60px;top:806px;font-size:13px;letter-spacing:2px}
.note{position:absolute;left:820px;top:770px;width:400px;font-size:17px;line-height:1.5}
</style></head><body>
<div class="nav" data-r="nav"><b>FLEX/TYPE</b><span>Specimen · Axes · Buy</span></div>
<div class="wave" data-r="wave-word" data-must><span style="font-size:120px;font-weight:100">V</span><span style="font-size:150px;font-weight:300">A</span><span style="font-size:180px;font-weight:500">R</span><span style="font-size:200px;font-weight:700">I</span><span style="font-size:220px;font-weight:900">A</span><span style="font-size:200px;font-weight:700">B</span><span style="font-size:180px;font-weight:500">L</span><span style="font-size:150px;font-weight:300">E</span></div>
<div class="out" data-r="outline-line" data-must>100—900</div>
<div class="band" data-r="band" data-must>ONE FILE · EVERY WEIGHT · ONE FILE · EVERY WEIGHT · ONE FILE</div>
<div class="axis" data-r="axis"></div><div class="knob" data-r="knob"></div>
<div class="ax" data-r="axis-label">WEIGHT 100 ——— 900</div>
<p class="note" data-r="note">A variable family with weight and width axes. Drag the slider, the specimen breathes.</p>
</body></html>
