<!doctype html><html><head><meta charset="utf-8"><title>Contour poster</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#11140f;font-family:Helvetica,Arial,sans-serif;color:#e9f0d8}
.topo{position:absolute;left:420px;top:60px;width:800px;height:780px;background:repeating-radial-gradient(ellipse at 60% 45%,transparent 0 22px,#9fd356 22px 24px);opacity:.75;border-radius:8px}
.peak{position:absolute;left:830px;top:380px;width:16px;height:16px;background:#ff5d3a;transform:rotate(45deg)}
.vt{position:absolute;left:60px;top:60px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:120px;font-weight:900;line-height:1;letter-spacing:-2px}
.grid{position:absolute;left:220px;top:60px;width:180px;font-family:monospace;font-size:13px;line-height:1.9}
.grid b{display:block;font-size:44px;font-family:Helvetica,Arial,sans-serif;color:#9fd356;line-height:1.1;margin-top:18px}
.lbl{position:absolute;left:860px;top:360px;padding:6px 10px;background:#ff5d3a;color:#11140f;font-weight:800;font-size:14px}
.bars{position:absolute;left:220px;top:640px;display:flex;align-items:flex-end;gap:6px;height:120px}
.bars i{width:16px;background:#9fd356}
.code{position:absolute;left:220px;top:790px;width:180px;height:44px;background:repeating-linear-gradient(90deg,#e9f0d8 0 2px,transparent 2px 5px,#e9f0d8 5px 9px,transparent 9px 12px)}
.ttl{position:absolute;left:460px;top:760px;font-family:Georgia,serif;font-style:italic;font-size:42px}
</style></head><body>
<div class="vt" data-r="vertical-title" data-must>HIGH ROUTE</div>
<div class="grid" data-r="stats-column"><div>STAGE 04 / 07</div><b>2,962 m</b><div>max elevation</div><b>41 km</b><div>distance</div><b>+1,880</b><div>climb</div></div>
<div class="topo" data-r="contour-map" data-must></div>
<div class="peak" data-r="peak-marker"></div>
<div class="lbl" data-r="peak-label">PASSO GAVIA</div>
<div class="bars" data-r="elevation-bars"><i style="height:20px"></i><i style="height:34px"></i><i style="height:52px"></i><i style="height:48px"></i><i style="height:70px"></i><i style="height:92px"></i><i style="height:120px"></i><i style="height:96px"></i><i style="height:64px"></i><i style="height:40px"></i></div>
<div class="code" data-r="barcode"></div>
<p class="ttl" data-r="headline" data-must>Climb the long way round.</p>
</body></html>
