<!doctype html><html><head><meta charset="utf-8"><title>Text rings</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#0d1b2a;font-family:Helvetica,Arial,sans-serif;color:#f6efe1}

.idx b{color:#ff6b3d;margin-right:10px;font-family:monospace}
.date{position:absolute;left:60px;top:780px;font-family:monospace;font-size:15px}
.btn{position:absolute;left:1000px;top:120px;width:120px;height:120px;border-radius:50%;background:#ffd23f;color:#0d1b2a;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;transform:rotate(-14deg)}
