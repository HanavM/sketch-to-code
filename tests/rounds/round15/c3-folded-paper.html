<!doctype html><html><head><meta charset="utf-8"><title>Folded paper</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#2b2622;font-family:Helvetica,Arial,sans-serif;color:#2b2622}
.fold{position:absolute;left:140px;top:230px;width:1000px;height:440px;display:flex;perspective:1400px}
.p{flex:1;height:440px;background:#efe6d6;position:relative;overflow:hidden}
.p:nth-child(odd){transform:rotateY(18deg);background:linear-gradient(90deg,#f7f0e3,#d9cdb8)}
.p:nth-child(even){transform:rotateY(-18deg);background:linear-gradient(90deg,#c9bca5,#efe6d6)}
.p span{position:absolute;top:110px;font-size:230px;font-weight:900;line-height:1;color:#c43d2b}
.p:nth-child(1) span{left:20px}.p:nth-child(2) span{left:-180px}.p:nth-child(3) span{left:-380px}.p:nth-child(4) span{left:-580px}.p:nth-child(5) span{left:-780px}
.word{white-space:nowrap}
nav{position:absolute;left:60px;top:40px;width:1160px;display:flex;justify-content:space-between;font-size:14px;color:#efe6d6}
.k{position:absolute;left:140px;top:150px;color:#efe6d6;font-family:Georgia,serif;font-size:34px;font-style:italic}
.meta{position:absolute;left:140px;top:720px;width:1000px;display:flex;justify-content:space-between;color:#efe6d6;font-size:15px;border-top:1px solid #6d635a;padding-top:14px}
.btn{position:absolute;left:140px;top:800px;padding:14px 26px;border:2px solid #efe6d6;color:#efe6d6;font-weight:700;border-radius:999px}
.sw{position:absolute;left:980px;top:800px;display:flex;gap:10px}.sw i{width:34px;height:34px;border-radius:50%;border:2px solid #efe6d6}
</style></head><body>
<nav data-r="nav"><b>FOLIO PAPER CO.</b><span>Stock · Samples · Mills · Cart (2)</span></nav>
<p class="k" data-r="kicker">Five folds, one sheet, no glue.</p>
<div class="fold" data-r="folded-sheet" data-must><div class="p"><span class="word">CREASE</span></div><div class="p"><span class="word">CREASE</span></div><div class="p"><span class="word">CREASE</span></div><div class="p"><span class="word">CREASE</span></div><div class="p"><span class="word">CREASE</span></div></div>
<div class="meta" data-r="spec-row"><span>320 gsm cotton</span><span>Deckled edge</span><span>Made in Fabriano</span><span>From £4.20 a sheet</span></div>
<a class="btn" data-r="cta">Order a sample pack</a>
<div class="sw" data-r="swatches"><i style="background:#efe6d6"></i><i style="background:#c43d2b"></i><i style="background:#3f5e4a"></i><i style="background:#1f2f4f"></i></div>
</body></html>
