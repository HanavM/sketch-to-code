<!doctype html><html><head><meta charset="utf-8"><title>Topo knockout</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#0c1a14;font-family:Helvetica,Arial,sans-serif;color:#ecfccb}
.topo{position:absolute;left:0;top:0;width:1280px;height:900px}
