<!doctype html><html><head><meta charset="utf-8"><title>Masonry stickers</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#fff7ed;font-family:Helvetica,Arial,sans-serif;color:#1c1917}
.m{position:absolute;border-radius:18px;overflow:hidden}
.m1{left:40px;top:150px;width:280px;height:360px;background:radial-gradient(circle at 30% 30%,#fda4af,transparent 60%),radial-gradient(circle at 80% 80%,#fb923c,transparent 55%),#fde68a}
.m2{left:340px;top:150px;width:280px;height:220px;background:#1c1917;color:#fff7ed;padding:24px;font-size:30px;font-weight:800;line-height:1.05}
.m3{left:640px;top:150px;width:280px;height:420px;background:linear-gradient(180deg,#38bdf8,#1d4ed8)}
.m4{left:940px;top:150px;width:300px;height:260px;background:#bef264}
.m5{left:340px;top:390px;width:280px;height:340px;background:radial-gradient(circle at 70% 20%,#c4b5fd,transparent 60%),#7c3aed}
.m6{left:40px;top:530px;width:280px;height:330px;background:#fecaca;padding:24px;font-family:Georgia,serif;font-size:24px;font-style:italic;line-height:1.3}
.m7{left:640px;top:590px;width:280px;height:270px;background:#fde047}
.m8{left:940px;top:430px;width:300px;height:430px;background:linear-gradient(200deg,#f472b6,#9d174d)}
.st{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:18px;line-height:1.05;box-shadow:4px 4px 0 #1c1917;border:3px solid #1c1917}
h1{position:absolute;left:40px;top:40px;font-size:72px;letter-spacing:-3px;font-weight:900;line-height:1}
.nav{position:absolute;left:880px;top:62px;font-size:15px;font-weight:700}
</style></head><body>
<h1 data-r="headline" data-must>Pin it all.</h1><div class="nav" data-r="nav">Boards · Explore · Join</div>
<div class="m m1" data-r="tile-mesh" data-must></div>
<div class="m m2" data-r="tile-text">2.4M boards made this year</div>
<div class="m m3" data-r="tile-blue"></div>
<div class="m m4" data-r="tile-lime"></div>
<div class="m m5" data-r="tile-violet"></div>
<div class="m m6" data-r="tile-quote">“My moodboard finally looks like my mood.”</div>
<div class="m m7" data-r="tile-yellow"></div>
<div class="m m8" data-r="tile-pink"></div>
<div class="st" data-r="sticker-new" data-must style="left:560px;top:320px;width:130px;height:130px;background:#fde047;transform:rotate(-12deg)">NEW<br>BOARDS</div>
<div class="st" data-r="sticker-free" style="left:880px;top:520px;width:110px;height:110px;background:#fff;transform:rotate(10deg)">100%<br>FREE</div>
</body></html>
