<!doctype html><html><head><meta charset="utf-8"><title>Solar wheel</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f3ead8;font-family:Georgia,serif;color:#2b2118}
.w{position:absolute;left:520px;top:90px;width:720px;height:720px;border-radius:50%;background:repeating-conic-gradient(#e7d6b4 0 30deg,#f3ead8 30deg 60deg);border:2px solid #2b2118}
.w2{position:absolute;left:640px;top:210px;width:480px;height:480px;border-radius:50%;border:1px dashed #2b2118}
.sun{position:absolute;left:780px;top:350px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd36b,#e2761b);box-shadow:0 0 0 14px #f3ead8,0 0 0 16px #e2761b}
.m{position:absolute;left:880px;top:450px;width:0;height:0;font:700 14px Georgia;letter-spacing:4px}
.m span{position:absolute;left:-20px;top:-8px;width:40px;text-align:center;transform-origin:20px 8px}
.needle{position:absolute;left:878px;top:150px;width:4px;height:300px;background:#2b2118;transform:rotate(130deg);transform-origin:2px 300px;border-radius:2px}
.needle::after{content:"";position:absolute;left:-8px;top:-6px;width:20px;height:20px;background:#b33a2a;border-radius:50%}
.h{position:absolute;left:72px;top:170px;width:420px;font:400 76px/1 Georgia;letter-spacing:-1px}.h i{color:#e2761b}
.p{position:absolute;left:72px;top:420px;width:380px;font:400 18px/1.6 Georgia}
.moons{position:absolute;left:72px;top:600px;display:flex;gap:18px}.moons i{width:38px;height:38px;border-radius:50%;background:#2b2118;border:2px solid #2b2118}
.moons i:nth-child(1){box-shadow:inset 0 0 0 20px #f3ead8}.moons i:nth-child(2){box-shadow:inset 12px 0 0 0 #f3ead8}.moons i:nth-child(3){background:linear-gradient(90deg,#f3ead8 50%,#2b2118 50%)}.moons i:nth-child(4){box-shadow:inset -12px 0 0 0 #2b2118;background:#f3ead8}
.btn{position:absolute;left:72px;top:700px;padding:16px 30px;background:#2b2118;color:#f3ead8;font:700 15px Georgia;letter-spacing:3px;border-radius:2px}
.nav{position:absolute;left:72px;top:40px;right:72px;display:flex;gap:34px;font:400 15px Georgia;letter-spacing:2px;border-bottom:1px solid #2b2118;padding-bottom:16px}.nav b{margin-right:auto}
</style></head><body>
<div class="nav" data-r="nav"><b>ALMANAC</b><span>Calendar</span><span>Tides</span><span>Sky</span></div>
<div class="w" data-r="year-wheel" data-must></div><div class="w2" data-r="inner-ring"></div>
<div class="m" data-r="month-ring" data-must>
<span style="transform:rotate(0deg) translateY(-320px)">JAN</span><span style="transform:rotate(30deg) translateY(-320px)">FEB</span><span style="transform:rotate(60deg) translateY(-320px)">MAR</span><span style="transform:rotate(90deg) translateY(-320px)">APR</span><span style="transform:rotate(120deg) translateY(-320px)">MAY</span><span style="transform:rotate(150deg) translateY(-320px)">JUN</span><span style="transform:rotate(180deg) translateY(-320px)">JUL</span><span style="transform:rotate(210deg) translateY(-320px)">AUG</span><span style="transform:rotate(240deg) translateY(-320px)">SEP</span><span style="transform:rotate(270deg) translateY(-320px)">OCT</span><span style="transform:rotate(300deg) translateY(-320px)">NOV</span><span style="transform:rotate(330deg) translateY(-320px)">DEC</span></div>
<div class="needle" data-r="needle"></div>
<div class="sun" data-r="sun" data-must></div>
<h1 class="h" data-r="headline" data-must>The year,<br>in one <i>turn</i></h1>
<p class="p" data-r="lede">Sunrise, solstice and every full moon on a single dial. Printed on cotton paper, made to hang.</p>
<div class="moons" data-r="moon-phases"><i></i><i></i><i></i><i></i></div>
<div class="btn" data-r="order-button" data-must>ORDER THE 2027 DIAL</div>
</body></html>
