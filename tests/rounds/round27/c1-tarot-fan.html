<!doctype html><html><head><meta charset="utf-8"><title>Tarot fan</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#1a1033;font-family:Georgia,serif;color:#f3e6c4}
.sky{position:absolute;left:0;top:0;width:1280px;height:900px;background-image:radial-gradient(#f3e6c4 1px,#0000 1.6px),radial-gradient(circle at 70% 40%,#3b2470,#1a1033 70%);background-size:60px 60px,1280px 900px;background-position:12px 20px,0 0}

.stage{position:absolute;left:640px;top:170px;width:560px;height:520px;perspective:1200px}
.card{position:absolute;top:40px;width:220px;height:360px;border-radius:14px;background:linear-gradient(160deg,#2a1a55,#120a26);border:3px double #d9b56a;box-shadow:0 24px 40px #0008;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 10px;font:700 13px Georgia;letter-spacing:3px;color:#d9b56a}

.moon{width:100px;height:100px;border-radius:50%;box-shadow:inset -26px 4px 0 #e9d6a6}
.eye{width:120px;height:60px;border-radius:50%;border:2px solid #d9b56a;background:radial-gradient(circle,#d9b56a 0 12px,#0000 13px)}
.nav{position:absolute;left:70px;top:44px;width:1140px;display:flex;gap:34px;font:400 14px Georgia;letter-spacing:2px}.nav b{margin-right:auto;font-size:20px;letter-spacing:6px;color:#d9b56a}
.kick{position:absolute;left:70px;top:210px;font:italic 400 20px Georgia;color:#d9b56a}
.h{position:absolute;left:70px;top:250px;width:560px;font:400 84px/0.95 Georgia;letter-spacing:-2px}.h em{font-style:italic;color:#d9b56a}
.rule{position:absolute;left:70px;top:520px;width:300px;height:14px;background:linear-gradient(#d9b56a,#d9b56a) 0 6px/130px 1px no-repeat,linear-gradient(#d9b56a,#d9b56a) 170px 6px/130px 1px no-repeat,radial-gradient(circle,#d9b56a 0 5px,#0000 6px) 50% 50%/14px 14px no-repeat}
.p{position:absolute;left:70px;top:556px;width:430px;font:400 17px/1.6 Georgia;color:#c9b9e6}
.cta{position:absolute;left:70px;top:680px;padding:16px 34px;border:1px solid #d9b56a;border-radius:40px;font:700 14px Georgia;letter-spacing:3px;color:#1a1033;background:linear-gradient(90deg,#d9b56a,#ffe7a8,#d9b56a)}
.foot{position:absolute;left:70px;top:820px;width:1140px;display:flex;justify-content:space-between;font:400 12px "Courier New",monospace;letter-spacing:2px;color:#9c8cc4;border-top:1px solid #d9b56a44;padding-top:14px}
</style></head><body>
<div class="sky" data-r="star-sky"></div>
<div class="nav" data-r="nav"><b>ARCANA</b><span>Readings</span><span>Deck</span><span>Journal</span><span>Shop</span></div>
<div class="halo" data-r="halo-rings"></div>
<div class="stage" data-r="card-fan" data-must><div class="card l"><span>XVIII</span><div class="moon"></div><span>THE MOON</span></div><div class="card m"><span>XIX</span><div class="sun"></div><span>THE SUN</span></div><div class="card r"><span>XVII</span><div class="eye"></div><span>THE STAR</span></div></div>

<p class="p" data-r="copy">Seventy-eight cards, foil-edged, with a guide that skips the mystic fog and talks like a friend over tea.</p>

</body></html>
