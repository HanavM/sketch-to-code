.nav{position:absolute;left:70px;top:44px;width:1140px;display:flex;gap:30px;font:600 14px Helvetica;color:#b9c3dc}.nav b{margin-right:auto;color:#f5efe2;font:800 18px Helvetica;letter-spacing:2px}
