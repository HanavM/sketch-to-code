<!doctype html><html><head><meta charset="utf-8"><title>Perfume glass</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#f6e9e4 0,#ead2cc 62%,#d9b8b0 62%,#e8cfc8 100%);font-family:Helvetica,Arial,sans-serif;color:#3a2420}
.mist1{position:absolute;left:520px;top:140px;width:420px;height:420px;border-radius:50%;background:#ffffff;filter:blur(60px);opacity:.7}
.mist2{position:absolute;left:760px;top:330px;width:300px;height:300px;border-radius:50%;background:#f3a7b5;filter:blur(70px);opacity:.55}
.lines{position:absolute;left:0;top:0;width:1280px;height:558px;background:repeating-linear-gradient(90deg,#3a242014 0 1px,#0000 1px 160px)}
.cap{position:absolute;left:676px;top:150px;width:88px;height:96px;border-radius:10px 10px 4px 4px;background:linear-gradient(90deg,#8a5a3c,#e0b07e 40%,#8a5a3c)}
.neck{position:absolute;left:694px;top:246px;width:52px;height:24px;background:linear-gradient(90deg,#c9a07a,#f1d6b6,#c9a07a)}
.bottle{position:absolute;left:600px;top:268px;width:240px;height:290px;border-radius:26px;background:linear-gradient(100deg,#f7c6c0cc,#fdeae6aa 30%,#e89a9fcc 70%,#c97079dd);border:1px solid #ffffffaa;box-shadow:inset 18px 0 30px #ffffff88,inset -20px 0 30px #9e4b5466,0 30px 50px #7a3a3a33}
.shine{position:absolute;left:626px;top:290px;width:22px;height:240px;border-radius:11px;background:linear-gradient(#ffffffee,#ffffff00)}
.label{position:absolute;left:660px;top:380px;width:120px;height:70px;border:1px solid #3a2420;background:#fbf2ee;text-align:center;font:400 22px/1 Didot,Georgia,serif;letter-spacing:4px;padding-top:14px}.label small{display:block;font:700 8px Helvetica;letter-spacing:3px;margin-top:8px}
.refl{position:absolute;left:600px;top:560px;width:240px;height:180px;border-radius:26px;background:linear-gradient(180deg,#e89a9f66,#e89a9f00 80%);transform:scaleY(-1);transform-origin:top;opacity:.6}
.big{position:absolute;left:60px;top:150px;font:400 150px/0.9 Didot,Georgia,serif;letter-spacing:30px;color:#3a2420}
.big2{position:absolute;left:930px;top:300px;font:italic 400 150px/0.9 Didot,Georgia,serif;color:#b45563}
.nav{position:absolute;left:60px;top:40px;width:1160px;display:flex;gap:40px;font:400 12px Helvetica;letter-spacing:4px;text-transform:uppercase}.nav b{margin-right:auto;font:400 22px Didot,Georgia,serif;letter-spacing:10px}
.note{position:absolute;left:60px;top:620px;width:330px;font:400 15px/1.7 Georgia,serif}
.notes{position:absolute;left:960px;top:620px;width:260px;font:400 12px/2.2 Helvetica;letter-spacing:3px;text-transform:uppercase}.notes div{display:flex;justify-content:space-between;border-bottom:1px solid #3a242033}
.btn{position:absolute;left:60px;top:780px;width:260px;height:54px;background:#3a2420;color:#fbf2ee;font:700 12px/54px Helvetica;letter-spacing:4px;text-align:center}
.price{position:absolute;left:350px;top:794px;font:400 22px Georgia,serif}
</style></head><body>
<div class="lines" data-r="vertical-rules"></div>
<div class="mist1" data-r="mist-white"></div><div class="mist2" data-r="mist-pink"></div>
<div class="nav" data-r="nav"><b>ROSÉE</b><span>Fragrance</span><span>Ateliers</span><span>Gifts</span></div>
<h1 class="big" data-r="tracked-headline" data-must>ROSE</h1>
<div class="big2" data-r="italic-word" data-must>nuit</div>
<div class="refl" data-r="reflection"></div>
<div class="cap" data-r="cap" data-must></div><div class="neck" data-r="neck"></div>
<div class="bottle" data-r="glass-bottle" data-must></div><div class="shine" data-r="glass-shine"></div>
<div class="label" data-r="bottle-label">ROSÉE<small>EAU DE PARFUM</small></div>
<p class="note" data-r="copy">Damask rose at dusk, a thread of smoke, and something sweet you can't quite place. Made in Grasse, 50 ml.</p>
<div class="notes" data-r="notes-list"><div><span>Top</span><span>Pink pepper</span></div><div><span>Heart</span><span>Damask rose</span></div><div><span>Base</span><span>Oud, musk</span></div></div>
<div class="btn" data-r="buy-button" data-must>ADD TO BAG</div><div class="price" data-r="price">€145</div>
</body></html>
