<!doctype html><html><head><meta charset="utf-8"><title>Film festival</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#f1e7d0;font-family:Helvetica,Arial,sans-serif;color:#1b1b1b}

.ticket{position:absolute;left:860px;top:745px;width:360px;height:130px;background:#f2b632;border-radius:10px;-webkit-mask:radial-gradient(circle at 250px 0,#0000 14px,#000 15px) top/100% 51% no-repeat,radial-gradient(circle at 250px 100%,#0000 14px,#000 15px) bottom/100% 51% no-repeat;padding:20px 24px;display:flex}

.copy{position:absolute;left:60px;top:800px;width:420px;font:400 16px/1.55 Georgia,serif}
.cta{position:absolute;left:520px;top:810px;padding:16px 26px;background:#1b1b1b;color:#f1e7d0;font:700 14px Helvetica;letter-spacing:3px;box-shadow:6px 6px 0 #e23b2e}
</style></head><body>
