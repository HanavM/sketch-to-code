<!doctype html><html><head><meta charset="utf-8"><title>Photo editor</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#1c1d21;font-family:Helvetica,Arial,sans-serif;color:#d6d8de;font-size:13px}
.top{position:absolute;left:0;top:0;width:1280px;height:48px;background:#26272c;border-bottom:1px solid #000;display:flex;align-items:center;gap:22px;padding:0 18px}.top b{color:#fff;font-size:16px;margin-right:20px}.top span.on{color:#fff;border-bottom:2px solid #4c8dff;padding:14px 0}.top em{margin-left:auto;font-style:normal;background:#4c8dff;color:#fff;padding:7px 16px;border-radius:6px;font-weight:700}
.left{position:absolute;left:0;top:48px;width:220px;height:732px;background:#232428;border-right:1px solid #000;padding:16px}
.left h4,.right h4{font-size:11px;letter-spacing:1.5px;color:#8b8e98;margin:6px 0 10px}.left div{padding:8px 10px;border-radius:6px;display:flex;align-items:center;gap:10px}.left div i{width:28px;height:20px;border-radius:3px}.left div.on{background:#4c8dff33;color:#fff}
.stage{position:absolute;left:220px;top:48px;width:780px;height:732px;background:#141518}
.photo{position:absolute;left:300px;top:110px;width:620px;height:420px;background:radial-gradient(circle at 70% 30%,#ffe2a0 0 40px,#ffb86b00 41px),linear-gradient(180deg,#f7a65a 0,#f2785c 35%,#7a3d6b 58%,#2a2a4a 59%,#1b2a3a 100%)}
.hill{position:absolute;left:300px;top:390px;width:620px;height:140px;background:#141c2a;clip-path:polygon(0 60%,18% 30%,34% 55%,52% 20%,70% 50%,86% 35%,100% 55%,100% 100%,0 100%)}
.crop{position:absolute;left:360px;top:150px;width:480px;height:340px;border:2px solid #fff;box-shadow:0 0 0 999px #00000088;background:linear-gradient(#ffffff66,#ffffff66) 33.3% 0/1px 100% no-repeat,linear-gradient(#ffffff66,#ffffff66) 66.6% 0/1px 100% no-repeat,linear-gradient(#ffffff66,#ffffff66) 0 33.3%/100% 1px no-repeat,linear-gradient(#ffffff66,#ffffff66) 0 66.6%/100% 1px no-repeat}
.h{position:absolute;width:16px;height:16px;border-color:#fff;border-style:solid}.h1{left:356px;top:146px;border-width:4px 0 0 4px}.h2{left:828px;top:146px;border-width:4px 4px 0 0}.h3{left:356px;top:478px;border-width:0 0 4px 4px}.h4{left:828px;top:478px;border-width:0 4px 4px 0}
.ratio{position:absolute;left:520px;top:560px;display:flex;gap:6px}.ratio span{padding:6px 12px;border-radius:14px;background:#2c2d33}.ratio span.on{background:#fff;color:#111;font-weight:700}
.right{position:absolute;left:1000px;top:48px;width:280px;height:732px;background:#232428;border-left:1px solid #000;padding:16px}
.histo{width:248px;height:90px;background:#18191c;border-radius:6px;margin-bottom:18px}
.sl{margin-bottom:16px}.sl p{display:flex;justify-content:space-between;margin-bottom:7px}.sl p b{color:#fff;font-weight:600}.sl div{height:4px;border-radius:2px;background:#3a3b42;position:relative}.sl div i{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #000}
.film{position:absolute;left:0;top:780px;width:1280px;height:120px;background:#202125;border-top:1px solid #000;display:flex;gap:10px;padding:16px 18px}.film i{width:128px;height:86px;border-radius:4px;flex:none}.film i.on{outline:3px solid #4c8dff;outline-offset:2px}
</style></head><body>
<div class="top" data-r="top-bar"><b>Darkroom</b><span>Library</span><span class="on">Develop</span><span>Print</span><span>Share</span><em>Export</em></div>
<div class="left" data-r="presets-panel" data-must><h4>PRESETS</h4><div class="on"><i style="background:linear-gradient(90deg,#f7a65a,#7a3d6b)"></i>Golden hour</div><div><i style="background:linear-gradient(90deg,#9aa,#333)"></i>Silver mono</div><div><i style="background:linear-gradient(90deg,#7fd1c7,#2a5d7a)"></i>Teal &amp; orange</div><div><i style="background:linear-gradient(90deg,#f3d9c6,#c79a8a)"></i>Soft film</div><div><i style="background:linear-gradient(90deg,#ffde59,#ff5757)"></i>Pop</div><h4 style="margin-top:22px">HISTORY</h4><div>Crop 4:3</div><div>Exposure +0.35</div><div>Import</div></div>
<div class="stage" data-r="canvas-stage"></div>
<div class="photo" data-r="photo" data-must></div><div class="hill" data-r="photo-hills"></div>
<div class="crop" data-r="crop-box" data-must></div><i class="h h1" data-r="crop-handles"></i><i class="h h2"></i><i class="h h3"></i><i class="h h4"></i>
<div class="ratio" data-r="ratio-chips"><span>Free</span><span>1:1</span><span class="on">4:3</span><span>16:9</span></div>
<div class="right" data-r="adjust-panel" data-must><h4>HISTOGRAM</h4><svg class="histo" data-r="histogram" width="248" height="90"><path d="M0 90 L20 70 L50 40 L80 55 L110 30 L140 50 L170 20 L200 45 L230 60 L248 90Z" fill="#ff5a5a" fill-opacity=".55"/><path d="M0 90 L30 60 L60 50 L90 35 L120 55 L150 40 L180 50 L210 30 L248 90Z" fill="#4cd964" fill-opacity=".5"/><path d="M0 90 L25 50 L55 65 L85 45 L115 60 L145 30 L175 60 L205 70 L248 90Z" fill="#4c8dff" fill-opacity=".5"/></svg><h4>BASIC</h4><div class="sl"><p>Exposure<b>+0.35</b></p><div><i style="left:58%"></i></div></div><div class="sl"><p>Contrast<b>+12</b></p><div><i style="left:56%"></i></div></div><div class="sl"><p>Highlights<b>−40</b></p><div><i style="left:30%"></i></div></div><div class="sl"><p>Shadows<b>+28</b></p><div><i style="left:64%"></i></div></div><div class="sl"><p>Temperature<b>5600K</b></p><div style="background:linear-gradient(90deg,#4c8dff,#ffd25a)"><i style="left:62%"></i></div></div><div class="sl"><p>Tint<b>+6</b></p><div style="background:linear-gradient(90deg,#4cd964,#e05ae0)"><i style="left:53%"></i></div></div><div class="sl"><p>Vibrance<b>+20</b></p><div><i style="left:60%"></i></div></div></div>
<div class="film" data-r="filmstrip" data-must><i style="background:linear-gradient(160deg,#9cc8ff,#2b5d8a)"></i><i class="on" style="background:linear-gradient(180deg,#f7a65a,#7a3d6b 60%,#1b2a3a)"></i><i style="background:linear-gradient(160deg,#c8e6a0,#3d6b2a)"></i><i style="background:linear-gradient(200deg,#e0e0e0,#555)"></i><i style="background:linear-gradient(160deg,#ffd6e0,#a04a6a)"></i><i style="background:linear-gradient(160deg,#fbe39a,#a07a2a)"></i><i style="background:linear-gradient(160deg,#a0e0e0,#2a6a6a)"></i><i style="background:linear-gradient(160deg,#3a3a5a,#0a0a1a)"></i><i style="background:linear-gradient(160deg,#f2b6a0,#8a3a2a)"></i></div>
</body></html>
