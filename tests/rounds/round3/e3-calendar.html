<!doctype html><html><head><meta charset="utf-8"><title>Calendar</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#fff;font-family:Helvetica,Arial,sans-serif;color:#111827;overflow:hidden;padding:30px 48px}
.top{display:flex;align-items:center;gap:16px}h1{font-size:28px;margin-right:auto}.btn{padding:9px 16px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}.new{background:#16a34a;color:#fff;border-color:#16a34a}
.grid{display:grid;grid-template-columns:repeat(7,1fr);margin-top:22px;border-left:1px solid #e5e7eb;border-top:1px solid #e5e7eb}
.grid div{height:128px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:8px;font-size:13px;color:#6b7280}.grid .h{height:36px;font-weight:700;color:#374151;background:#f9fafb}
.ev{display:block;margin-top:6px;padding:4px 6px;border-radius:5px;font-size:12px;color:#fff}.g{background:#16a34a}.b{background:#2563eb}.o{background:#ea580c}
.today{background:#f0fdf4}
</style></head><body>
<div class="top"><h1 data-r="title" data-must>November 2026</h1><span class="btn" data-r="prev">‹ Prev</span><span class="btn">Today</span><span class="btn">Next ›</span><span class="btn new" data-r="new">+ New event</span></div>
<div class="grid" data-r="month" data-must><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div><div class="h">Sun</div>
<div>26</div><div>27</div><div>28</div><div>29</div><div>30</div><div>31</div><div>1</div>
<div>2<span class="ev b">Standup</span></div><div>3</div><div>4<span class="ev g">Design review</span></div><div>5</div><div>6<span class="ev o">Launch</span></div><div>7</div><div>8</div>
<div>9<span class="ev b">Standup</span></div><div>10</div><div class="today">11<span class="ev g">1:1 with Mia</span><span class="ev b">Planning</span></div><div>12</div><div>13</div><div>14</div><div>15</div>
<div>16<span class="ev b">Standup</span></div><div>17</div><div>18</div><div>19<span class="ev o">Offsite</span></div><div>20<span class="ev o">Offsite</span></div><div>21</div><div>22</div>
<div>23<span class="ev b">Standup</span></div><div>24</div><div>25<span class="ev g">Retro</span></div><div>26</div><div>27</div><div>28</div><div>29</div></div>
</body></html>
