<!doctype html><html><head><meta charset="utf-8"><title>Analytics</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f6f7fb;font-family:Helvetica,Arial,sans-serif;color:#111827;overflow:hidden;padding:32px 44px}
.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.range{padding:10px 16px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:14px}

.row{display:flex;gap:20px;margin-top:20px}.panel{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:20px;height:520px}.panel h3{font-size:16px;margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:14px;height:400px;border-bottom:1px solid #e5e7eb}.bars i{flex:1;background:#6366f1;border-radius:6px 6px 0 0}
.list div{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
</style></head><body>
