<!doctype html><html><head><meta charset="utf-8"><title>Gradient orbit</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;position:relative;overflow:hidden;background:#05010f;font-family:Helvetica,Arial,sans-serif;color:#e5e7eb}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(167,139,250,.35)}
.r1{left:340px;top:150px;width:600px;height:600px;animation:spin 40s linear infinite}
.r2{left:440px;top:250px;width:400px;height:400px;border-color:rgba(34,211,238,.45);animation:spin 25s linear infinite reverse}
.planet{position:absolute;left:910px;top:430px;width:46px;height:46px;border-radius:50%;background:#22d3ee;box-shadow:0 0 30px 8px rgba(34,211,238,.7)}
.pill{position:absolute;left:510px;top:240px;width:260px;padding:8px 0;text-align:center;border-radius:999px;border:1px solid rgba(167,139,250,.5);font-size:13px;letter-spacing:2px;color:#c4b5fd}
h1{position:absolute;left:140px;top:300px;width:1000px;text-align:center;font-size:110px;line-height:1;font-weight:800;letter-spacing:-4px;background:linear-gradient(90deg,#a78bfa,#f472b6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:absolute;left:340px;top:540px;width:600px;text-align:center;font-size:19px;line-height:1.5;color:#9ca3af}
.cta{position:absolute;left:530px;top:640px;width:220px;padding:18px 0;text-align:center;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;font-weight:700;box-shadow:0 0 40px rgba(219,39,119,.6)}
</style></head><body>
<div class="ring r1" data-r="ring-outer"></div><div class="ring r2" data-r="ring-inner"></div>
<div class="planet" data-r="planet"></div>
<div class="pill" data-r="tag">NOW IN PRIVATE BETA</div>
<h1 data-r="headline" data-must>Compute at orbit speed</h1>
<p class="sub" data-r="body">Spin up GPU clusters in seconds and pay only for the seconds you use.</p>
<a class="cta" data-r="cta" data-must>Request access</a>
</body></html>
