<!doctype html><html><head><meta charset="utf-8"><title>Wave Fest</title><style>

<div class="bar" style="left:1000px;height:360px;background:#22c55e" data-r="bar-4" data-must></div>
<div class="bar" style="left:1120px;height:140px;background:#3b82f6" data-r="bar-5"></div>
<div class="line"></div>
