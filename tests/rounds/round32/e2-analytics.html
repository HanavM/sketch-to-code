<!doctype html><html><head><meta charset="utf-8"><title>Analytics</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#f8fafc;font-family:Helvetica,Arial,sans-serif;color:#0f172a;overflow:hidden;display:flex}
aside{width:220px;height:900px;background:#1e293b;color:#cbd5e1;padding:28px 24px;font-size:15px;line-height:2.6}
aside b{display:block;color:#fff;font-size:20px;margin-bottom:24px}aside .on{color:#fff;background:#334155;margin:0 -12px;padding:0 12px;border-radius:6px}
main{flex:1;padding:32px 40px}
h1{font-size:26px;margin-bottom:24px}
.stats{display:flex;gap:20px}
.s{flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px}
.s small{font-size:13px;color:#64748b}.s div{font-size:32px;font-weight:800;margin-top:8px}.s em{font-style:normal;font-size:13px;color:#16a34a;font-weight:700}
.chart{margin-top:24px;height:330px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;display:flex;align-items:flex-end;gap:18px}
.chart i{flex:1;background:#3b82f6;border-radius:4px 4px 0 0}
.table{margin-top:24px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}
.row{height:44px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;padding:0 20px;font-size:14px;justify-content:space-between}
</style></head><body>
<aside data-r="sidebar" data-must><b>Metricly</b><div class="on">Overview</div><div>Traffic</div><div>Revenue</div><div>Users</div><div>Settings</div></aside>
<main><h1 data-r="title">Overview</h1>
<div class="stats" data-r="stat-row" data-must><div class="s"><small>Visitors</small><div>48,210</div><em>+12%</em></div><div class="s"><small>Signups</small><div>1,394</div><em>+4%</em></div><div class="s"><small>Revenue</small><div>$22.8k</div><em>+9%</em></div><div class="s"><small>Churn</small><div>2.1%</div><em>−0.3%</em></div></div>
<div class="chart" data-r="bar-chart" data-must><i style="height:40%"></i><i style="height:55%"></i><i style="height:48%"></i><i style="height:70%"></i><i style="height:62%"></i><i style="height:85%"></i><i style="height:78%"></i><i style="height:92%"></i><i style="height:66%"></i><i style="height:74%"></i><i style="height:88%"></i><i style="height:100%"></i></div>
<div class="table" data-r="table"><div class="row"><span>/pricing</span><span>8,402</span></div><div class="row"><span>/blog/launch</span><span>6,118</span></div><div class="row"><span>/docs</span><span>4,960</span></div></div>
</main></body></html>
