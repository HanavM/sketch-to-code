<!doctype html><html><head><meta charset="utf-8"><title>Aurora Fest</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:linear-gradient(160deg,#0b1026 0%,#1e1b4b 55%,#134e4a 100%);font-family:Helvetica,Arial,sans-serif;color:#fff;overflow:hidden;position:relative}
nav{position:absolute;top:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 72px;font-size:15px;letter-spacing:2px}
nav b{font-size:20px}nav span{opacity:.8}
.wave{position:absolute;left:-80px;top:250px;width:1500px;height:260px;border-radius:50%;background:linear-gradient(90deg,rgba(45,212,191,.55),rgba(167,139,250,.55));filter:blur(40px);transform:rotate(-8deg)}
h1{position:absolute;left:72px;top:200px;font-size:190px;line-height:.9;font-weight:900;letter-spacing:-6px}
.date{position:absolute;left:78px;top:600px;font-size:26px;font-weight:600;letter-spacing:3px;color:#5eead4}
.lineup{position:absolute;right:72px;top:560px;width:420px;font-size:18px;line-height:1.9;text-align:right;color:#e0e7ff}
.btn{position:absolute;left:78px;top:680px;background:#5eead4;color:#0b1026;font-weight:800;font-size:18px;padding:20px 38px;border-radius:40px}
</style></head><body>
<nav data-r="nav"><b data-r="logo">AURORA</b><span>LINEUP · TICKETS · TRAVEL</span></nav>
<div class="wave" data-r="aurora-band" data-must></div>
<h1 data-r="headline" data-must>NORTH<br>LIGHTS</h1>
<div class="date" data-r="date">14–16 FEB · TROMSØ</div>
<div class="lineup" data-r="lineup">Halvard · Mira Sol · The Ice Choir<br>Northbound · Lumen · Kaja Vik</div>
<div class="btn" data-r="cta" data-must>Get passes</div>
</body></html>
