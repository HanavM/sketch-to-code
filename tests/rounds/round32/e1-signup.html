<!doctype html><html><head><meta charset="utf-8"><title>Sign up</title><style>
*{box-sizing:border-box;margin:0}body{width:1280px;height:900px;background:#eef2ff;font-family:Helvetica,Arial,sans-serif;color:#1e1b4b;overflow:hidden}
.card{position:absolute;left:440px;top:120px;width:400px;background:#fff;border-radius:16px;padding:40px;box-shadow:0 10px 30px rgba(30,27,75,.08)}
h1{font-size:28px;margin-bottom:8px}.sub{font-size:15px;color:#6366f1;margin-bottom:28px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}
.in{height:44px;border:1px solid #c7d2fe;border-radius:8px}
.btn{margin-top:28px;height:50px;background:#4f46e5;color:#fff;font-weight:700;font-size:16px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.alt{margin-top:20px;text-align:center;font-size:14px;color:#64748b}
</style></head><body>
<div class="card" data-r="card" data-must>
<h1 data-r="title">Create account</h1><div class="sub">Free for 14 days</div>
<label>Full name</label><div class="in" data-r="name-field"></div>
<label>Email</label><div class="in" data-r="email-field"></div>
<label>Password</label><div class="in" data-r="password-field"></div>
<div class="btn" data-r="submit" data-must>Sign up</div>
<div class="alt">Already have an account? Log in</div>
</div></body></html>
