  - "n7: tests/e2e/motion-add-recolour.mjs starts its own vite on :5264; it simulates the hot reload by inserting the new link itself. growLanded (main.ts) grows fresh nodes in the reload's MO task."
  - "n7: motion-erase fails p95 (33 ms) in this sandbox on the agent baseline too: the first frame after lift is held 33 ms. To fix in n8."
  - "n8: tests/e2e/shared-plane.mjs starts its own vite on :5265, chains 22 manipulate edits, writes docs/motion/shared-plane.json. PlanCard refuses move/resize (dynamic className): codemod gap. optimistic-ring/queue start their own vite on :5199: free the port first."
  - "n10: try/n2-codemod-follow is cut from try/n1-motion-layer (needs its motion + shared-plane work). POST /@s2c/direct writes plain erase/recolour (applyDirectEdit); runFlight tries it before /@s2c/interpret. Tests that want the model path must refuse /@s2c/direct (see motion-erase). tests/e2e/direct-erase-recolour.mjs starts vite on :5266. Large erases (>35% viewport) and drawn additions still go to the model."
  - "n9: undo-preview.ts records each committed manipulate edit's visual inverse (class swap eased by WAAPI; reorder by inline order, released when the children are back in order). /@s2c/undo now returns sha; a mismatching preview is reverted. tests/e2e/ten-in-a-row.mjs starts vite on :5267; aim at stable boxes (glides in flight make picks miss)."
  - "n12: undo-preview.ts captureErase keeps a ghost copy (stamps stripped, data-s2c-ghost) and matches it back by tag+text, not srcLoc (per-line stamps shift after a delete). tests/e2e/undo-direct.mjs starts vite on :5268. landDirect now joins commitsInFlight."
  - "n13: tests/e2e/mixed-ten.mjs starts vite on :5269. Leaving draw for tweak flushes a pending plain erase/recolour (flushAuto). __s2cLanded is an object after a manipulate commit, a list after drawings (pushLanded). motion-resize can flake under load right after other e2es; rerun alone."
  - "n11: POST /@s2c/direct kind insert (insert-copy.ts) copies the slot neighbour (plain leaf, written once) with the typed note; landInsert (main.ts) waits for growLanded. Unkeyed rows reload by shifting text: Flip.playShifted glides by words. tests/e2e/direct-insert.mjs starts vite on :5270. caret-insert.mjs now takes the direct path too."
  - "n15: undo-preview.ts playUnadd hides the added node, fades an in-flow copy, then FLIPs the row; tests/e2e/undo-insert.mjs starts vite on :5271."
  - "n16: onDown hands a counting plain change (optimistic erase/recolour, or caret preview + its word) to the code when the press lands >24 px clear of it (handOffElsewhere); pen asserts in mixed-ten count ink >=1, since the old ink leaves with it. Insert previews keep their lift-time key (notes 0): compare the strokes part only."
  - "n16: caret-insert.mjs fails 4 checks on the baseline too (expects the model path; n11 made it direct). Fix or retire it in verify."
  - "n14: S2C_RECORD=<dir> makes mixed-ten film itself (webm + marks.json); node tests/e2e/motion-proof.mjs films (gap 1.6 s), cuts docs/motion/proof/*.gif and writes docs/motion/REPORT.md; --rec <dir> reuses a film. Run plain mixed-ten first: the report's timing table reads docs/motion/mixed-ten.json. Filming on 2 cores drops fps to ~40-55, so timings come from the unfilmed run."
  - "n14 finding: in mixed-ten the FIRST drag (reorder card 1->3) shows 190-320 ms after the first move in 5 of 6 runs today, agent baseline too (later drags 1-5 ms). Frames keep coming (no long task), so the reorder waits on something on first use: n17."
  - "n17: a card in a clipping row drags as a fixed copy on <body> (data-s2c-ghost); mixed-ten counts it (frame.lift) and reports shown/pageMovedMs. The old 190-320 ms was the row reflow on reaching slot 3, not a delay."
  - "n17 finding: 1 of 4 mixed-ten runs failed undo 1 (resize grid item): 'Invite a teammate' h jumped 25/40 px in one frame at +77 ms: n18."
  - "n18: motion.steady(anim, relocate?) paces main-thread (width/height) eases by painted frames (<=25 ms of curve per frame); easeClasses + settleBoxes focus use it. Read all end values before starting any ease. Clear examples/demo-app/.sketch2code between e2e runs (history piles up)."
  - "n18 finding: in this sandbox today, mixed-ten pen edits after the drawn addition (erase Revenue, recolour Settings) show only at ~760 ms (auto-run countdown) and go to the model in ~4 of 5 runs, agent baseline too: n19. ten-in-a-row commits 8-9/10 here on baseline too."
  - "n19: endFlight clears autoBusy before scheduleAuto (else the countdown for a drawing finished mid-landing was dropped). Reproduce load: two `node -e busy-loop` hogs alongside mixed-ten (nproc 2); one hog is not enough."
  - "n20: captureInsert returns {grew, take}; grew() records the added node's look when it grows, take() re-finds that look if an unkeyed reload moved its words. mixed-ten S2C_NAV_DEBUG=<file> dumps per-frame nav state (text, x, display, opacity, unadd, ghost) for the undo phase. Invisible boxes (opacity<0.05) no longer count as jumps."
  - "n20 finding: under two hogs, 1 of 3 runs again sent the 2 pen edits after the addition to the model (760 ms, n19 symptom); undo 8 (resize card taller) is previewed:false in 3/3 loaded runs; undo 10 nav Overview hop in 2/3."
  - "n21: undo-preview slotsOf(srcLoc) counts erase ghosts as instances; class undo falls back to captured nodes (ghostOf) when stamps carry an earlier undo's line numbers; restore ghosts anchor on prev/next neighbour by look and copy its inline order; unadd follow() moves the hide when another reload shifts words; confirmed previews hold 10 s. Reloads under two hogs can land 4-5 s after the undo."
  - "n21 finding: under two hogs, 3 of 6 mixed-ten runs sent the 2 pen edits after the drawn addition to the model again (status 'note attached — on this stroke', visible ~560-900 ms); the erase joins the addition's drawing: n22. Unloaded, the add ghost shows at 53-56 ms in 2 of 3 runs (>50): n22 too."
  - "n22: scheduleAuto keeps the timer on a hold block (note open); autoTick pauses it. Before, a landing during a caret's typed word dropped the countdown for good. Unloaded the add ghost was 26-46 ms in mixed-ten (3/3); direct-insert first ghost 57-98 ms in 2/5: n23."
  - "n23: warm-pen.ts runs the lift readings on made-up strokes plus one ~invisible ghost (.pv[data-s2c-warm]) in idle slices, 1.2 s after boot and on entering draw. Run npm run build before e2e (vite plugin resolves built packages). optimistic-preview.mjs needs a stub vite on :5199 started by hand."
  - "n24: the n23 warm-up ghost (.pv[data-s2c-warm], class pg warm) sits in #pending for 2 frames; e2e watchers of #pending must skip it (fixed in 5 scripts). Fresh clone: run npm ci first (node_modules is not committed)."
  - "Baseline: npm run typecheck is broken (TS6310); npm run build is the real type check. npm test has 2-3 env-only fails (cli init gh, library home-dir)."
