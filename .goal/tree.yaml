  - {id: c6, text: "Proof to watch: a short screen recording or GIF per gesture, plus a frame-timing report.", state: open, evidence: "docs/motion/proof/{erase,add,reorder,move,resize,recolour,undo}.gif + docs/motion/REPORT.md re-filmed on agent 571a1da (n17): every edit visible 1-20 ms, 60 fps; to re-check in verify"}
