  - {id: c5, text: "Ten edits in a row in under 20 s, no waiting, all land correctly in code; undo is just as instant and smooth.", state: open, evidence: "partial: ten-in-a-row.mjs (n9, try/n2-codemod-follow b9fc0c0) 10 drag/resize/move edits in 10.3 s all in code, 10 undos visible 20-35 ms, glide, source back to start, 3/3 runs; erase/recolour undo still server-only"}
