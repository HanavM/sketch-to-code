notes:
  - "Overlay bundle may import only @s2c/ink/classify, never @s2c/ink (node:zlib); a bad import shows as no overlay in e2e."
  - "The vite plugin caches the overlay bundle per dev-server boot: restart the demo server after overlay edits."
  - "Playwright here wants headless_shell-1234; point PLAYWRIGHT_BROWSERS_PATH at a dir linking chrome-headless-shell to /opt/pw-browsers/chromium."
  - "Quick reading must match plain-reading.ts exactly; on big pages the server menu cap (MENU_CAP) could still diverge: a false hide is rolled back, a miss just waits for the run."
  - "Spent so far: n8 ran 3 live runs (move, insert, section) through Claude Code; estimate under 100k tokens today. Earlier steps a few thousand."
  - "optimistic-preview.mjs flaked once on the first run after a fresh dev-server boot (insert: run never started); passed on rerun."
  - "Run e2e with S2C_CHROMIUM=/opt/pw-browsers/chromium (simpler than the PLAYWRIGHT_BROWSERS_PATH symlink)."
  - "Move/insert/section are model readings; the preview is drawn in the overlay's own #pending layer, never in the app DOM. A box counts as empty space if no worded element or stamped leaf is under its centre or 20% under it."
  - "Don't pkill -f with a pattern that appears in your own command line: it kills the shell. Use fuser -k 5199/tcp."
  - "The model reading (/@s2c/interpret) runs even when /@s2c/run is stubbed and can take 20+ s on a cold server: give e2e waits 60-90 s."
  - "Never draw on the demo in auto mode without stubbing /@s2c/run: a real run writes the demo source (git checkout + remove untracked files after)."
  - "__S2C_DEBUG__.runDone / runError end a run from e2e with no server run (used by optimistic-preview-reconcile.mjs)."
baseline_notes: "On agent at 36c6700: npm test 1303 pass / 3 fail (cli deps+init, pipeline library home-dir; look environment-specific: run as root). The npm run typecheck script is broken (tsc -b with --noEmit gives TS6310); npm run build (tsc -b) is clean and is the real type check. Treat these as pre-existing."
