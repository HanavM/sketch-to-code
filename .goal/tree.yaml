criteria:
  - {id: c1, text: "Each round has 10 target pages (5 creative landing, 5 everyday), each with a reference to compare against, harder than the round before.", state: open, evidence: null}
  - {id: c2, text: "Each page is built only with the drawing tools, and the run records ease: marks, words, fixes, time and tokens.", state: open, evidence: null}
  - {id: c3, text: "Each built page is scored for likeness to its target by a measure independent of the pipeline (picture likeness plus block layout).", state: open, evidence: null}
  - {id: c4, text: "Between rounds the tools improve from what failed, and re-running earlier pages shows the gain (scores up or fewer fixes).", state: open, evidence: null}
  - {id: c5, text: "The final round's hardest creative pages (layered, asymmetric, expressive type, motion) are built to a high likeness.", state: open, evidence: null}
  - {id: c6, text: "Live model use is logged per day (GOAL.md no longer sets a cap).", state: open, evidence: null}
  - {id: c7, text: "Proof to watch: per round, target vs built side by side, with scores and a short write-up.", state: open, evidence: null}
nodes:
  - {id: n0, parent: null, kind: goal, title: "Build ever harder creative and everyday web pages by drawing, scoring and improving the tools each round", status: open}
  - {id: n1, parent: n0, kind: approach, title: "Round bench: reference pages as HTML, a hand-planned sketch per page drawn through the real overlay on a blank app, scored by screenshot likeness + block layout; fix the worst gap each round", status: active,
     branch: try/n1-round-bench, result: null}
  - {id: n2, parent: n0, kind: approach, title: "Auto-sketch from the target: derive rough strokes and words from the reference page's own boxes, so every page is drawn the same honest way and rounds scale cheaply", status: active,
     branch: try/n2-auto-sketch, result: null}
  - {id: n3, parent: n0, kind: approach, title: "Grow the visual vocabulary first: catalogue creative techniques (gradients, overlap, big type, texture, motion) and add drawable/wordable ways to ask for each, tested on single sections", status: active,
     branch: try/n3-vocabulary, result: null}
  - {id: n4, parent: n1, kind: step, title: "Round 1 set: 5 easy creative + 5 easy everyday reference pages, a likeness scorer (pixel/structure), sketches for each, dry run free; then one live page to calibrate cost", status: done,
     result: "10 targets, sketches and likeness score built; blank pages score 0-3%. Live page 1: reading failed (max turns 4). 9211030."}
  - {id: n5, parent: n1, kind: step, title: "First live build fails: whole-page design sketch reading hits 'maximum number of turns (4)'. Find why, fix it, then build all 10 round-1 pages live and score them", status: done,
     result: "Cause: bad JSON retries; salvage added, 9 readings ok. Live c1 35%, e1 11% likeness; budget stops more today. cc58ecd."}
  - {id: n6, parent: n1, kind: step, title: "Fix c1's gaps (page frame drawn became wavy edges; nav and subheading dropped; headline not huge), re-run c1, then build e2-e5, c2-c5 as budget allows", status: done,
     result: "Notes now attach where typed (focus); c1 35%->48%, menu and subtitle back. e2 31%, e3 14%. c61306e."}
