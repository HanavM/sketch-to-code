criteria:
  - {id: c1, text: "Each round has 10 target pages (5 creative landing, 5 everyday), each with a reference to compare against, harder than the round before.", state: met, evidence: "Rounds 1-7 each have 10 targets, 5 creative + 5 everyday, as HTML references (tests/rounds/roundN/*.html on try/n3-vocabulary); each round's notes list the harder techniques it adds (r1 hero/login to r7 isometric stack, torn collage, kanban, admin table)."}
  - {id: c2, text: "Each page is built only with the drawing tools, and the run records ease: marks, words, fixes, time and tokens.", state: met, evidence: "Every built page was drawn through the overlay from a plan (no hand code); each run digest (built/runs/*.json) records marks and words (actions), fix turns (sends), time (ms) and tokens. Rounds 2 and 3 have 7 and 2 pages never built."}
  - {id: c3, text: "Each built page is scored for likeness to its target by a measure independent of the pipeline (picture likeness plus block layout).", state: met, evidence: "Likeness v3 = picture colour + structure after one zoom/offset, plus block layout (tests/rounds/lib/likeness.mjs), separate from the pipeline; all 61 latest builds re-scored 2026-10-23 (tests/rounds/SCORES.md)."}
  - {id: c4, text: "Between rounds the tools improve from what failed, and re-running earlier pages shows the gain (scores up or fewer fixes).", state: met, evidence: "Fixes between rounds and re-runs raised old pages: r1 sunset hero 35 to 79, r2 settings 6 to 36, r3 analytics 26 to 69, r7 admin table 59 to 83; round averages 67, 58, 69, 64, 76, 79, 81."}
  - {id: c5, text: "The final round's hardest creative pages (layered, asymmetric, expressive type, motion) are built to a high likeness.", state: open, evidence: null}
  - {id: c6, text: "Live model use is logged per day (GOAL.md no longer sets a cap).", state: met, evidence: "Token ledger lines per day in tree notes (2026-10-21 ~930k, 2026-10-22, 2026-10-23 ~466k so far) and tests/rounds/LIVE-2026-10-22.md."}
  - {id: c7, text: "Proof to watch: per round, target vs built side by side, with scores and a short write-up.", state: met, evidence: "Side-by-sides (target left, built right) for every built page of rounds 1-7 under tests/rounds/roundN/built/*-cmp.png with a write-up per round (NOTES.md / RESULTS.md) and scores in tests/rounds/SCORES.md, all on try/n3-vocabulary. Round 2 shows 3 of 10 pages."}
nodes:
  - {id: n0, parent: null, kind: goal, title: "Build ever harder creative and everyday web pages by drawing, scoring and improving the tools each round", status: open}
  - {id: n1, parent: n0, kind: approach, title: "Round bench: reference pages as HTML, a hand-planned sketch per page drawn through the real overlay on a blank app, scored by screenshot likeness + block layout; fix the worst gap each round", status: active,
     branch: try/n1-round-bench, result: null}
  - {id: n2, parent: n0, kind: approach, title: "Auto-sketch from the target: derive rough strokes and words from the reference page's own boxes, so every page is drawn the same honest way and rounds scale cheaply", status: active,
     branch: try/n2-auto-sketch, result: null}
  - {id: n3, parent: n0, kind: approach, title: "Grow the visual vocabulary first: catalogue creative techniques (gradients, overlap, big type, texture, motion) and add drawable/wordable ways to ask for each, tested on single sections", status: active,
     branch: try/n3-vocabulary, result: null}
  - {id: n4, parent: n1, kind: step, title: "Round 1 set: 5 easy creative + 5 easy everyday reference pages, a likeness scorer (pixel/structure), sketches for each, dry run free; then one live page to calibrate cost", status: done,
     result: "10 targets, sketches and likeness score built; blank pages score 0-3%. Live page 1: reading failed (max turns 4). 9211030."}
  - {id: n5, parent: n1, kind: step, title: "First live build fails: whole-page design sketch reading hits 'maximum number of turns (4)'. Find why, fix it, then build all 10 round-1 pages live and score them", status: done,
     result: "Cause: bad JSON retries; salvage added, 9 readings ok. Live c1 35%, e1 11% likeness; budget stops more today. cc58ecd."}
  - {id: n6, parent: n1, kind: step, title: "Fix c1's gaps (page frame drawn became wavy edges; nav and subheading dropped; headline not huge), re-run c1, then build e2-e5, c2-c5 as budget allows", status: done,
     result: "Notes now attach where typed (focus); c1 35%->48%, menu and subtitle back. e2 31%, e3 14%. c61306e."}
  - {id: n7, parent: n1, kind: step, title: "Drawn size and place carry through: headline line spacing sets type size (c1 headline half size), builds sit 25-60px low and wider than drawn (e1-e3); fix, check free with dry/readings, then live c2-c5, e4-e5 on the next day's budget", status: done,
     result: "Line spacing now sets type size; codegen told regions are exact. c1 48%->57%, headline big. 2431d65."}
  - {id: n9, parent: n2, kind: step, title: "Auto-plan marks and words from target computed style (zero tokens); compare with round-1 hand plans; dry-draw all 10 through the overlay", status: done,
     result: "Rules match hand marks 52/53; words similar or more (copy quoted). Dry run draws all 10. Tuned on round 1 only. 2e030cb."}
  - {id: n10, parent: n2, kind: step, title: "Generality check, free: write round-2 targets (harder: overlap, asymmetry, big type, dense everyday UI) WITHOUT tuning, auto-plan them, read the plans for wrong marks/notes; fix rules only for clear misses", status: done,
     result: "10 harder targets; untuned plans missed glass, tilt, outline type, toggles, cards; general fixes; round1 still 52/53. 28f8604."}
  - {id: n11, parent: n2, kind: step, title: "Round 2 live starter (needs 2026-10-22 budget after n12, ~90k, --budget): build c2 outline-bleed, c3 glass, e3 settings from auto plans; see which hard effects survive and fix the worst", status: done,
     result: "c3 46%, e3 6% (looks near-identical), c2 38%: off-screen bleed marks broke drawing; bench now clamps. 2ed2452."}
