  - {id: c1, text: "Each round has 10 target pages (5 creative landing, 5 everyday), each with a reference to compare against, harder than the round before.", state: open, evidence: null}
  - {id: c2, text: "Each page is built only with the drawing tools, and the run records ease: marks, words, fixes, time and tokens.", state: open, evidence: null}
  - {id: c3, text: "Each built page is scored for likeness to its target by a measure independent of the pipeline (picture likeness plus block layout).", state: open, evidence: null}
  - {id: c4, text: "Between rounds the tools improve from what failed, and re-running earlier pages shows the gain (scores up or fewer fixes).", state: open, evidence: null}
  - {id: c5, text: "The final round's hardest creative pages (layered, asymmetric, expressive type, motion) are built to a high likeness.", state: open, evidence: null}
  - {id: c6, text: "Live model use is logged per day (GOAL.md no longer sets a cap).", state: open, evidence: null}
  - {id: c7, text: "Proof to watch: per round, target vs built side by side, with scores and a short write-up.", state: open, evidence: null}
