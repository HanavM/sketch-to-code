notes:
  - "Hand session: node tests/hand/session.mjs (needs npm ci + npm run build; chromium at /opt/pw-browsers/chromium-1243). Drive it with curl -d JSON ops open/stroke/note/pen/undo/look/run/done on localhost:5390. Stop it with fuser -k 5390/tcp 5302/tcp, never pkill -f (it kills the calling shell)."
  - "Don't open target HTML, targets.json, effects.json, autoplan files or round NOTES while sketching. Only ref/*.png. The session loads targets.json itself, only to score at done."
  - "Merging try/n1-hand-bench into agent is a big merge (agent was cut from seed2tree; ~1,700 files differ). Do it when the first feature is proven, with tests run on the merge."
  - "After npm ci, the agent SDK may only have its musl binary: run npm install --no-save @anthropic-ai/claude-agent-sdk-linux-x64@<same version> or every Run fails in under a second."
  - "Vitest: same 2 env-only failures (cli init gh, library home dir). npm run build is the type check."
  - "Token ledger: 2026-10-27 n1 baseline live builds ~162k billed (c1 60k, e1 102k); n5 ~256k billed (e2 39k, c3 101k, e3 116k). Day total ~418k. 2026-10-28 n6 ~391k billed (bento 47k, grid 68k, orbit 62k, seats 83k, diagonal 131k); n7 ~249k; n8 ~310k (grid 91k + 59k, diagonal 105k, orbit 54k); n14 ~132k (diagonal 77k + 55k); n15 ~125k (diagonal 67k + 59k). n16 ~102k billed (diagonal 58k, 44k); n20 ~130k billed (login 50k, 49k, 31k); n12 ~115k billed (glass 48k, orbit 66k); n22 ~274k billed (login 44k, 30k, 31k, 20k, 53k, 51k; settings 45k); n24 ~139k billed (settings 85k, 54k); n25 ~124k billed (settings 83k, 40k); n21 ~185k billed (bento 131k, 54k; two stalled builds billed ~0); n27 ~487k billed (c1 107k, c2 30k, c3 121k, c4 93k, c5 136k); n28 ~441k billed (e1 121k, e2 104k, e3 44k, e4 95k, e5 78k); n29 ~241k billed (inbox 90k, 41k; weather 110k); n30 ~111k billed (weather 60k, 51k). n37 ~406k billed (aurora 150k, synth 79k, roastery 116k, 62k). n43 ~233k billed (aurora 47k, roastery 91k, studio 60k, bookshop 35k). n44 ~335k billed (studio 90k, 109k; bookshop 42k, 43k, 50k). 2026-10-29 n49 ~517k billed (surf 153k, agency 109k, ticket 87k, herbs 51k, cabins 118k); n51 ~349k billed (cabins 78k, 80k; surf 84k, 107k); n55 ~309k billed; n56 ~224k billed (herb 54k, 66k, 53k, 51k) plus one control replay not kept. n61 ~259k billed (ticket controls 74k, 72k; tries 51k, 62k); n62 ~294k billed (agency 92k, 70k, 54k, 79k); n64 ~155k billed (agency 89k, 66k)."
