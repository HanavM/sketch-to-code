notes:
  - "Previous goal (instant drawn changes) archived in .goal/archive/2026-10-18-instant-drawn-changes; its notes on e2e setup still apply."
  - "Run e2e with S2C_CHROMIUM=/opt/pw-browsers/chromium."
  - "The vite plugin caches the overlay bundle per dev-server boot: restart the demo server after overlay edits."
  - "Overlay bundle may import only @s2c/ink/classify, never @s2c/ink (node:zlib)."
  - "Never draw on the demo in auto mode without stubbing /@s2c/run: a real run writes the demo source."
  - "Don't pkill -f with a pattern in your own command line; use fuser -k <port>/tcp."
  - "Already there: optimistic.ts (scribble hide, ring recolour), preview.ts (dashed move/insert/section previews), tweak mode with handle resize + free-move drag committed by /@s2c/manipulate (0 tokens, codemod: move, resize, reorder)."
  - "n4: tests/e2e/motion-erase.mjs needs the demo dev server on :5199 (S2C_STUB_MODEL=1); writes docs/motion/erase-frames.json. optimistic-scribble/queue now count a fade (opacity < 0.97) as visible."
  - "n4: rAF frames in headless Chromium run at 16.7 ms; a just-created animation can hold its first keyframe 2-3 frames, so the first keyframe itself must show the change."
  - "n5: tests/e2e/motion-reorder.mjs starts its own vite on :5262. live-canva.mjs ignores S2C_CHROMIUM: run it with PLAYWRIGHT_BROWSERS_PATH at a dir linking chromium_headless_shell-1234/chrome-headless-shell-linux64/chrome-headless-shell to /opt/pw-browsers/chromium, vite on :5211."
  - "n5: commitManipulation takes an optional hold {root, capture, release, fail}; holdUntilLanded releases inside the hot reload's MutationObserver task. Resize still clears width/height before the reload (snap back): n6."
  - "n6: tests/e2e/motion-resize.mjs starts its own vite on :5263 (stat card height pull, cancel, ContactForm move hold). live-reorder.ts pushedBy/boxesOf/settleBoxes hold any inline-styled edit."
  - "n7: tests/e2e/motion-add-recolour.mjs starts its own vite on :5264; it simulates the hot reload by inserting the new link itself. growLanded (main.ts) grows fresh nodes in the reload's MO task."
  - "n7: motion-erase fails p95 (33 ms) in this sandbox on the agent baseline too: the first frame after lift is held 33 ms. To fix in n8."
  - "n8: tests/e2e/shared-plane.mjs starts its own vite on :5265, chains 22 manipulate edits, writes docs/motion/shared-plane.json. PlanCard refuses move/resize (dynamic className): codemod gap. optimistic-ring/queue start their own vite on :5199: free the port first."
  - "n10: try/n2-codemod-follow is cut from try/n1-motion-layer (needs its motion + shared-plane work). POST /@s2c/direct writes plain erase/recolour (applyDirectEdit); runFlight tries it before /@s2c/interpret. Tests that want the model path must refuse /@s2c/direct (see motion-erase). tests/e2e/direct-erase-recolour.mjs starts vite on :5266. Large erases (>35% viewport) and drawn additions still go to the model."
  - "n9: undo-preview.ts records each committed manipulate edit's visual inverse (class swap eased by WAAPI; reorder by inline order, released when the children are back in order). /@s2c/undo now returns sha; a mismatching preview is reverted. tests/e2e/ten-in-a-row.mjs starts vite on :5267; aim at stable boxes (glides in flight make picks miss)."
  - "Baseline: npm run typecheck is broken (TS6310); npm run build is the real type check. npm test has 2-3 env-only fails (cli init gh, library home-dir)."
